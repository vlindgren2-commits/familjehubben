    // --- MATSEDEL MED AI-INKÖP, RECEPTBANK & ORECENSERADE RECEPT ---

    function MealPlanner({ meals = {}, recipes = [], dismissedRecipes = [], updateData }) {

      const days = ['Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör', 'Sön'];

      const [subTab, setSubTab] = useState('menu');

      const [activeWeek, setActiveWeek] = useState('current'); 

      const [isFetching, setIsFetching] = useState(false);

      const [showScraperFor, setShowScraperFor] = useState(null);

      const [pickerForDay, setPickerForDay] = useState(null);

      const [portions, setPortions] = useState(4);

      const [successMsg, setSuccessMsg] = useState('');



      // Formulär för Receptbanken

      const [recTitle, setRecTitle] = useState('');

      const [recLink, setRecLink] = useState('');

      const [recNotes, setRecNotes] = useState('');

      const [recTaste, setRecTaste] = useState(5);

      const [recEase, setRecEase] = useState(4);

      const [editingRecId, setEditingRecId] = useState(null);



      const handleChange = (day, field, value) => {

        updateData('meals', prev => ({

          ...prev,

          [activeWeek]: {

            ...(prev[activeWeek] || {}),

            [day]: { ...(prev[activeWeek]?.[day] || {}), [field]: value }

          }

        }));

      };



      const selectRecipeForDay = (day, recipe) => {

        updateData('meals', prev => ({

          ...prev,

          [activeWeek]: {

            ...(prev[activeWeek] || {}),

            [day]: { title: recipe.title, link: recipe.link || '' }

          }

        }));

        setPickerForDay(null);

      };



      const fetchIngredients = async (day) => {

        const mealObj = meals[activeWeek]?.[day] || {};

        const url = mealObj.link;

        if (!url) return;

        setIsFetching(true);

        try {

          const payload = {

            contents: [{ role: 'user', parts: [{ text: `Jag vill laga receptet från denna länk: ${url} för ${portions} personer. Ge mig enbart en lista med ingredienserna i JSON-format som en array av objekt: [{"amount": "mängd", "item": "ingrediens"}].` }] }],

            tools: [{ "google_search": {} }],

            generationConfig: { responseMimeType: "application/json" }

          };

          const apiKey = "";

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {

            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)

          });

          const result = await response.json();

          if (result.candidates?.[0]?.content?.parts?.[0]?.text) {

            const ingredients = JSON.parse(result.candidates[0].content.parts[0].text);

            const newGroceries = ingredients.map(ing => ({ id: generateId(), amount: ing.amount || '', title: ing.item || ing.title, completed: false }));

            updateData('groceries', prev => [...(prev || []), ...newGroceries]);

            setSuccessMsg('✅ Ingredienser tillagda i Inköpslistan!');

          } else {

            throw new Error("Inget svar från AI");

          }

        } catch (error) {

          // Fallback om AI-nyckel saknas i webbläsaren: lägger till rätten med länk på inköpslistan

          updateData('groceries', prev => [...(prev || []), { id: generateId(), amount: `${portions} port`, title: `Ingredienser till ${mealObj.title || 'Recept'}`, completed: false }]);

          setSuccessMsg('✅ Tillagd på inköpslistan!');

        }

        setTimeout(() => setSuccessMsg(''), 3500);

        setIsFetching(false);

        setShowScraperFor(null);

      };



      const handleSaveRecipe = (e) => {

        e.preventDefault();

        if (!recTitle.trim()) return;

        const newRec = { id: editingRecId || generateId(), title: recTitle.trim(), link: recLink.trim(), notes: recNotes.trim(), taste: Number(recTaste), ease: Number(recEase) };

        if (editingRecId) {

          updateData('recipes', recipes.map(r => r.id === editingRecId ? newRec : r));

        } else {

          updateData('recipes', [newRec, ...recipes]);

        }

        setRecTitle(''); setRecLink(''); setRecNotes(''); setRecTaste(5); setRecEase(4); setEditingRecId(null);

      };



      // Hitta rätter i veckomenyn som ännu inte är sparade i receptbanken

      const unreviewedMeals = useMemo(() => {

        const list = [];

        ['current', 'next'].forEach(w => {

          days.forEach(d => {

            const m = meals?.[w]?.[d];

            const t = m?.title?.trim();

            if (t) {

              const inBank = recipes.some(r => r.title.toLowerCase() === t.toLowerCase());

              const isDismissed = (dismissedRecipes || []).includes(t.toLowerCase());

              const alreadyAdded = list.some(item => item.title.toLowerCase() === t.toLowerCase());

              if (!inBank && !isDismissed && !alreadyAdded) {

                list.push({ title: t, link: m.link || '' });

              }

            }

          });

        });

        return list;

      }, [meals, recipes, dismissedRecipes]);



      const dismissUnreviewed = (titleStr) => {

        updateData('dismissedRecipes', [...(dismissedRecipes || []), titleStr.toLowerCase()]);

      };



      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto max-w-2xl mx-auto">

          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 border shadow-inner">

            <button onClick={() => setSubTab('menu')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${subTab === 'menu' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>📅 Veckomeny</button>

            <button onClick={() => setSubTab('bank')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${subTab === 'bank' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>

              📖 Receptbank ({recipes.length}) {unreviewedMeals.length > 0 && <span className="ml-1 bg-[#E55835] text-white text-[10px] px-1.5 py-0.5 rounded-full">+{unreviewedMeals.length}</span>}

            </button>

          </div>



          {successMsg && (

            <div className="bg-[#1D2538] text-white p-4 rounded-2xl mb-5 font-bold text-center text-sm shadow-md">

              {successMsg}

            </div>

          )}



          {subTab === 'menu' ? (

            <>

              <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-5 border">

                <button onClick={() => setActiveWeek('current')} className={`flex-1 py-2 text-xs font-black rounded-xl ${activeWeek === 'current' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>Denna vecka</button>

                <button onClick={() => setActiveWeek('next')} className={`flex-1 py-2 text-xs font-black rounded-xl ${activeWeek === 'next' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>Nästa vecka</button>

              </div>



              <div className="space-y-4">

                {days.map(day => (

                  <div key={day} className="bg-white p-4 rounded-3xl shadow-sm border border-[#1D2538]/5">

                    <div className="flex items-center gap-3 mb-2.5">

                      <span className="font-black text-[#1D2538]/50 w-10 uppercase text-xs">{day}</span>

                      <input 

                        type="text" 

                        value={meals[activeWeek]?.[day]?.title || ''} 

                        onChange={(e) => handleChange(day, 'title', e.target.value)} 

                        placeholder="Vad ska vi äta?" 

                        className="flex-1 bg-[#F7F4EE] px-4 py-2.5 rounded-2xl text-sm font-bold outline-none text-[#1D2538]"

                      />

                      {recipes.length > 0 && (

                        <button onClick={() => setPickerForDay(pickerForDay === day ? null : day)} title="Välj från Receptbanken" className="bg-[#F7F4EE] text-[#1D2538] p-2.5 rounded-2xl hover:bg-[#E55835]/15 hover:text-[#E55835]">

                          <BookOpen size={18} />

                        </button>

                      )}

                    </div>



                    {pickerForDay === day && (

                      <div className="mb-3 p-3 bg-[#F7F4EE] rounded-2xl space-y-1.5 max-h-48 overflow-y-auto">

                        <p className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1">Välj sparat recept:</p>

                        {recipes.map(r => (

                          <button key={r.id} onClick={() => selectRecipeForDay(day, r)} className="w-full bg-white p-2.5 rounded-xl text-left flex justify-between items-center hover:bg-[#E55835]/10">

                            <span className="font-black text-xs text-[#1D2538]">{r.title}</span>

                            <span className="text-[10px] font-bold text-[#E55835]">Smak ⭐{r.taste} • Enkelhet ⚡{r.ease}</span>

                          </button>

                        ))}

                      </div>

                    )}

                    

                    <div className="flex items-center gap-2 pl-12">

                      <input 

                        type="url" 

                        value={meals[activeWeek]?.[day]?.link || ''} 

                        onChange={(e) => handleChange(day, 'link', e.target.value)} 

                        placeholder="Länk till recept (för AI-inköp)" 

                        className="flex-1 bg-transparent px-2 py-1 text-xs font-bold outline-none text-[#E55835] placeholder-[#E55835]/40 border-b border-transparent focus:border-[#E55835]/30"

                      />

                      {meals[activeWeek]?.[day]?.link && (

                        <button onClick={() => setShowScraperFor(showScraperFor === day ? null : day)} className="bg-[#1D2538] text-white text-[10px] font-black px-3 py-1.5 rounded-xl flex items-center gap-1 hover:bg-[#581625] shrink-0">

                          <Sparkles size={12}/> AI Köp

                        </button>

                      )}

                    </div>



                    {showScraperFor === day && (

                      <div className="mt-4 p-4 bg-[#F7F4EE] rounded-2xl border flex flex-col gap-3">

                        <label className="text-xs font-black text-[#1D2538]/70">Antal portioner att handla för:</label>

                        <div className="flex gap-2">

                          {[2, 4, 6, 8].map(num => (

                            <button key={num} onClick={() => setPortions(num)} className={`w-10 h-10 rounded-xl font-black text-sm flex justify-center items-center ${portions === num ? 'bg-[#E55835] text-white shadow-md' : 'bg-white text-[#1D2538] border'}`}>{num}</button>

                          ))}

                        </div>

                        <div className="flex gap-2 mt-1">

                          <button onClick={() => fetchIngredients(day)} disabled={isFetching} className="flex-1 bg-[#1D2538] text-white py-2.5 rounded-xl text-xs font-black flex justify-center items-center gap-2 disabled:opacity-50">

                            {isFetching ? <Loader2 size={14} className="animate-spin" /> : <ShoppingCart size={14} />}

                            {isFetching ? 'Läser receptet...' : 'Hämta ingredienser till Inköp'}

                          </button>

                          <button onClick={() => setShowScraperFor(null)} className="px-4 bg-white text-[#1D2538] py-2.5 rounded-xl text-xs font-black border">Avbryt</button>

                        </div>

                      </div>

                    )}

                  </div>

                ))}

              </div>

            </>

          ) : (

            <div className="space-y-6">

              {/* FORMULÄR FÖR RECEPTBANKEN */}

              <form onSubmit={handleSaveRecipe} className="bg-white p-5 rounded-3xl shadow-sm border space-y-3">

                <h3 className="font-black text-base text-[#1D2538]">{editingRecId ? 'Redigera recept' : 'Spara nytt recept i banken'}</h3>

                <input value={recTitle} onChange={e => setRecTitle(e.target.value)} placeholder="Receptets namn (t.ex. Krämig kycklingpasta)" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />

                <input type="url" value={recLink} onChange={e => setRecLink(e.target.value)} placeholder="Receptlänk (https://...)" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />

                <textarea value={recNotes} onChange={e => setRecNotes(e.target.value)} placeholder="Kommentar / Ingredienser / Barnens betyg..." rows={2} className="w-full bg-[#F7F4EE] px-4 py-2.5 rounded-2xl font-bold text-xs outline-none resize-none" />

                <div className="grid grid-cols-2 gap-3 pt-1">

                  <div className="bg-[#F7F4EE] p-3 rounded-2xl">

                    <label className="text-[10px] font-black uppercase text-[#1D2538]/60 block mb-1">Smakbetyg: ⭐ {recTaste}/5</label>

                    <input type="range" min="1" max="5" value={recTaste} onChange={e => setRecTaste(e.target.value)} className="w-full accent-[#E55835]" />

                  </div>

                  <div className="bg-[#F7F4EE] p-3 rounded-2xl">

                    <label className="text-[10px] font-black uppercase text-[#1D2538]/60 block mb-1">Enkelhet: ⚡ {recEase}/5</label>

                    <input type="range" min="1" max="5" value={recEase} onChange={e => setRecEase(e.target.value)} className="w-full accent-[#1D2538]" />

                  </div>

                </div>

                <div className="flex gap-2">

                  <button type="submit" disabled={!recTitle.trim()} className="flex-1 bg-[#581625] text-white py-3 rounded-2xl font-black text-sm disabled:opacity-50">{editingRecId ? 'Uppdatera recept' : 'Spara i Receptbanken'}</button>

                  {editingRecId && <button type="button" onClick={() => { setEditingRecId(null); setRecTitle(''); setRecLink(''); setRecNotes(''); }} className="px-4 bg-[#1D2538]/10 rounded-2xl font-black text-xs">Avbryt</button>}

                </div>

              </form>



              {/* ORECENSERADE RECEPT FRÅN VECKOMENYN */}

              {unreviewedMeals.length > 0 && (

                <div className="bg-[#E55835]/10 border border-[#E55835]/30 rounded-3xl p-4 space-y-2.5">

                  <h4 className="text-xs font-black uppercase tracking-wider text-[#E55835]">Orecenserade recept från veckomenyn ({unreviewedMeals.length})</h4>

                  <p className="text-[11px] font-bold text-[#1D2538]/70">Dessa rätter ligger i matsedeln men saknas i din receptbank. Klicka på "Betygsätt" för att fylla i dem ovan!</p>

                  {unreviewedMeals.map((um, idx) => (

                    <div key={idx} className="bg-white p-3 rounded-2xl flex items-center justify-between gap-2 shadow-sm">

                      <div className="min-w-0 flex-1">

                        <span className="font-black text-sm text-[#1D2538] block truncate">{um.title}</span>

                        {um.link && <span className="text-[10px] font-bold text-[#E55835] block truncate">{um.link}</span>}

                      </div>

                      <div className="flex items-center gap-1.5 shrink-0">

                        <button onClick={() => { setRecTitle(um.title); setRecLink(um.link || ''); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="bg-[#E55835] text-white text-xs font-black px-3 py-1.5 rounded-xl">

                          ⭐ Betygsätt

                        </button>

                        <button onClick={() => dismissUnreviewed(um.title)} title="Ta bort från listan" className="p-1.5 text-[#1D2538]/40 hover:text-[#581625]">

                          <Trash2 size={16} />

                        </button>

                      </div>

                    </div>

                  ))}

                </div>

              )}



              {/* SPARADE RECEPT I BANKEN */}

              <div className="space-y-3">

                <h4 className="text-xs font-black uppercase tracking-widest text-[#1D2538]/40 ml-1">Sparade recept ({recipes.length})</h4>

                {recipes.map(r => (

                  <div key={r.id} className="bg-white p-4 rounded-3xl shadow-sm border flex justify-between items-start gap-3">

                    <div className="flex-1 min-w-0">

                      <h5 className="font-black text-base text-[#1D2538]">{r.title}</h5>

                      {r.notes && <p className="text-xs font-bold text-[#1D2538]/60 mt-1">{r.notes}</p>}

                      <div className="flex flex-wrap items-center gap-2 mt-2">

                        <span className="text-[11px] font-black bg-[#E55835]/10 text-[#E55835] px-2.5 py-0.5 rounded-lg">Smak: ⭐ {r.taste}/5</span>

                        <span className="text-[11px] font-black bg-[#1D2538]/10 text-[#1D2538] px-2.5 py-0.5 rounded-lg">Enkelhet: ⚡ {r.ease}/5</span>

                        {r.link && (

                          <a href={r.link} target="_blank" rel="noopener noreferrer" className="text-[11px] font-black text-[#4B88C4] underline flex items-center gap-1">

                            <ExternalLink size={11}/> Öppna receptlänk

                          </a>

                        )}

                      </div>

                    </div>

                    <div className="flex flex-col gap-2">

                      <button onClick={() => { setEditingRecId(r.id); setRecTitle(r.title); setRecLink(r.link || ''); setRecNotes(r.notes || ''); setRecTaste(r.taste || 5); setRecEase(r.ease || 4); }} className="text-[#1D2538]/30 hover:text-[#1D2538]"><Edit3 size={18}/></button>

                      <button onClick={() => updateData('recipes', recipes.filter(x => x.id !== r.id))} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18}/></button>

                    </div>

                  </div>

                ))}

              </div>

            </div>

          )}

        </div>

      );

    }



    // --- CYKELKOLLEN (HORMONKURVOR ENLIGT BILDER + INSIKTER + REDIGERBAR HISTORIK) ---

    function HealthTracker({ logs = [], members = [], settings = {}, updateData, setActiveTab, localProfileId }) {

      const today = getLocalToday();

      const [logDate, setLogDate] = useState(today);

      const [mood, setMood] = useState('Bra');

      const [bleeding, setBleeding] = useState('Nej');

      const [editingId, setEditingId] = useState(null);



      const trackedMember = members.find(m => m.id === settings.cycleTrackerMemberId);

      const canLog = trackedMember && localProfileId === trackedMember.id;

      const cycleInfo = calculateCycleInfo(logs);

      const activeDay = cycleInfo ? cycleInfo.cycleDay : 17;

      const markerX = 20 + ((activeDay - 1) / 27) * 560;



      const handleSave = (e) => {

        e.preventDefault();

        if (!canLog) return;

        if (editingId) {

          updateData('healthLogs', logs.map(l => l.id === editingId ? { ...l, date: logDate, mood, bleeding } : l));

          setEditingId(null);

        } else {

          const filtered = logs.filter(l => l.date !== logDate);

          updateData('healthLogs', [{ id: generateId(), date: logDate, mood, bleeding }, ...filtered]);

        }

        setLogDate(today); setMood('Bra'); setBleeding('Nej');

      };



      const editLog = (log) => {

        setLogDate(log.date); setMood(log.mood); setBleeding(log.bleeding); setEditingId(log.id);

      };



      const deleteLog = (id) => updateData('healthLogs', logs.filter(l => l.id !== id));



      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto max-w-2xl mx-auto space-y-6">

          <button onClick={() => setActiveTab('menu')} className="text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]">

            <ChevronDown className="rotate-90" size={16}/> Tillbaka

          </button>



          {!trackedMember ? (

            <div className="bg-white rounded-3xl p-6 text-center border">

              <p className="font-bold text-[#1D2538]/60 mb-3">Ingen familjemedlem är vald för Cykelkollen ännu.</p>

              <button onClick={() => setActiveTab('settings_family')} className="bg-[#581625] text-white px-5 py-2.5 rounded-2xl font-black text-xs">

                Välj person i Inställningar

              </button>

            </div>

          ) : (

            <>

              {/* GRAF-KORT INSPIRERAT AV BIFOGADE BILDER */}

              <div className="bg-white rounded-[2.2rem] p-6 shadow-sm border border-[#1D2538]/5 overflow-hidden">

                <div className="flex justify-between items-start mb-4">

                  <div>

                    <span className="text-[10px] font-black uppercase tracking-widest text-[#581625]/60 block mb-1">

                      Cykelöversikt • {trackedMember.name}

                    </span>

                    <h2 className="text-4xl font-serif font-black text-[#1D2538] tracking-tight">

                      {cycleInfo ? `Cykeldag ${cycleInfo.cycleDay}` : 'Logga mensstart'}

                    </h2>

                    <p className="text-sm font-bold text-[#1D2538]/40 mt-1">

                      {cycleInfo ? `Mens om ca ${cycleInfo.daysUntilNext} dagar (${cycleInfo.fullTitle})` : 'Logga första blödningsdagen för att aktivera prognosen'}

                    </p>

                  </div>

                </div>



                {/* SKIKTAD HORMONKURVA (SVG) */}

                <div className="relative mt-4 mb-2">

                  <svg viewBox="0 0 600 185" className="w-full h-44 overflow-visible">

                    <defs>

                      <linearGradient id="progGrad" x1="0" y1="0" x2="0" y2="1">

                        <stop offset="0%" stopColor="#4F7DF9" stopOpacity="0.85" />

                        <stop offset="100%" stopColor="#4F7DF9" stopOpacity="0.05" />

                      </linearGradient>

                      <linearGradient id="estGrad" x1="0" y1="0" x2="0" y2="1">

                        <stop offset="0%" stopColor="#F97360" stopOpacity="0.8" />

                        <stop offset="100%" stopColor="#F97360" stopOpacity="0.08" />

                      </linearGradient>

                      <linearGradient id="fshGrad" x1="0" y1="0" x2="0" y2="1">

                        <stop offset="0%" stopColor="#A855F7" stopOpacity="0.75" />

                        <stop offset="100%" stopColor="#A855F7" stopOpacity="0.08" />

                      </linearGradient>

                    </defs>



                    {/* Streckade vertikala faslinjer */}

                    <line x1="115" y1="15" x2="115" y2="165" stroke="#A855F7" strokeDasharray="3 3" strokeOpacity="0.4" />

                    <line x1="255" y1="15" x2="255" y2="165" stroke="#F97360" strokeDasharray="3 3" strokeOpacity="0.4" />

                    <line x1="345" y1="15" x2="345" y2="165" stroke="#4F7DF9" strokeDasharray="3 3" strokeOpacity="0.4" />



                    {/* Progesteron (Blå våg i Lutealfasen) */}

                    <path d="M 0 165 L 0 158 C 140 158, 250 155, 310 120 C 370 65, 430 35, 475 40 C 520 45, 565 130, 600 158 L 600 165 Z" fill="url(#progGrad)" />

                    

                    {/* Östrogen (Korallröd topp före ägglossning + mindre våg i luteal) */}

                    <path d="M 0 165 L 0 155 C 90 152, 160 140, 220 75 C 255 38, 280 42, 310 110 C 350 140, 410 105, 465 110 C 520 115, 565 148, 600 156 L 600 165 Z" fill="url(#estGrad)" />



                    {/* FSH (Lila våg med pik vid ägglossning) */}

                    <path d="M 0 165 L 0 148 C 70 135, 140 138, 230 142 C 265 130, 280 78, 295 78 C 310 78, 325 135, 360 148 C 440 155, 530 155, 600 152 L 600 165 Z" fill="url(#fshGrad)" />



                    {/* Etiketter i kurvorna */}

                    <text x="282" y="128" fill="#ffffff" fontSize="11" fontWeight="900">FSH</text>

                    <text x="415" y="82" fill="#ffffff" fontSize="11" fontWeight="900" letterSpacing="0.5">PROGESTERON</text>

                    <text x="395" y="138" fill="#ffffff" fontSize="11" fontWeight="900" letterSpacing="0.5">ÖSTROGEN</text>



                    {/* Aktuell cykeldag-markör */}

                    <line x1={markerX} y1="10" x2={markerX} y2="165" stroke="#1D2538" strokeWidth="2" />

                    <circle cx={markerX} cy="15" r="5" fill="#1D2538" />

                  </svg>



                  {/* Tidslinje med 28 prickar och fas-etiketter */}

                  <div className="mt-1">

                    <div className="flex justify-between items-center bg-[#F7F4EE] rounded-full px-2 py-1.5">

                      {Array.from({ length: 28 }, (_, i) => i + 1).map(d => {

                        const isCurrent = d === activeDay;

                        const dotColor = d <= 5 ? 'bg-[#E55835]' : d <= 11 ? 'bg-[#F97360]' : d <= 16 ? 'bg-[#9333EA]' : 'bg-[#3B82F6]';

                        return (

                          <div key={d} className="flex items-center justify-center">

                            {isCurrent ? (

                              <span className="bg-[#2563EB] text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow">

                                {d}

                              </span>

                            ) : (

                              <span className={`w-1.5 h-1.5 rounded-full opacity-70 ${dotColor}`} />

                            )}

                          </div>

                        );

                      })}

                    </div>

                    <div className="grid grid-cols-4 text-[11px] font-black mt-2 px-1">

                      <span className="text-[#E55835]">Mens</span>

                      <span className="text-[#F97360] text-center">Follikulär</span>

                      <span className="text-[#9333EA] text-center">Sen follikulär</span>

                      <span className="text-[#3B82F6] text-right">Luteal</span>

                    </div>

                  </div>

                </div>

              </div>



              {/* DAGENS INSIKTER (VÄLMÅENDE, FYSISKT, NÄRING + PARTNERTIPS) */}

              {cycleInfo && (

                <div className="space-y-3">

                  <h3 className="font-black text-lg text-[#1D2538] ml-1">Dagens insikter</h3>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">

                    <div className="bg-white p-4 rounded-3xl border shadow-sm">

                      <span className="text-[10px] font-black uppercase text-[#9333EA] block mb-1">✨ Välmående</span>

                      <p className="text-xs font-bold text-[#1D2538]/80 leading-relaxed">{cycleInfo.wellbeing}</p>

                    </div>

                    <div className="bg-white p-4 rounded-3xl border shadow-sm">

                      <span className="text-[10px] font-black uppercase text-[#E55835] block mb-1">🏃‍♀️ Fysiskt</span>

                      <p className="text-xs font-bold text-[#1D2538]/80 leading-relaxed">{cycleInfo.physical}</p>

                    </div>

                    <div className="bg-white p-4 rounded-3xl border shadow-sm">

                      <span className="text-[10px] font-black uppercase text-[#3B82F6] block mb-1">🥗 Näring</span>

                      <p className="text-xs font-bold text-[#1D2538]/80 leading-relaxed">{cycleInfo.nutrition}</p>

                    </div>

                  </div>



                  <div className="bg-gradient-to-r from-[#581625] to-[#731E32] text-white p-5 rounded-3xl shadow-md">

                    <span className="text-[10px] font-black uppercase tracking-widest text-[#F2C4C4] block mb-1">❤️ Tips till partnern idag</span>

                    <p className="text-sm font-bold leading-relaxed">{cycleInfo.partnerTip}</p>

                  </div>

                </div>

              )}



              {/* LOGGNING & HISTORIK (ENDAST DEN SPÅRADE PERSONEN KAN LOGGA/ÄNDRA) */}

              {canLog ? (

                <>

                  <form onSubmit={handleSave} className="bg-white p-5 rounded-3xl shadow-sm border">

                    <h3 className="font-black text-lg text-[#1D2538] mb-4">{editingId ? 'Ändra registrerat mående' : 'Logga mående & blödning'}</h3>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">

                      <div>

                        <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 block">Datum</label>

                        <input type="date" value={logDate} onChange={e => setLogDate(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm text-[#1D2538] outline-none" />

                      </div>

                      <div>

                        <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 block">Mående</label>

                        <select value={mood} onChange={e => setMood(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm text-[#1D2538] outline-none">

                          <option>Toppen</option><option>Bra</option><option>Helt okej</option><option>Trött / Låg</option><option>PMS / Känslig</option>

                        </select>

                      </div>

                      <div>

                        <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 block">Mens / Blödning</label>

                        <select value={bleeding} onChange={e => setBleeding(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm text-[#1D2538] outline-none">

                          <option>Nej</option><option>Ja, Lätt</option><option>Ja, Normal</option><option>Ja, Kraftig</option>

                        </select>

                      </div>

                    </div>

                    <div className="flex gap-2">

                      <button type="submit" className="flex-1 bg-[#581625] text-white py-3.5 rounded-2xl font-black shadow-md">

                        {editingId ? 'Spara ändring' : 'Spara logg'}

                      </button>

                      {editingId && (

                        <button type="button" onClick={() => { setEditingId(null); setLogDate(today); }} className="px-5 bg-[#1D2538]/10 rounded-2xl font-black text-xs">

                          Avbryt

                        </button>

                      )}

                    </div>

                  </form>



                  <div>

                    <h3 className="font-black text-lg text-[#1D2538] mb-3 ml-1">Tidigare loggar (Klicka på pennan för att ändra)</h3>

                    <div className="space-y-2.5">

                      {[...logs].sort((a, b) => new Date(b.date) - new Date(a.date)).map(log => (

                        <div key={log.id} className="bg-white p-4 rounded-3xl shadow-sm border flex justify-between items-center">

                          <div>

                            <h4 className="font-black text-[#1D2538] text-sm">{log.date}</h4>

                            <p className="text-xs font-bold text-[#1D2538]/60 mt-0.5">

                              Mående: <span className="text-[#1D2538]">{log.mood}</span> • Blödning: <span className={log.bleeding !== 'Nej' ? 'text-[#E55835] font-black' : ''}>{log.bleeding}</span>

                            </p>

                          </div>

                          <div className="flex gap-2">

                            <button onClick={() => editLog(log)} className="p-2 bg-[#F7F4EE] rounded-xl text-[#1D2538]/60 hover:text-[#1D2538]"><Edit3 size={16}/></button>

                            <button onClick={() => deleteLog(log.id)} className="p-2 bg-[#F7F4EE] rounded-xl text-[#1D2538]/60 hover:text-[#581625]"><Trash2 size={16}/></button>

                          </div>

                        </div>

                      ))}

                    </div>

                  </div>

                </>

              ) : (

                <div className="bg-white/70 p-4 rounded-2xl border text-center text-xs font-bold text-[#1D2538]/50">

                  Endast {trackedMember.name} kan registrera och ändra mående-loggar från sitt inlogg.

                </div>

              )}

            </>

          )}

        </div>

      );

    }



    // --- BARNENS UTVECKLING (BASERAT PÅ INLAGD ÅLDER) ---

    function ChildDevelopment({ members = [], setActiveTab }) {

      const children = members.filter(m => m.role === 'Barn');



      const getStageGuide = (birthDate) => {

        if (!birthDate) return { ageLabel: 'Födelsedatum saknas', stage: 'Lägg in födelsedatum under Inställningar', tip: 'När födelsedatum är inlagt visas åldersanpassade råd och utvecklingsfaser här.' };

        const diffMs = new Date() - new Date(birthDate);

        const years = Math.floor(diffMs / (1000 * 60 * 60 * 24 * 365.25));

        const months = Math.floor((diffMs % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24 * 30.44));



        if (years < 2) return { ageLabel: `${years} år, ${months} mån`, stage: 'Småbarnsfasen & anknytning', tip: 'Barnet upptäcker världen med alla sinnen. Rutiner, tydlig tröst och att sätta ord på känslor skapar maximal trygghet.' };

        if (years <= 4) return { ageLabel: `${years} år, ${months} mån`, stage: 'Självständighet & stark vilja (2–4 år)', tip: 'Viljan utvecklas explosivt! Ge barnet två enkla val ("blå eller röd tröja?") istället för öppna frågor för att minska konflikter i vardagen.' };

        if (years <= 6) return { ageLabel: `${years} år, ${months} mån`, stage: 'Lilla tonåren / 6-årsfasen (5–6 år)', tip: 'Stora känslostormar blandas med stolthet över att klara saker själv. Förbered övergångar i god tid ("om 5 minuter ska vi klä på oss") och bekräfta känslan innan du sätter gränsen.' };

        if (years <= 9) return { ageLabel: `${years} år, ${months} mån`, stage: 'Skolåldern & kompisrelationer (7–9 år)', tip: 'Kompisar, rättvisa och regler blir superviktigt. Lyssna in hur rasterna i skolan funkar och ge barnet små egna ansvarsområden hemma.' };

        return { ageLabel: `${years} år, ${months} mån`, stage: 'Förpubertet & tonår (10+ år)', tip: 'Behovet av integritet växer samtidigt som barnet behöver dig som trygg hamn. Bjud in till samtal i bilen eller vid kvällsfikat utan press.' };

      };



      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto max-w-2xl mx-auto space-y-5">

          <button onClick={() => setActiveTab('menu')} className="text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]">

            <ChevronDown className="rotate-90" size={16}/> Tillbaka

          </button>

          <div className="bg-gradient-to-br from-[#581625] to-[#731E32] rounded-3xl p-6 text-white shadow-lg">

            <h2 className="text-2xl font-black flex items-center gap-3"><Baby size={26}/> Barnens utveckling</h2>

            <p className="text-white/80 text-xs font-bold mt-1">Skräddarsydda tips och bemötande utifrån barnens exakta ålder.</p>

          </div>

          {children.map(child => {

            const info = getStageGuide(child.birthDate);

            return (

              <div key={child.id} className="bg-white rounded-3xl p-5 shadow-sm border space-y-2">

                <div className="flex justify-between items-center">

                  <h3 className="font-black text-xl text-[#1D2538]">{child.name}</h3>

                  <span className="bg-[#E55835]/10 text-[#E55835] text-xs font-black px-3 py-1 rounded-full">{info.ageLabel}</span>

                </div>

                <p className="text-xs font-black uppercase tracking-wider text-[#581625]">{info.stage}</p>

                <p className="text-sm font-bold text-[#1D2538]/75 leading-relaxed bg-[#F7F4EE] p-4 rounded-2xl">{info.tip}</p>

              </div>

            );

          })}

        </div>

      );

    }



    // --- INSTÄLLNINGAR FAMILJ ---

    function SettingsFamily({ members = [], settings = {}, updateData, setActiveTab }) {

      const [newName, setNewName] = useState('');

      const ROLES = ['Barn', 'Mamma', 'Pappa', 'Annan'];



      const addMember = (e) => {

        e.preventDefault();

        if (!newName.trim()) return;

        const initialSizes = {};

        const startingCategories = (settings.roleCategories || {})['Barn'] || [];

        startingCategories.forEach(cat => initialSizes[cat] = '');

        updateData('members', [...members, { id: generateId(), name: newName.trim(), role: 'Barn', sizes: initialSizes, birthDate: '' }]);

        setNewName('');

      };



      const updateMember = (id, updates) => updateData('members', members.map(m => m.id === id ? { ...m, ...updates } : m));

      const deleteMember = (id) => updateData('members', members.filter(m => m.id !== id));

      const updateSize = (member, sizeKey, sizeValue) => updateMember(member.id, { sizes: { ...(member.sizes || {}), [sizeKey]: sizeValue } });



      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto max-w-2xl mx-auto">

          <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>



          <div className="bg-gradient-to-r from-[#A7CEF6]/20 to-[#4B88C4]/20 rounded-3xl p-5 mb-6 border border-[#4B88C4]/30">

            <h3 className="font-black text-lg text-[#1D2538] mb-2 flex items-center gap-2"><Sun size={20} className="text-[#4B88C4]" /> Väder & Ort</h3>

            <div className="flex gap-3">

              <input type="text" placeholder="Postnr" value={settings.weather?.zipcode || ''} onChange={(e) => updateData('settings', { ...settings, weather: { ...settings.weather, zipcode: e.target.value } })} className="w-1/3 bg-white rounded-2xl px-4 py-3 font-bold text-[#1D2538] outline-none shadow-sm" />

              <input type="text" placeholder="Ort (t.ex. Trelleborg)" value={settings.weather?.city || ''} onChange={(e) => updateData('settings', { ...settings, weather: { ...settings.weather, city: e.target.value } })} className="flex-1 bg-white rounded-2xl px-4 py-3 font-bold text-[#1D2538] outline-none shadow-sm" />

            </div>

          </div>



          <div className="bg-[#F2C4C4]/30 rounded-3xl p-5 mb-6 border border-[#581625]/20">

            <h3 className="font-black text-lg text-[#581625] mb-1">🌸 Vem spåras i Cykelkollen?</h3>

            <p className="text-xs font-bold text-[#581625]/70 mb-3">Endast denna profil kan logga mående/mens. Partnern ser automatiskt insikter och tips på sin startsida.</p>

            <select value={settings.cycleTrackerMemberId || ''} onChange={e => updateData('settings', { ...settings, cycleTrackerMemberId: e.target.value })} className="w-full bg-white rounded-2xl px-4 py-3 font-black text-[#581625] outline-none shadow-sm border border-[#581625]/10">

              <option value="">-- Välj person --</option>

              {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}

            </select>

          </div>



          <form onSubmit={addMember} className="flex gap-3 mb-6 bg-white p-2 rounded-3xl border shadow-sm">

            <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Lägg till familjemedlem..." className="flex-1 bg-transparent px-4 py-3 outline-none font-bold text-[#1D2538]" />

            <button type="submit" disabled={!newName.trim()} className="bg-[#1D2538] text-white px-5 rounded-2xl font-bold">Lägg till</button>

          </form>



          <div className="space-y-5">

            {members.map(member => {

              const role = member.role || 'Barn';

              const activeCategories = (settings.roleCategories || {})[role] || [];

              return (

                <div key={member.id} className="bg-white rounded-3xl shadow-sm border p-5">

                  <div className="flex justify-between items-center mb-4 pb-3 border-b">

                    <h4 className="font-black text-xl flex items-center gap-3"><span className={`w-10 h-10 rounded-full flex items-center justify-center ${getTagColor(member.name)}`}><User size={20} /></span> {member.name}</h4>

                    <button onClick={() => deleteMember(member.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>

                  </div>

                  <div className="mb-4">

                    <label className="text-[10px] font-black uppercase text-[#1D2538]/50 block ml-1 mb-1">Kopplad inloggnings-mejl</label>

                    <div className="w-full rounded-2xl bg-[#F7F4EE] px-4 py-2.5 flex justify-between items-center text-sm font-bold">

                      <span>{member.email || 'Ingen mejl kopplad ännu'}</span>

                      {member.email && <button onClick={() => updateMember(member.id, { email: null })} className="text-[10px] font-black uppercase text-[#E55835]">Byt / Koppla bort</button>}

                    </div>

                  </div>

                  <div className="flex gap-3 mb-4">

                    <div className="flex-1">

                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 block ml-1 mb-1">Roll</label>

                      <select value={role} onChange={e => updateMember(member.id, { role: e.target.value })} className="w-full rounded-2xl bg-[#F7F4EE] px-3 py-2.5 outline-none font-bold text-sm">

                        {ROLES.map(r => <option key={r} value={r}>{r}</option>)}

                      </select>

                    </div>

                    <div className="flex-1">

                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 block ml-1 mb-1">Födelsedatum</label>

                      <input type="date" value={member.birthDate || ''} onChange={e => updateMember(member.id, { birthDate: e.target.value })} className="w-full rounded-2xl bg-[#F7F4EE] px-3 py-2.5 outline-none font-bold text-sm" />

                    </div>

                  </div>

                  <div className="space-y-2">

                    <p className="text-[10px] font-black uppercase text-[#1D2538]/40 ml-1">Kläd- & Skostorlekar ({role})</p>

                    {activeCategories.map(key => (

                      <div key={key} className="flex justify-between items-center bg-[#F7F4EE] px-4 py-2 rounded-2xl text-sm">

                        <span className="text-[#1D2538]/60 font-bold w-28">{key}</span>

                        <input type="text" placeholder="Ange storlek..." value={(member.sizes || {})[key] || ''} onChange={e => updateSize(member, key, e.target.value)} className="flex-1 bg-transparent text-right font-black outline-none" />

                      </div>

                    ))}

                  </div>

                </div>

              );

            })}

          </div>

        </div>

      );

    }



    // --- INSTÄLLNINGAR STORLEKSMALLAR ---

    function SettingsSizes({ settings = {}, updateData, setActiveTab }) {

      const [newCategory, setNewCategory] = useState('');

      const [activeRoleTab, setActiveRoleTab] = useState('Barn');

      const ROLES = ['Barn', 'Mamma', 'Pappa', 'Annan'];

      const activeCats = (settings.roleCategories || {})[activeRoleTab] || [];



      const addCategory = (e) => {

        e.preventDefault();

        if (!newCategory.trim() || activeCats.includes(newCategory.trim())) return;

        updateData('settings', { ...settings, roleCategories: { ...(settings.roleCategories || {}), [activeRoleTab]: [...activeCats, newCategory.trim()] }});

        setNewCategory('');

      };



      const removeCategory = (cat) => {

        updateData('settings', { ...settings, roleCategories: { ...(settings.roleCategories || {}), [activeRoleTab]: activeCats.filter(c => c !== cat) }});

      };



      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto max-w-2xl mx-auto">

          <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>

          <div className="bg-[#4B88C4] rounded-3xl p-6 text-white shadow-lg mb-6">

            <h2 className="text-2xl font-black mb-1 flex items-center gap-3"><Ruler size={24}/> Storleksmallar</h2>

            <p className="text-white/80 text-xs font-bold">Bestäm vilka klädkategorier som ska finnas för varje roll.</p>

          </div>

          <div className="bg-white rounded-3xl shadow-sm p-5 border">

            <div className="flex bg-[#F7F4EE] rounded-xl p-1 mb-5">

              {ROLES.map(r => <button key={r} onClick={() => setActiveRoleTab(r)} className={`flex-1 py-2 text-xs font-black rounded-lg ${activeRoleTab === r ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>{r}</button>)}

            </div>

            <div className="flex flex-wrap gap-2 mb-5">

              {activeCats.map(cat => (

                <div key={cat} className="flex items-center gap-1 bg-[#1D2538]/5 px-3 py-1.5 rounded-xl text-xs font-bold text-[#1D2538]">

                  {cat} <button onClick={() => removeCategory(cat)} className="text-[#E55835] ml-1"><X size={14}/></button>

                </div>

              ))}

            </div>

            <form onSubmit={addCategory} className="flex gap-2">

              <input value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder={`Ny kategori för ${activeRoleTab}...`} className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl text-sm font-bold outline-none" />

              <button type="submit" disabled={!newCategory.trim()} className="bg-[#1D2538] text-white px-5 rounded-2xl font-bold">Lägg till</button>

            </form>

          </div>

        </div>

      );

    }



    // --- MENY (MER) ---

    function Menu({ setActiveTab }) {

      const items = [

        { id: 'todo', title: 'Att göra', desc: 'Uppgifter, ansvar & arkiv', icon: <CheckSquare size={26} />, color: 'text-[#E55835]', bg: 'bg-[#E55835]/10' },

        { id: 'health', title: 'Cykelkollen', desc: 'Hormonkurva, faser & partnertips', icon: <HeartPulse size={26} />, color: 'text-[#581625]', bg: 'bg-[#F2C4C4]' },

        { id: 'child_dev', title: 'Barnens utveckling', desc: 'Råd och faser baserat på barnens ålder', icon: <Baby size={26} />, color: 'text-[#581625]', bg: 'bg-[#581625]/10' },

        { id: 'settings_family', title: 'Familj & Inställningar', desc: 'Inlogg, storlekar, ort & cykelval', icon: <User size={26} />, color: 'text-[#1D2538]', bg: 'bg-[#1D2538]/10' },

        { id: 'settings_sizes', title: 'Storleksmallar', desc: 'Skräddarsy klädkategorier', icon: <Ruler size={26} />, color: 'text-[#2B5B84]', bg: 'bg-[#A7CEF6]/30' },

      ];

      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto max-w-2xl mx-auto space-y-3.5">

          <h2 className="text-2xl font-black text-[#1D2538] mb-2">Utforska</h2>

          {items.map(item => (

            <button key={item.id} onClick={() => setActiveTab(item.id)} className="w-full bg-white p-4 rounded-3xl shadow-sm border flex items-center gap-4 text-left hover:border-[#1D2538]/20 transition-all">

              <div className={`${item.bg} ${item.color} p-4 rounded-2xl`}>{item.icon}</div>

              <div>

                <h3 className="font-black text-[#1D2538] text-base">{item.title}</h3>

                <p className="text-xs font-bold text-[#1D2538]/50">{item.desc}</p>

              </div>

            </button>

          ))}

        </div>

      );

    }



    // --- HUVUDKOMPONENT (RESPONSIV FÖR BÅDE MOBIL & DESKTOP) ---

    function App() {

      const [user, setUser] = useState(null);

      const [authLoading, setAuthLoading] = useState(true);

      const [activeTab, setActiveTab] = useState('dashboard');

      const [editItemId, setEditItemId] = useState(null);



      useEffect(() => {

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); setAuthLoading(false); });

        return () => unsubscribe();

      }, []);



      const [data, updateData, loadingData] = useAppSync(user);



      if (authLoading || (user && loadingData)) {

        return (

          <div className="flex flex-col min-h-[100dvh] items-center justify-center bg-[#F7F4EE]">

            <Loader2 size={40} className="animate-spin text-[#581625] mb-4" />

            <p className="font-bold text-[#1D2538]/50">Laddar familjehubben...</p>

          </div>

        );

      }

      if (!user) return <LoginScreen />;



      const myProfile = (data.members || []).find(m => m.email && m.email.toLowerCase() === (user.email || '').toLowerCase());

      const localProfileId = myProfile ? myProfile.id : null;



      if (!localProfileId && (data.members || []).length > 0) {

        return <ProfileSelection members={data.members} currentUserEmail={user.email} updateData={updateData} />;

      }



      const handleEditItemRequest = (tab, id) => {

        setActiveTab(tab);

        setEditItemId(id);

      };



      const renderContent = () => {

        switch (activeTab) {

          case 'dashboard': return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} settings={data.settings} setActiveTab={setActiveTab} members={data.members} meals={data.meals} localProfileId={localProfileId} onEditItem={handleEditItemRequest} />;

          case 'shopping': return <ShoppingList items={data.shoppingItems} groceries={data.groceries} members={data.members} settings={data.settings} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;

          case 'calendar': return <Calendar events={data.events} members={data.members} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;

          case 'todo': return <TodoList todos={data.todos} members={data.members} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;

          case 'meals': return <MealPlanner meals={data.meals} recipes={data.recipes} dismissedRecipes={data.dismissedRecipes} updateData={updateData} />;

          case 'health': return <HealthTracker logs={data.healthLogs} members={data.members} settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} localProfileId={localProfileId} />;

          case 'child_dev': return <ChildDevelopment members={data.members} setActiveTab={setActiveTab} />;

          case 'settings_family': return <SettingsFamily members={data.members} settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} />;

          case 'settings_sizes': return <SettingsSizes settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} />;

          case 'menu': return <Menu setActiveTab={setActiveTab} />;

          default: return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} settings={data.settings} setActiveTab={setActiveTab} members={data.members} meals={data.meals} localProfileId={localProfileId} onEditItem={handleEditItemRequest} />;

        }

      };



      const getHeaderTitle = () => ({

        dashboard: 'Familjehubb', shopping: 'Inköp', calendar: 'Kalender', todo: 'Att göra',

        menu: 'Utforska', meals: 'Mat & Recept', settings_family: 'Inställningar',

        settings_sizes: 'Kategorier', health: 'Cykelkollen', child_dev: 'Barnens utveckling'

      })[activeTab] || 'Familjehubb';



      return (

        <div className="flex flex-col h-[100dvh] w-full max-w-2xl mx-auto bg-[#F7F4EE] relative overflow-hidden font-sans shadow-xl">

          <header className="bg-gradient-to-r from-[#581625] to-[#731E32] px-6 py-4 shadow-md z-10 flex justify-center items-end h-16 sm:h-20 rounded-b-3xl shrink-0">

            <h1 className="text-lg sm:text-xl font-black text-[#F7F4EE] tracking-widest uppercase opacity-95">{getHeaderTitle()}</h1>

          </header>

          <main className="flex-1 overflow-hidden relative">{renderContent()}</main>

          <div className="absolute bottom-4 left-3 right-3 z-20 pointer-events-none">

            <nav className="pointer-events-auto bg-white/95 backdrop-blur-xl border border-white/40 shadow-xl rounded-3xl max-w-md mx-auto overflow-hidden">

              <div className="flex justify-between items-center px-2 py-1.5 gap-1">

                <NavItem icon={<Home />} label="Start" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />

                <NavItem icon={<Utensils />} label="Mat" isActive={activeTab === 'meals'} onClick={() => setActiveTab('meals')} />

                <NavItem icon={<ShoppingCart />} label="Inköp" isActive={activeTab === 'shopping'} onClick={() => setActiveTab('shopping')} />

                <NavItem icon={<CalendarIcon />} label="Kalender" isActive={activeTab === 'calendar'} onClick={() => setActiveTab('calendar')} />

                <NavItem icon={<Grid />} label="Mer" isActive={['menu', 'settings_family', 'settings_sizes', 'health', 'child_dev', 'todo'].includes(activeTab)} onClick={() => setActiveTab('menu')} />

              </div>

            </nav>

          </div>

        </div>

      );

    }



    const root = createRoot(document.getElementById('root'));

    root.render(<App />);

  </script>

</body>

</html>
