<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Familjehubb</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=FH&background=E55835&color=fff&size=180">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>
  
  <style>
    body { background-color: #F7F4EE; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .animate-bounce-short { animation: bounce-short 0.3s ease-in-out 1; }
    @keyframes bounce-short { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10%); } }
  </style>

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett fel uppstod vid inläsning</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + msg + '</div></div>';
      return false;
    };
    window.onunhandledrejection = function(event) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett nätverksfel uppstod</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + event.reason + '</div></div>';
    };
  </script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react"
    }
  }
  </script>
</head>
<body>
  <div id="root">
      <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column;">
          <div style="border: 4px solid rgba(0,0,0,0.1); border-left-color: #581625; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
          <p style="margin-top:20px; font-family:sans-serif; font-weight:bold; color:#1D2538;">Laddar familjehubben...</p>
      </div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Home, ShoppingCart, CheckSquare, Calendar as CalendarIcon, Grid, Plus, Trash2, Edit3, HeartPulse, User, Ruler, ChevronDown, Wind, Thermometer, Droplets, CloudRain, Check, X, Clock, Utensils, Sparkles, Loader2, Copy, LogOut, Sun, Cloud, CloudFog, CloudSnow, CloudLightning, Info, Baby, Activity, ChevronLeft, ChevronRight, Star, BookOpen } from 'lucide-react';
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOt0D6sBEyatAAX4ZG2Vc26TQRIoJMCzU",
      authDomain: "familjehubben-9d06d.firebaseapp.com",
      projectId: "familjehubben-9d06d",
      storageBucket: "familjehubben-9d06d.firebasestorage.app",
      messagingSenderId: "1041803591024",
      appId: "1:1041803591024:web:47a8d91c7bb49747f4e3b5",
      measurementId: "G-W44NJKDYWR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    const getTagColor = (name) => {
      if (!name) return 'bg-[#1D2538] text-white';
      const colors = ['bg-[#E55835] text-white', 'bg-[#A7CEF6] text-[#1D2538]', 'bg-[#F2C4C4] text-[#581625]', 'bg-[#581625] text-white'];
      let hash = 0; 
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    };
    
    const getLocalToday = () => { 
        const d = new Date(); 
        return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0]; 
    };
    
    const getLocalDayName = (dateString) => { 
        if (!dateString) return ''; 
        const d = new Date(dateString + 'T12:00:00'); 
        return ['Sön','Mån','Tis','Ons','Tors','Fre','Lör'][d.getDay()]; 
    };

    function ProfileSelection({ members, currentUserEmail, updateData }) {
        const handleSelect = (member) => {
            const updatedMembers = members.map(m => m.id === member.id ? { ...m, email: currentUserEmail } : m);
            updateData('members', updatedMembers);
        };

        return (
            <div className="flex flex-col items-center justify-center h-screen bg-[#F7F4EE] p-6 animate-in fade-in">
                <h2 className="text-3xl font-black text-[#1D2538] mb-8 text-center tracking-tight">Vem är du?</h2>
                <div className="grid grid-cols-2 gap-6 w-full max-w-sm">
                    {members.map(m => (
                        <button key={m.id} onClick={() => handleSelect(m)} className="flex flex-col items-center gap-3 hover:scale-105 transition-transform group">
                            <div className={`w-24 h-24 rounded-[2rem] flex items-center justify-center text-3xl shadow-sm border-2 border-transparent group-hover:border-[#1D2538]/20 transition-all ${getTagColor(m.name)}`}>
                                {m.name.charAt(0).toUpperCase()}
                            </div>
                            <span className="font-black text-[#1D2538]">{m.name}</span>
                        </button>
                    ))}
                </div>
                <div className="mt-12 text-center">
                    <p className="text-xs font-bold text-[#1D2538]/50">Klicka på din profil för att koppla ditt inlogg <br/>({currentUserEmail}) till rätt person.</p>
                </div>
            </div>
        )
    }

    function useAppSync(user) {
      const initialData = {
        members: [
          { id: generateId(), name: 'Mamma', role: 'Mamma', email: '', sizes: { 'Skor': '38', 'Tröja': 'M' } },
          { id: generateId(), name: 'Pappa', role: 'Pappa', email: '', sizes: { 'Skor': '43', 'Skjorta': 'L' } },
          { id: generateId(), name: 'Barn', role: 'Barn', email: '', sizes: { 'Skor': '34', 'Ytterplagg': '134' }, birthDate: '2015-05-10' }
        ],
        shoppingItems: [], groceries: [], todos: [], events: [], healthLogs: [], recipes: [], dismissedRecipes: [],
        meals: {
            current: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} },
            next: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} }
        },
        settings: { 
            weather: { zipcode: '111 22', city: 'Stockholm' }, 
            roleCategories: { 'Barn': ['Skor', 'Ytterplagg', 'Kläder'], 'Mamma': ['Skor', 'Tröja', 'Byxor'], 'Pappa': ['Skor', 'Skjorta'], 'Annan': ['Skor'] },
            cycleTrackerMemberId: ''
        }
      };

      const [data, setData] = useState(initialData);
      const [loadingData, setLoadingData] = useState(true);

      useEffect(() => {
        if (!user || !db) return;
        const docRef = doc(db, 'family', 'sharedData');
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const fetched = docSnap.data();
            if(!fetched.groceries) fetched.groceries = [];
            if(!fetched.recipes) fetched.recipes = [];
            if(!fetched.dismissedRecipes) fetched.dismissedRecipes = [];
            if(!fetched.meals) fetched.meals = initialData.meals;
            if(!fetched.settings) fetched.settings = initialData.settings;
            if(fetched.settings && !('cycleTrackerMemberId' in fetched.settings)) fetched.settings.cycleTrackerMemberId = '';
            setData(fetched);
          } else {
            setDoc(docRef, initialData).catch(e => console.error("Skapandefel:", e));
            setData(initialData);
          }
          setLoadingData(false);
        }, (err) => {
            console.error("Fel vid hämtning av data.", err);
        });
        return () => unsubscribe();
      }, [user]);

      const updateData = (key, newData) => {
        setData(prev => {
          const updatedVal = typeof newData === 'function' ? newData(prev[key]) : newData;
          if (user && db) setDoc(doc(db, 'family', 'sharedData'), { [key]: updatedVal }, { merge: true });
          return { ...prev, [key]: updatedVal };
        });
      };

      return [data, updateData, loadingData];
    }

    function LoginScreen() {
      const [email, setEmail] = useState(''); 
      const [password, setPassword] = useState(''); 
      const [isRegistering, setIsRegistering] = useState(false); 
      const [error, setError] = useState(''); 
      const [loading, setLoading] = useState(false);
      
      const handleSubmit = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setLoading(true);
        try { 
            if (isRegistering) { 
                await createUserWithEmailAndPassword(auth, email, password); 
            } else { 
                await signInWithEmailAndPassword(auth, email, password); 
            } 
        } catch (err) { 
            if (err.code === 'auth/email-already-in-use') setError('E-postadressen används redan. Logga in istället!');
            else if (err.code === 'auth/weak-password') setError('Lösenordet är för kort. Minst 6 tecken krävs.');
            else setError('Fel e-post eller lösenord.');
        }
        setLoading(false);
      };

      return (
        <div className="flex flex-col items-center justify-center h-screen bg-[#F7F4EE] p-6">
          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] p-6 rounded-[2rem] w-full max-w-sm text-white shadow-2xl mb-8 relative overflow-hidden">
             <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
             <Home size={40} className="mb-4 relative z-10" />
             <h1 className="text-4xl font-black relative z-10 tracking-tight">Familjehubb</h1>
             <p className="font-bold text-white/80 mt-2 relative z-10">Logga in med din e-post.</p>
          </div>
          <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white p-6 rounded-[2rem] shadow-sm border border-[#1D2538]/5">
            <h2 className="text-xl font-black text-[#1D2538] mb-5">{isRegistering ? 'Skapa konto' : 'Logga in'}</h2>
            {error && <div className="bg-[#F2C4C4] text-[#581625] p-3 rounded-xl text-sm font-bold mb-4">{error}</div>}
            
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Din E-post</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" />
            
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Ditt Lösenord (Minst 6 tecken)</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-6" />
            
            <button type="submit" disabled={loading} className="w-full bg-[#1D2538] text-white py-3.5 rounded-2xl font-black shadow-md flex justify-center items-center gap-2">
                {loading && <Loader2 size={16} className="animate-spin" />} 
                {isRegistering ? 'Skapa konto' : 'Logga in'}
            </button>
            <button type="button" onClick={() => {setIsRegistering(!isRegistering); setError('');}} className="w-full text-center mt-4 text-sm font-bold text-[#1D2538]/60 hover:text-[#1D2538]">
                {isRegistering ? 'Har du redan ett konto? Logga in' : 'Inget konto? Skapa ett här'}
            </button>
          </form>
        </div>
      );
    }

    function NavItem({ icon, label, isActive, onClick }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 h-14 rounded-2xl transition-all duration-300 ${isActive ? 'bg-[#581625] text-[#F7F4EE] shadow-md scale-105' : 'text-[#1D2538]/50 hover:bg-[#1D2538]/5'}`}>
          {React.cloneElement(icon, { size: isActive ? 24 : 22, className: isActive ? 'animate-bounce-short' : '' })}
          <span className={`text-[10px] font-black mt-1 ${isActive ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{label}</span>
        </button>
      );
    }

    // --- 1. DASHBOARD ---
    function Dashboard({ events, todos, shoppingItems, healthLogs, weatherConfig, setActiveTab, members, settings, meals, localProfileId, onEditItem }) {
      const today = getLocalToday();
      const upcomingEvents = events.filter(e => e.fromDate >= today).sort((a, b) => { 
          if (a.fromDate !== b.fromDate) return a.fromDate.localeCompare(b.fromDate); 
          return (a.fromTime || '00:00').localeCompare(b.fromTime || '00:00'); 
      });
      const activeTodos = todos.filter(t => !t.completed); 
      const activeShopping = shoppingItems.filter(i => !i.completed);
      
      const dayIndex = new Date().getDay(); 
      const daysArr = ['Sön', 'Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör']; 
      const todaysMeal = meals?.current?.[daysArr[dayIndex]];

      const trackedMemberId = settings.cycleTrackerMemberId;
      const trackedMember = members.find(m => m.id === trackedMemberId);
      const isTrackingMe = trackedMember && trackedMember.id === localProfileId;
      const todayLog = healthLogs.find(log => log.date === today && log.memberId === trackedMemberId);

      let currentPhase = 'Ingen data';
      let partnerTips = 'Väntar på att partnern ska logga sin cykel.';
      let cycleDay = null;

      if (trackedMember) {
          const memberLogs = healthLogs.filter(l => l.memberId === trackedMember.id).sort((a,b) => new Date(b.date) - new Date(a.date));
          const lastPeriod = memberLogs.find(l => l.bleeding !== 'Nej');
          if (lastPeriod) {
              const diffTime = Math.abs(new Date(today) - new Date(lastPeriod.date));
              const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
              cycleDay = (diffDays % 28) + 1;
              if(cycleDay > 40) cycleDay = null; 
              
              if (cycleDay) {
                  if (cycleDay <= 5) { currentPhase = 'Menstruation'; partnerTips = 'Erbjud dig att ta huvudansvaret hemma. Extra vila uppskattas!'; }
                  else if (cycleDay <= 13) { currentPhase = 'Follikulär fas'; partnerTips = 'Perfekt tid att planera in roliga familjeaktiviteter!'; }
                  else if (cycleDay <= 16) { currentPhase = 'Ägglossning'; partnerTips = 'Hög energi och socialt humör.'; }
                  else if (cycleDay <= 21) { currentPhase = 'Tidig Lutealfas'; partnerTips = 'Lugn stämning hemma uppskattas extra mycket nu.'; }
                  else { currentPhase = 'Sen Lutealfas (PMS)'; partnerTips = 'Ha extra tålamod och avlasta direkt.'; }
              }
          }
      }

      const [realWeather, setRealWeather] = useState(null);
      const [tomorrowWeather, setTomorrowWeather] = useState(null);
      const [weatherTip, setWeatherTip] = useState('Laddar tips...');

      useEffect(() => {
        const fetchWeather = async () => {
          try {
            const city = weatherConfig?.city || 'Stockholm';
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=sv`);
            const geoData = await geoRes.json();
            if (!geoData.results?.length) return;
            const { latitude, longitude } = geoData.results[0];

            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`);
            const weatherData = await weatherRes.json();

            const times = [9, 12, 15, 19];
            const labels = ['Fm', 'Lunch', 'Em', 'Kväll'];
            
            const getWeatherIcon = (code) => {
                if (code === 0) return <Sun size={22} />;
                if (code > 0 && code <= 3) return <Cloud size={22} />;
                if (code === 45 || code === 48) return <CloudFog size={22} />;
                if (code >= 51 && code <= 67) return <CloudRain size={22} />;
                if (code >= 71 && code <= 77) return <CloudSnow size={22} />;
                if (code >= 95) return <CloudLightning size={22} />;
                return <Cloud size={22} />;
            };

            const mapped = times.map((hour, idx) => {
                const temp = Math.round(weatherData.hourly.temperature_2m[hour]);
                const code = weatherData.hourly.weather_code[hour];
                return { time: labels[idx], temp: `${temp}°`, icon: getWeatherIcon(code) };
            });
            setRealWeather(mapped);

            const tMax = Math.round(weatherData.daily.temperature_2m_max[1]);
            const tMin = Math.round(weatherData.daily.temperature_2m_min[1]);
            const tCode = weatherData.daily.weather_code[1];
            setTomorrowWeather({ temp: `${tMin} till ${tMax}°C`, icon: getWeatherIcon(tCode) });

            const codes = times.map(h => weatherData.hourly.weather_code[h]);
            let tip = "En toppendag för lek! ☀️";
            if (codes.some(c => c >= 71 && c <= 77)) tip = "Snö på ingång! Pulka och tjocka vantar rekommenderas! ❄️☃️";
            else if (codes.some(c => c >= 51 && c <= 67)) tip = "Det vankas regn! Fram med galonisarna! ☔🌧️";
            else tip = "Bra väder för lek utomhus! ☁️";
            setWeatherTip(tip);
          } catch (e) {
            setWeatherTip('Kunde inte hämta vädertips.');
          }
        };
        fetchWeather();
      }, [weatherConfig?.city]);

      const weatherDisplay = realWeather || [
          { time: 'Fm', temp: '--', icon: <Cloud size={22}/> }, { time: 'Lunch', temp: '--', icon: <Cloud size={22}/> }, 
          { time: 'Em', temp: '--', icon: <Cloud size={22}/> }, { time: 'Kväll', temp: '--', icon: <Cloud size={22}/> }
      ];

      const localUser = members.find(m => m.id === localProfileId);

      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-6 max-w-xl mx-auto">
          {localUser && <h2 className="text-xl font-black text-[#1D2538] mt-2 mb-[-10px]">Hej {localUser.name}! 👋</h2>}

          {/* VÄDER */}
          <div className="bg-gradient-to-br from-[#A7CEF6] to-[#4B88C4] rounded-[2rem] p-5 text-white shadow-xl relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
            <div className="flex justify-between items-center mb-5 relative z-10">
                <div>
                    <h3 className="text-3xl font-black tracking-tight">{weatherConfig?.city || weatherConfig?.zipcode || 'Ställ in ort'}</h3>
                    <p className="text-white/90 font-bold text-sm opacity-80">Prognos idag</p>
                </div>
                <div className="bg-white/20 p-3.5 rounded-2xl backdrop-blur-md"><Wind size={28} /></div>
            </div>
            
            <div className="flex justify-between bg-white/20 rounded-2xl p-4 backdrop-blur-md relative z-10 shadow-sm mb-3">
              {weatherDisplay.map((w, i) => (
                  <div key={i} className="flex flex-col items-center gap-2">
                      <span className="text-[11px] font-black uppercase tracking-wider text-white/80">{w.time}</span>
                      {w.icon}
                      <span className="font-black text-base">{w.temp}</span>
                  </div>
              ))}
            </div>

            <div className="bg-white/20 p-3 rounded-xl backdrop-blur-md relative z-10 text-xs font-bold flex items-center gap-2 mb-2">
                <Info size={18} className="shrink-0 text-white" /> {weatherTip}
            </div>

            {tomorrowWeather && (
                <div className="bg-white/10 p-2.5 px-4 rounded-xl backdrop-blur-md relative z-10 text-[11px] font-black flex items-center justify-between">
                    <span className="uppercase tracking-widest text-white/80">IMORGON:</span>
                    <span className="flex items-center gap-1.5">{tomorrowWeather.icon} {tomorrowWeather.temp}</span>
                </div>
            )}
          </div>

          {/* CYKELKOLLEN WIDGET */}
          {trackedMember && (
            isTrackingMe ? (
              <div onClick={() => setActiveTab('health')} className={`rounded-3xl p-5 shadow-sm border cursor-pointer flex flex-col justify-center relative overflow-hidden transition-transform active:scale-95 ${todayLog ? 'bg-gradient-to-r from-[#F2C4C4] to-[#f4d5d5] border-[#F2C4C4]' : 'bg-white border-[#1D2538]/10 border-dashed'}`}>
                <div className="flex items-center gap-4 relative z-10">
                  <div className={`${todayLog ? 'bg-white text-[#581625]' : 'bg-[#1D2538]/5 text-[#1D2538]/40'} p-3.5 rounded-2xl shadow-sm`}><Activity size={24} /></div>
                  <div>
                    <h4 className="font-black text-[#1D2538] text-base">{todayLog ? 'Dagsform loggad' : 'Cykelkollen: Logga mående'}</h4>
                    <p className="text-xs font-bold text-[#1D2538]/60 mt-1">{cycleDay ? `Cykeldag ${cycleDay} - ${currentPhase}` : 'Klicka för att logga cykel & mående'}</p>
                  </div>
                </div>
              </div>
            ) : (
              <div onClick={() => setActiveTab('health')} className="rounded-3xl p-5 shadow-sm border cursor-pointer relative overflow-hidden transition-transform active:scale-95 bg-[#F7F4EE] border-[#1D2538]/10">
                <div className="flex items-start gap-4 relative z-10">
                  <div className="bg-[#F2C4C4] text-[#581625] p-3 rounded-2xl shadow-sm mt-1 shrink-0"><HeartPulse size={20} /></div>
                  <div>
                    <h4 className="font-black text-[#1D2538] text-sm">Cykelkollen: {trackedMember.name}</h4>
                    <p className="text-[10px] font-black uppercase text-[#E55835] mt-1 mb-1">{cycleDay ? `Cykeldag ${cycleDay} - ${currentPhase}` : 'Väntar på data'}</p>
                    <p className="text-xs font-bold text-[#1D2538]/70 leading-relaxed">{partnerTips}</p>
                  </div>
                </div>
              </div>
            )
          )}

          {todaysMeal?.title && (
            <div onClick={() => setActiveTab('meals')} className="bg-gradient-to-r from-[#E55835] to-[#f07b5d] rounded-3xl p-5 text-white shadow-sm border cursor-pointer flex justify-between items-center transition-transform active:scale-95">
              <div>
                  <h4 className="font-bold text-white/80 text-xs uppercase tracking-widest mb-1">Dagens Middag</h4>
                  <p className="font-black text-xl">{todaysMeal.title}</p>

    // --- 2. INKÖPSLISTA ---
    function ShoppingList({ items, groceries = [], members, settings, updateData, editItemId, setEditItemId }) {
      const [activeTab, setActiveTab] = useState('food'); 
      const [copyStatus, setCopyStatus] = useState('');
      const [title, setTitle] = useState(''); 
      const [notes, setNotes] = useState(''); 
      const [selectedMember, setSelectedMember] = useState(''); 
      const [category, setCategory] = useState(''); 
      const [details, setDetails] = useState(''); 
      const [link, setLink] = useState(''); 
      const [buyerId, setBuyerId] = useState(''); 
      const [isExpanded, setIsExpanded] = useState(false); 
      const [editingId, setEditingId] = useState(null);
      
      const activeItems = items.filter(i => !i.completed); 
      const completedItems = items.filter(i => i.completed);
      const activeGroceries = groceries.filter(i => !i.completed);
      const completedGroceries = groceries.filter(i => i.completed);

      const activeMember = members.find(m => m.id === selectedMember);
      const availableCategories = activeMember ? (settings.roleCategories[activeMember.role] || []) : [];

      useEffect(() => {
        if (editItemId) {
            const item = items.find(i => i.id === editItemId);
            if (item) { setActiveTab('general'); editItem(item); }
            setEditItemId(null);
        }
      }, [editItemId, items, setEditItemId]);

      const handleSave = (e) => { 
          e.preventDefault(); 
          if (!title.trim()) return; 
          if (editingId) { 
              updateData('shoppingItems', items.map(item => item.id === editingId ? { ...item, title, notes, memberId: selectedMember, buyerId, category, details, link } : item)); 
          } else { 
              updateData('shoppingItems', [...items, { id: generateId(), title, notes, memberId: selectedMember, buyerId, category, details, link, completed: false }]); 
          } 
          resetForm(); 
      };
      
      const editItem = (item) => { 
          setTitle(item.title); setNotes(item.notes || ''); setSelectedMember(item.memberId || ''); setBuyerId(item.buyerId || ''); setCategory(item.category || ''); setDetails(item.details || ''); setLink(item.link || ''); setEditingId(item.id); setIsExpanded(true); 
      };
      
      const toggleComplete = (id) => updateData('shoppingItems', items.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const deleteItem = (id) => updateData('shoppingItems', items.filter(i => i.id !== id));
      const resetForm = () => { setTitle(''); setNotes(''); setSelectedMember(''); setBuyerId(''); setCategory(''); setDetails(''); setLink(''); setIsExpanded(false); setEditingId(null); };

      const [groceryAmount, setGroceryAmount] = useState(''); 
      const [groceryItem, setGroceryItem] = useState(''); 
      const [groceryEditingId, setGroceryEditingId] = useState(null);
      
      const handleGrocerySave = (e) => { 
          e.preventDefault(); 
          if (!groceryItem.trim()) return; 
          if (groceryEditingId) { 
              updateData('groceries', groceries.map(item => item.id === groceryEditingId ? { ...item, amount: groceryAmount, title: groceryItem } : item)); 
              setGroceryEditingId(null); 
          } else { 
              updateData('groceries', [...groceries, { id: generateId(), amount: groceryAmount, title: groceryItem, completed: false }]); 
          } 
          setGroceryAmount(''); setGroceryItem(''); 
      };
      
      const editGrocery = (item) => { setGroceryAmount(item.amount || ''); setGroceryItem(item.title); setGroceryEditingId(item.id); };
      const toggleGroceryComplete = (id) => updateData('groceries', groceries.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const deleteGrocery = (id) => updateData('groceries', groceries.filter(i => i.id !== id));

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto">
          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 shadow-inner">
              <button onClick={() => {setActiveTab('food'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'food' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>🍎 Matvaror</button>
              <button onClick={() => {setActiveTab('general'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'general' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>🛍️ Övrigt</button>
          </div>
          
          {activeTab === 'general' ? (
              <>
                <form onSubmit={handleSave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6">
                    <div className="flex gap-2">
                        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad ska inhandlas?" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none" />
                        <button type="submit" disabled={!title.trim()} className="bg-[#581625] text-white px-5 rounded-2xl font-bold disabled:opacity-50">{editingId ? 'Spara' : 'Lägg till'}</button>
                    </div>
                    {isExpanded ? (
                        <div className="mt-4 space-y-3 pt-3 border-t">
                            <div className="flex gap-3">
                                <select value={selectedMember} onChange={e => setSelectedMember(e.target.value)} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none">
                                    <option value="">För vem?</option>
                                    {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                </select>
                                <select value={buyerId} onChange={e => setBuyerId(e.target.value)} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none">
                                    <option value="">Vem köper?</option>
                                    {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                </select>
                            </div>
                            <input value={details} onChange={e => setDetails(e.target.value)} placeholder="Detaljer / Storlek" className="w-full bg-[#F7F4EE] rounded-xl px-4 py-2.5 font-bold text-sm outline-none" />
                            <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Anteckningar / Fritext" className="w-full bg-[#F7F4EE] px-4 py-2.5 rounded-xl font-bold text-sm outline-none resize-none" rows="2"></textarea>
                            <div className="flex justify-end">
                                <button type="button" onClick={resetForm} className="text-xs font-bold text-[#1D2538]/40">Stäng</button>
                            </div>
                        </div>
                    ) : (
                        <button type="button" onClick={() => setIsExpanded(true)} className="mt-3 text-xs font-bold text-[#E55835] flex items-center gap-1 ml-1">
                            <Plus size={14} /> Fler detaljer & Fritext
                        </button>
                    )}
                </form>

                <div className="space-y-3">
                    {activeItems.map(item => (
                        <div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4">
                            <button onClick={() => toggleComplete(item.id)} className="mt-1 flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#E55835]"></button>
                            <div className="flex-1">
                                <h4 className="font-black text-lg leading-tight">{item.title}</h4>
                                {item.notes && <p className="text-xs font-semibold text-[#1D2538]/60 mt-1">{item.notes}</p>}
                                <div className="flex flex-wrap items-center gap-2 mt-2">
                                    {item.memberId && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg ${getTagColor(members.find(m => m.id === item.memberId)?.name)}`}>För: {members.find(m => m.id === item.memberId)?.name}</span>}
                                    {item.details && <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#F7F4EE] text-[#1D2538]/70">{item.details}</span>}
                                </div>
                            </div>
                            <div className="flex flex-col gap-2">
                                <button onClick={() => editItem(item)} className="text-[#1D2538]/30 hover:text-[#1D2538]"><Edit3 size={18} /></button>
                                <button onClick={() => deleteItem(item.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                            </div>
                        </div>
                    ))}
                </div>
              </>
          ) : (
              <>
                <form onSubmit={handleGrocerySave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6">
                    <div className="flex gap-2">
                        <input value={groceryItem} onChange={e => setGroceryItem(e.target.value)} placeholder="Matvara (t.ex. Mjölk)" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />
                        <input value={groceryAmount} onChange={e => setGroceryAmount(e.target.value)} placeholder="Mängd (2L)" className="w-1/3 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />
                        <button type="submit" disabled={!groceryItem.trim()} className="bg-[#E55835] text-white px-5 rounded-2xl font-bold disabled:opacity-50">{groceryEditingId ? 'Spara' : 'Lägg till'}</button>
                    </div>
                </form>

                <div className="space-y-3">
                    {activeGroceries.map(item => (
                        <div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center">
                            <button onClick={() => toggleGroceryComplete(item.id)} className="flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#E55835]"></button>
                            <div className="flex-1 text-sm">
                                <span className="font-black text-[#1D2538]">{item.title}</span>
                                {item.amount && <span className="ml-2 font-bold text-[#1D2538]/50">({item.amount})</span>}
                            </div>
                            <button onClick={() => editGrocery(item)} className="text-[#1D2538]/30 p-1 hover:text-[#1D2538]"><Edit3 size={18} /></button>
                            <button onClick={() => deleteGrocery(item.id)} className="text-[#1D2538]/30 hover:text-[#581625] p-1"><Trash2 size={18} /></button>
                        </div>
                    ))}
                </div>
              </>
          )}
        </div>
      );
    }

    // --- 3. RIKTIG KALENDER (MÅNADSRUTNÄT) ---
    function Calendar({ events, members, updateData, editItemId, setEditItemId }) {
      const [title, setTitle] = useState(''); 
      const [fromDate, setFromDate] = useState(''); 
      const [fromTime, setFromTime] = useState(''); 
      const [toDate, setToDate] = useState(''); 
      const [toTime, setToTime] = useState(''); 
      const [appliesToId, setAppliesToId] = useState(''); 
      const [responsibleId, setResponsibleId] = useState(''); 
      const [editingId, setEditingId] = useState(null); 
      const [showForm, setShowForm] = useState(false);

      const [currentMonthDate, setCurrentMonthDate] = useState(new Date());
      const [selectedDateFilter, setSelectedDateFilter] = useState(null);

      useEffect(() => {
        if (editItemId) {
            const event = events.find(e => e.id === editItemId);
            if (event) editEvent(event);
            setEditItemId(null);
        }
      }, [editItemId, events, setEditItemId]);

      const handleSave = (e) => { 
          e.preventDefault(); 
          if (!title.trim() || !fromDate) return; 
          const newEvent = { id: editingId || generateId(), title, fromDate, fromTime, toDate, toTime, appliesToId, responsibleId }; 
          
          if (editingId) {
            updateData('events', events.map(e => e.id === editingId ? newEvent : e));
          } else {
            updateData('events', [...events, newEvent]);
          }
          resetForm();
      };
      
      const editEvent = (event) => {
        setTitle(event.title); setFromDate(event.fromDate); setFromTime(event.fromTime || ''); setToDate(event.toDate || ''); setToTime(event.toTime || '');
        setAppliesToId(event.appliesToId || ''); setResponsibleId(event.responsibleId || ''); setEditingId(event.id); setShowForm(true);
      };

      const deleteEvent = (id) => updateData('events', events.filter(e => e.id !== id));
      const resetForm = () => { setTitle(''); setFromDate(''); setFromTime(''); setToDate(''); setToTime(''); setAppliesToId(''); setResponsibleId(''); setEditingId(null); setShowForm(false); };

      const year = currentMonthDate.getFullYear();
      const month = currentMonthDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      let startDayOfWeek = firstDayOfMonth.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const monthNames = ["Januari", "Februari", "Mars", "April", "Maj", "Juni", "Juli", "Augusti", "September", "Oktober", "November", "December"];

      const calendarDays = [];
      for (let i = 0; i < startDayOfWeek; i++) { calendarDays.push(null); }
      for (let d = 1; d <= daysInMonth; d++) {
          const monthStr = String(month + 1).padStart(2, '0');
          const dayStr = String(d).padStart(2, '0');
          calendarDays.push(`${year}-${monthStr}-${dayStr}`);
      }

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto">
          <div className="flex justify-between items-center mb-6">
              <button onClick={() => setShowForm(true)} className="bg-[#1D2538] text-white px-5 py-3 rounded-2xl font-black text-sm shadow-md flex items-center gap-2">
                  <Plus size={18} /> Ny händelse
              </button>
              <div className="flex items-center gap-2">
                  <button onClick={() => setCurrentMonthDate(new Date(year, month - 1, 1))} className="p-2 bg-white rounded-xl shadow-sm border"><ChevronLeft size={18}/></button>
                  <span className="font-black text-[#1D2538] min-w-[110px] text-center">{monthNames[month]} {year}</span>
                  <button onClick={() => setCurrentMonthDate(new Date(year, month + 1, 1))} className="p-2 bg-white rounded-xl shadow-sm border"><ChevronRight size={18}/></button>
              </div>
          </div>

          {showForm && (
              <form onSubmit={handleSave} className="bg-white rounded-3xl shadow-md border p-5 mb-6 animate-in fade-in">
                <h3 className="font-black text-lg text-[#1D2538] mb-4">{editingId ? 'Ändra händelse' : 'Ny händelse'}</h3>
                <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad händer?" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" />
                <div className="grid grid-cols-2 gap-3 mb-4">
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Från Datum</label>
                      <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" required />
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Från Tid</label>
                      <input type="time" value={fromTime} onChange={e => setFromTime(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" />
                    </div>
                </div>
                <div className="grid grid-cols-2 gap-3 mb-5">
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Vem gäller det?</label>
                      <select value={appliesToId} onChange={e => setAppliesToId(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none">
                        <option value="">Alla</option>
                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Ansvarig</label>
                      <select value={responsibleId} onChange={e => setResponsibleId(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none">
                        <option value="">Ingen</option>
                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                </div>
                <div className="flex gap-2">
                    <button type="submit" className="flex-1 bg-[#581625] text-white py-3 rounded-2xl font-black">{editingId ? 'Spara' : 'Lägg till'}</button>
                    <button type="button" onClick={resetForm} className="px-5 bg-[#1D2538]/5 text-[#1D2538] py-3 rounded-2xl font-black">Avbryt</button>
                </div>
              </form>
          )}

          <div className="bg-white rounded-3xl p-4 shadow-sm border mb-6">
              <div className="grid grid-cols-7 gap-1 text-center font-black text-xs text-[#1D2538]/40 mb-2">
                  <span>Mån</span><span>Tis</span><span>Ons</span><span>Tors</span><span>Fre</span><span>Lör</span><span>Sön</span>
              </div>
              <div className="grid grid-cols-7 gap-1">
                  {calendarDays.map((dateStr, idx) => {
                      if (!dateStr) return <div key={idx} className="h-12 bg-transparent"></div>;
                      const dayNum = parseInt(dateStr.split('-')[2]);
                      const hasEvents = events.some(e => e.fromDate === dateStr);
                      const isSelected = selectedDateFilter === dateStr;
                      const isToday = dateStr === getLocalToday();

                      return (
                          <button 
                              key={idx}
                              onClick={() => setSelectedDateFilter(selectedDateFilter === dateStr ? null : dateStr)}
                              className={`h-12 rounded-2xl flex flex-col items-center justify-center relative transition-all ${isSelected ? 'bg-[#581625] text-white' : (isToday ? 'bg-[#E55835]/10 text-[#E55835] font-black border border-[#E55835]/30' : 'hover:bg-[#F7F4EE] text-[#1D2538]')}`}
                          >
                              <span className="text-sm font-bold">{dayNum}</span>
                              {hasEvents && <span className={`w-1.5 h-1.5 rounded-full mt-0.5 ${isSelected ? 'bg-white' : 'bg-[#E55835]'}`}></span>}
                          </button>
                      );
                  })}
              </div>
          </div>

          <div>
            <div className="flex justify-between items-center mb-3">
                <h3 className="font-black text-lg text-[#1D2538]">{selectedDateFilter ? `Händelser ${selectedDateFilter}` : 'Alla händelser'}</h3>
                {selectedDateFilter && <button onClick={() => setSelectedDateFilter(null)} className="text-xs font-bold text-[#E55835]">Visa alla</button>}
            </div>
            <div className="space-y-3">
              {events.filter(e => !selectedDateFilter || e.fromDate === selectedDateFilter).map(event => (
                  <div key={event.id} className="bg-white rounded-3xl p-4 shadow-sm border flex gap-4 items-center">
                      <div className="flex flex-col items-center justify-center bg-[#E55835]/10 text-[#E55835] rounded-2xl p-2.5 min-w-[65px]">
                          <span className="text-xs font-black">{event.fromDate.substring(5)}</span>
                      </div>
                      <div className="flex-1">
                          <h4 className="font-black text-[#1D2538] text-base">{event.title}</h4>
                          <p className="text-xs font-bold text-[#1D2538]/50 mt-0.5">{event.fromTime || 'Heldag'}</p>
                      </div>
                      <div className="flex gap-2">
                          <button onClick={() => editEvent(event)} className="text-[#1D2538]/30 hover:text-[#1D2538] p-1"><Edit3 size={16} /></button>
                          <button onClick={() => deleteEvent(event.id)} className="text-[#1D2538]/30 hover:text-[#581625] p-1"><Trash2 size={16} /></button>
                      </div>
                  </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- 4. ATT GÖRA (TODO) ---
    function TodoList({ todos, members, updateData, editItemId, setEditItemId }) {
        const [title, setTitle] = useState('');
        const [notes, setNotes] = useState(''); 
        const [memberId, setMemberId] = useState('');
        const [dueDate, setDueDate] = useState('');
        const [editingId, setEditingId] = useState(null);

        const activeTodos = todos.filter(t => !t.completed);
        const completedTodos = todos.filter(t => t.completed);

        useEffect(() => {
            if (editItemId) {
                const todo = todos.find(t => t.id === editItemId);
                if (todo) { setTitle(todo.title); setNotes(todo.notes || ''); setMemberId(todo.memberId || ''); setDueDate(todo.dueDate || ''); setEditingId(todo.id); }
                setEditItemId(null);
            }
        }, [editItemId, todos, setEditItemId]);

        const handleSave = (e) => {
            e.preventDefault();
            if (!title.trim()) return;
            if(editingId) {
                updateData('todos', todos.map(t => t.id === editingId ? { ...t, title, notes, memberId, dueDate } : t));
                setEditingId(null);
            } else {
                updateData('todos', [...todos, { id: generateId(), title, notes, memberId, dueDate, completed: false }]);
            }
            setTitle(''); setNotes(''); setMemberId(''); setDueDate('');
        };

        const toggleComplete = (id) => updateData('todos', todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
        const deleteTodo = (id) => updateData('todos', todos.filter(t => t.id !== id));

        return (
            <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto">
                <form onSubmit={handleSave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6">
                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad ska göras?" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-3" />
                    <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Fritext / Anteckningar" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none mb-3 resize-none" rows="2"></textarea>
                    <div className="flex gap-2">
                        <select value={memberId} onChange={e => setMemberId(e.target.value)} className="flex-1 bg-[#F7F4EE] px-3 py-3 rounded-2xl font-bold text-sm outline-none">
                            <option value="">Vem ska göra detta?</option>
                            {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                        <button type="submit" disabled={!title.trim()} className="bg-[#581625] text-white px-5 rounded-2xl font-bold">{editingId ? 'Spara' : 'Lägg till'}</button>
                    </div>
                </form>

                <div className="space-y-3">
                    {activeTodos.map(todo => (
                        <div key={todo.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center">
                            <button onClick={() => toggleComplete(todo.id)} className="flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#1D2538]"></button>
                            <div className="flex-1">
                                <h4 className="font-bold leading-tight text-lg">{todo.title}</h4>
                                {todo.notes && <p className="text-xs font-semibold text-[#1D2538]/60 mt-1">{todo.notes}</p>}
                            </div>
                            <button onClick={() => deleteTodo(todo.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    // --- 5. MATSEDEL & RECEPTBANK ---
    function MealPlanner({ meals, recipes = [], dismissedRecipes = [], updateData, setActiveTab }) {
      const days = ['Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör', 'Sön'];
      const [activeWeek, setActiveWeek] = useState('current');
      const [subTab, setSubTab] = useState('menu'); // 'menu' eller 'recipes'

      // Recept state
      const [showRecipeModal, setShowRecipeModal] = useState(false);
      const [editingRecipeId, setEditingRecipeId] = useState(null);
      const [reviewingOriginalTitle, setReviewingOriginalTitle] = useState(null);
      const [recipeTitle, setRecipeTitle] = useState('');
      const [recipeCategory, setRecipeCategory] = useState('Vardag');
      const [tasteRating, setTasteRating] = useState(5);
      const [easeRating, setEaseRating] = useState(5);
      const [recipeIngredients, setRecipeIngredients] = useState('');
      const [recipeLink, setRecipeLink] = useState('');
      const [selectingForDay, setSelectingForDay] = useState(null); 
      const [showScraperFor, setShowScraperFor] = useState(null);
      const [portions, setPortions] = useState(4);
      const [isFetching, setIsFetching] = useState(false);
      const [successMsg, setSuccessMsg] = useState('');

      // Hitta rätter i veckomenyerna som ännu inte finns i receptbiblioteket (och inte har tagits bort därifrån)
      const savedTitles = new Set((recipes || []).map(r => (r.title || '').trim().toLowerCase()));
      const dismissedSet = new Set((dismissedRecipes || []).map(t => (t || '').trim().toLowerCase()));
      const unreviewedMap = new Map();

      ['current', 'next'].forEach(weekKey => {
        const weekData = meals?.[weekKey] || {};
        days.forEach(day => {
          const meal = weekData[day];
          const rawTitle = (meal?.title || '').trim();
          if (!rawTitle) return;
          const normTitle = rawTitle.toLowerCase();
          if (savedTitles.has(normTitle) || dismissedSet.has(normTitle)) return;

          const existing = unreviewedMap.get(normTitle);
          const rawLink = (meal?.link || '').trim();
          const weekLabel = weekKey === 'current' ? 'Denna vecka' : 'Nästa vecka';

          if (!existing) {
            unreviewedMap.set(normTitle, {
              normTitle,
              title: rawTitle,
              link: rawLink,
              source: `${weekLabel} (${day})`
            });
          } else if (!existing.link && rawLink) {
            unreviewedMap.set(normTitle, { ...existing, link: rawLink });
          }
        });
      });

      const unreviewedRecipes = Array.from(unreviewedMap.values());

      const handleChange = (day, field, value) => {
        updateData('meals', prev => ({
            ...prev,
            [activeWeek]: { ...prev[activeWeek], [day]: { ...prev[activeWeek][day], [field]: value } }
        }));
      };

      const closeRecipeModal = () => {
        setShowRecipeModal(false);
        setEditingRecipeId(null);
        setReviewingOriginalTitle(null);
        setRecipeTitle('');
        setRecipeCategory('Vardag');
        setTasteRating(5);
        setEaseRating(5);
        setRecipeIngredients('');
        setRecipeLink('');
      };

      const openNewRecipeModal = () => {
        closeRecipeModal();
        setShowRecipeModal(true);
      };

      const openEditRecipeModal = (recipe) => {
        setEditingRecipeId(recipe.id);
        setReviewingOriginalTitle(null);
        setRecipeTitle(recipe.title || '');
        setRecipeCategory(recipe.category || 'Vardag');
        setTasteRating(recipe.taste || 5);
        setEaseRating(recipe.ease || 5);
        setRecipeIngredients(recipe.ingredients || '');
        setRecipeLink(recipe.link || '');
        setShowRecipeModal(true);
      };

      const openReviewModal = (unreviewedItem) => {
        setEditingRecipeId(null);
        setReviewingOriginalTitle(unreviewedItem.normTitle);
        setRecipeTitle(unreviewedItem.title);
        setRecipeLink(unreviewedItem.link || '');
        setRecipeCategory('Vardag');
        setTasteRating(5);
        setEaseRating(5);
        setRecipeIngredients('');
        setShowRecipeModal(true);
      };

      const dismissUnreviewed = (normTitle) => {
        if (!dismissedSet.has(normTitle)) {
          updateData('dismissedRecipes', [...(dismissedRecipes || []), normTitle]);
        }
      };

      const restoreDismissed = () => {
        updateData('dismissedRecipes', []);
      };

      const handleSaveRecipe = (e) => {
          e.preventDefault();
          if(!recipeTitle.trim()) return;
          const cleanTitle = recipeTitle.trim();
          const cleanLink = recipeLink.trim();

          if (editingRecipeId) {
              updateData('recipes', recipes.map(r => r.id === editingRecipeId ? {
                  ...r,
                  title: cleanTitle,
                  category: recipeCategory,
                  taste: Number(tasteRating),
                  ease: Number(easeRating),
                  ingredients: recipeIngredients,
                  link: cleanLink
              } : r));
          } else {
              const newRecipe = {
                  id: generateId(),
                  title: cleanTitle,
                  category: recipeCategory,
                  taste: Number(tasteRating),
                  ease: Number(easeRating),
                  ingredients: recipeIngredients,
                  link: cleanLink
              };
              updateData('recipes', [...recipes, newRecipe]);

              // Synka tillbaka eventuellt justerat namn eller ny länk till veckomenyn så rätten matchar biblioteket
              if (reviewingOriginalTitle && (reviewingOriginalTitle !== cleanTitle.toLowerCase() || cleanLink)) {
                  updateData('meals', prev => {
                      const nextMeals = { ...prev };
                      ['current', 'next'].forEach(wKey => {
                          if (!nextMeals[wKey]) return;
                          const updatedWeek = { ...nextMeals[wKey] };
                          days.forEach(d => {
                              const m = updatedWeek[d];
                              if (m?.title && m.title.trim().toLowerCase() === reviewingOriginalTitle) {
                                  updatedWeek[d] = {
                                      ...m,
                                      title: cleanTitle,
                                      link: cleanLink || m.link || ''
                                  };
                              }
                          });
                          nextMeals[wKey] = updatedWeek;
                      });
                      return nextMeals;
                  });
              }
          }
          closeRecipeModal();
      };

      const deleteRecipe = (id) => {
          updateData('recipes', recipes.filter(r => r.id !== id));
      };

      const selectRecipeForDay = (recipe) => {
          if (selectingForDay) {
              handleChange(selectingForDay, 'title', recipe.title);
              if (recipe.link) {
                  handleChange(selectingForDay, 'link', recipe.link);
              }
              setSelectingForDay(null);
          }
      };

      const fetchIngredients = async (day) => {
        const url = meals[activeWeek][day].link;
        if(!url) return;
        setIsFetching(true);
        try {
            const payload = {
                contents: [{ role: 'user', parts: [{ text: `Jag vill laga receptet från denna länk: ${url} för ${portions} personer. Läs receptet och ge mig enbart en lista med ingredienserna. Svara i strikt JSON-format som en array av objekt med formen {"amount": "mängd", "item": "ingrediens"}.` }] }],
                tools: [{ "google_search": {} }],
                generationConfig: { responseMimeType: "application/json" }
            };
            const apiKey = ""; 
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            
            if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                const ingredients = JSON.parse(result.candidates[0].content.parts[0].text);
                const newGroceries = ingredients.map(ing => ({ id: generateId(), amount: ing.amount || '', title: ing.item || ing.title, completed: false }));
                updateData('groceries', prev => [...(prev || []), ...newGroceries]);
                
                setSuccessMsg('✅ Ingredienser tillagda i Inköpslistan!');
                setTimeout(() => setSuccessMsg(''), 4000);
            }
        } catch (error) {
            console.error("Kunde inte hämta recept:", error);
            setSuccessMsg('❌ Kunde tyvärr inte hämta receptet.');
            setTimeout(() => setSuccessMsg(''), 4000);
        }
        setIsFetching(false);
        setShowScraperFor(null);
      };

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto space-y-6">
          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] rounded-3xl p-6 text-white shadow-lg">
            <h2 className="text-2xl font-black mb-1 flex items-center gap-3"><Utensils size={24}/> Mat & Recept</h2>
            <p className="text-white/90 text-sm font-bold mt-1">Planera veckomenyn och spara familjens favoriter.</p>
          </div>

          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 border shadow-inner">
             <button onClick={() => setSubTab('menu')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${subTab === 'menu' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>📅 Matsedel</button>
             <button onClick={() => setSubTab('recipes')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all flex items-center justify-center gap-1.5 ${subTab === 'recipes' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>
                <span>📖 Receptbank ({recipes.length})</span>
                {unreviewedRecipes.length > 0 && (
                    <span className="bg-[#E55835] text-white text-[10px] font-black px-1.5 py-0.5 rounded-full leading-none">{unreviewedRecipes.length}</span>
                )}
             </button>
          </div>

          {successMsg && (
            <div className="bg-[#1D2538] text-white p-4 rounded-2xl font-bold text-center text-sm shadow-md">
              {successMsg}
            </div>
          )}

          {subTab === 'menu' ? (
              <div>
                  <div className="flex bg-[#F7F4EE] rounded-xl p-1 mb-6 border">
                     <button onClick={() => setActiveWeek('current')} className={`flex-1 py-2 text-xs font-black rounded-lg ${activeWeek === 'current' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>Denna vecka</button>
                     <button onClick={() => setActiveWeek('next')} className={`flex-1 py-2 text-xs font-black rounded-lg ${activeWeek === 'next' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>Nästa vecka</button>
                  </div>
                  <div className="space-y-4">
                    {days.map(day => (
                      <div key={day} className="bg-white p-4 rounded-3xl shadow-sm border flex flex-col gap-3">
                        <div className="flex items-center gap-4">
                          <span className="font-black text-[#1D2538]/50 w-10 uppercase text-sm">{day}</span>
                          <input type="text" value={meals[activeWeek]?.[day]?.title || ''} onChange={(e) => handleChange(day, 'title', e.target.value)} placeholder="Vad ska vi äta?" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl text-sm font-bold outline-none text-[#1D2538]" />
                          <button onClick={() => setSelectingForDay(day)} title="Välj från receptbanken" className="bg-[#581625]/10 text-[#581625] p-3 rounded-2xl hover:bg-[#581625]/20 shrink-0"><BookOpen size={18}/></button>
                        </div>
                        
                        <div className="flex items-center gap-2 pl-14">
                           <input type="url" value={meals[activeWeek]?.[day]?.link || ''} onChange={(e) => handleChange(day, 'link', e.target.value)} placeholder="Länk till recept (frivillig)" className="flex-1 bg-transparent px-2 py-1 text-[11px] font-bold outline-none text-[#E55835] placeholder-[#E55835]/40 border-b border-transparent focus:border-[#E55835]/30" />
                          {meals[activeWeek]?.[day]?.link && (
                            <button onClick={() => setShowScraperFor(showScraperFor === day ? null : day)} className="bg-[#1D2538] text-white text-[10px] font-black px-3 py-1.5 rounded-xl flex items-center gap-1 hover:bg-[#581625] transition-colors shrink-0">
                              <Sparkles size={12}/> AI Köp
                            </button>
                          )}
                        </div>

                        {showScraperFor === day && (
                            <div className="mt-2 p-4 bg-[#F7F4EE] rounded-2xl border flex flex-col gap-3">
                                <label className="text-xs font-black text-[#1D2538]/70">Antal portioner:</label>
                                <div className="flex gap-2">
                                    {[2,3,4,5,6,8].map(num => (
                                        <button key={num} onClick={() => setPortions(num)} className={`w-10 h-10 rounded-xl font-black text-sm flex justify-center items-center ${portions === num ? 'bg-[#E55835] text-white shadow-md' : 'bg-white text-[#1D2538] border'}`}>{num}</button>
                                    ))}
                                </div>
                                <div className="flex gap-2 mt-2">
                                    <button onClick={() => fetchIngredients(day)} disabled={isFetching} className="flex-1 bg-[#1D2538] text-white py-2.5 rounded-xl text-xs font-black flex justify-center items-center gap-2 disabled:opacity-50">
                                        {isFetching ? <Loader2 size={14} className="animate-spin" /> : <ShoppingCart size={14} />}
                                        {isFetching ? 'Skapar lista...' : 'Hämta ingredienser'}
                                    </button>
                                    <button onClick={() => setShowScraperFor(null)} className="px-4 bg-white text-[#1D2538] py-2.5 rounded-xl text-xs font-black border">Avbryt</button>
                                </div>
                            </div>
                        )}
                      </div>
                    ))}
                  </div>

                  {selectingForDay && (
                      <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                          <div className="bg-white rounded-3xl p-6 w-full max-w-md max-h-[80vh] overflow-y-auto space-y-4 shadow-2xl">
                              <div className="flex justify-between items-center">
                                  <h3 className="font-black text-lg">Välj recept för {selectingForDay}</h3>
                                  <button onClick={() => setSelectingForDay(null)} className="p-2"><X size={20}/></button>
                              </div>
                              {recipes.length === 0 ? (
                                  <p className="text-sm font-bold text-gray-400 text-center py-6">Inga sparade recept ännu.</p>
                              ) : (
                                  <div className="space-y-2">
                                      {recipes.map(r => (
                                          <div key={r.id} onClick={() => selectRecipeForDay(r)} className="p-3 bg-[#F7F4EE] rounded-2xl cursor-pointer hover:bg-[#E55835]/10 flex justify-between items-center">
                                              <div>
                                                  <div className="font-black text-[#1D2538]">{r.title}</div>
                                                  <div className="text-xs font-bold text-gray-500">Smak: {r.taste}/5 | Enkelhet: {r.ease}/5</div>
                                              </div>
                                              <span className="text-xs font-black bg-[#E55835] text-white px-3 py-1.5 rounded-xl">Välj</span>
                                          </div>
                                      ))}
                                  </div>
                              )}
                          </div>
                      </div>
                  )}
              </div>
          ) : (
              <div>
                  <button onClick={openNewRecipeModal} className="w-full bg-[#1D2538] text-white py-4 rounded-3xl font-black text-sm shadow-md mb-6 flex justify-center items-center gap-2">
                      <Plus size={18} /> Spara nytt recept
                  </button>

                  <div className="space-y-4">
                      {recipes.length === 0 ? (
                          <div className="bg-white p-8 rounded-3xl text-center border font-bold text-sm text-gray-400">
                              Inga recept sparade än. Klicka ovan eller recensera ett recept från veckomenyn nedan!
                          </div>
                      ) : (
                          recipes.map(r => (
                              <div key={r.id} className="bg-white p-5 rounded-3xl shadow-sm border space-y-2">
                                  <div className="flex justify-between items-start">
                                      <div>
                                          <span className="text-[10px] font-black uppercase bg-[#E55835]/10 text-[#E55835] px-2.5 py-1 rounded-lg">{r.category}</span>
                                          <h3 className="font-black text-xl text-[#1D2538] mt-1">{r.title}</h3>
                                      </div>
                                      <div className="flex items-center gap-2">
                                          <button onClick={() => openEditRecipeModal(r)} className="text-gray-300 hover:text-[#1D2538] p-1"><Edit3 size={17}/></button>
                                          <button onClick={() => deleteRecipe(r.id)} className="text-gray-300 hover:text-red-600 p-1"><Trash2 size={18}/></button>
                                      </div>
                                  </div>
                                  <div className="flex gap-4 pt-1 text-xs font-black text-[#1D2538]/70">
                                      <span className="flex items-center gap-1">⭐ Smak: {r.taste}/5</span>
                                      <span className="flex items-center gap-1">⚡ Enkelhet: {r.ease}/5</span>
                                  </div>
                                  {r.ingredients && <p className="text-xs font-semibold text-gray-500 mt-2 bg-[#F7F4EE] p-3 rounded-2xl"><strong>Ingredienser:</strong> {r.ingredients}</p>}
                                  {r.link && <a href={r.link} target="_blank" rel="noopener noreferrer" className="inline-block text-xs font-black text-[#E55835] mt-1 underline">🔗 Gå till receptlänk</a>}
                              </div>
                          ))
                      )}
                  </div>

                  {/* ORECENSERADE RECEPT FRÅN VECKOMENYN */}
                  <div className="mt-8 pt-6 border-t border-[#1D2538]/10">
                      <div className="flex justify-between items-center mb-3 ml-1">
                          <div>
                              <h3 className="text-sm font-black text-[#1D2538] uppercase tracking-wider flex items-center gap-2">
                                  <Star size={16} className="text-[#E55835]" /> Orecenserade recept
                                  {unreviewedRecipes.length > 0 && (
                                      <span className="bg-[#E55835]/15 text-[#E55835] text-[10px] font-black px-2 py-0.5 rounded-full">{unreviewedRecipes.length}</span>
                                  )}
                              </h3>
                              <p className="text-xs font-bold text-[#1D2538]/50 mt-0.5">Rätter från veckomenyn som inte sparats i biblioteket ännu.</p>
                          </div>
                      </div>

                      {unreviewedRecipes.length === 0 ? (
                          <div className="bg-white/60 p-5 rounded-3xl text-center border border-dashed border-[#1D2538]/15">
                              <p className="text-xs font-bold text-[#1D2538]/40">Inga orecenserade rätter i veckomenyn just nu.</p>
                          </div>
                      ) : (
                          <div className="space-y-3">
                              {unreviewedRecipes.map(item => (
                                  <div key={item.normTitle} className="bg-white p-4 rounded-3xl shadow-sm border border-[#E55835]/25 flex items-center justify-between gap-3">
                                      <div className="min-w-0 flex-1">
                                          <div className="flex items-center gap-2 flex-wrap">
                                              <h4 className="font-black text-base text-[#1D2538] truncate">{item.title}</h4>
                                              <span className="text-[10px] font-black bg-[#F7F4EE] text-[#1D2538]/60 px-2 py-0.5 rounded-lg shrink-0">{item.source}</span>
                                          </div>
                                          {item.link && (
                                              <a href={item.link} target="_blank" rel="noopener noreferrer" className="block text-[11px] font-bold text-[#E55835] truncate mt-1 underline">
                                                  🔗 {item.link}
                                              </a>
                                          )}
                                      </div>
                                      <div className="flex items-center gap-2 shrink-0">
                                          <button
                                              onClick={() => openReviewModal(item)}
                                              className="bg-[#E55835] text-white text-xs font-black px-3.5 py-2 rounded-2xl shadow-sm hover:bg-[#d14c2b] transition-colors flex items-center gap-1"
                                          >
                                              <Star size={13} /> Recensera
                                          </button>
                                          <button
                                              onClick={() => dismissUnreviewed(item.normTitle)}
                                              title="Ta bort från orecenserade"
                                              className="p-2 text-[#1D2538]/30 hover:text-[#581625] rounded-xl hover:bg-[#581625]/5 transition-colors"
                                          >
                                              <Trash2 size={18} />
                                          </button>
                                      </div>
                                  </div>
                              ))}
                          </div>
                      )}

                      {dismissedRecipes.length > 0 && (

                              <button onClick={restoreDismissed} className="text-[11px] font-bold text-[#1D2538]/40 hover:text-[#1D2538] underline">
                                  Återställ borttagna rätter ({dismissedRecipes.length})
                              </button>

                  {showRecipeModal && (

                              <h3 className="font-black text-xl text-[#1D2538]">{editingRecipeId ? 'Ändra recept' : (reviewingOriginalTitle ? 'Recensera & spara recept' : 'Spara recept')}</h3>
                              <input value={recipeTitle} onChange={e => setRecipeTitle(e.target.value)} placeholder="Receptets namn (t.ex. Lasagne)" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none" required />
                              
                              <div className="grid grid-cols-2 gap-3">
                                  <div>
                                      <label className="text-[10px] font-black uppercase text-gray-400 block mb-1">Kategori</label>
                                      <select value={recipeCategory} onChange={e => setRecipeCategory(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-2xl font-bold text-sm outline-none">
                                          <option>Vardag</option><option>Helg</option><option>Snabblagat</option><option>Barnens favorit</option>
                                      </select>
                                  </div>
                                  <div>
                                      <label className="text-[10px] font-black uppercase text-gray-400 block mb-1">Smakbetyg (1-5)</label>
                                      <select value={tasteRating} onChange={e => setTasteRating(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-2xl font-bold text-sm outline-none">
                                          <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                                          <option value="4">⭐⭐⭐⭐ (4/5)</option>
                                          <option value="3">⭐⭐⭐ (3/5)</option>
                                          <option value="2">⭐⭐ (2/5)</option>
                                          <option value="1">⭐ (1/5)</option>

                              <div>
                                  <label className="text-[10px] font-black uppercase text-gray-400 block mb-1">Enkelhet (1-5)</label>
                                  <select value={easeRating} onChange={e => setEaseRating(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-2xl font-bold text-sm outline-none">
                                      <option value="5">⚡⚡⚡⚡⚡ Extremt enkelt</option>
                                      <option value="4">⚡⚡⚡⚡ Enkelt</option>
                                      <option value="3">⚡⚡⚡ Medel</option>
                                      <option value="2">⚡⚡ Lite pilligt</option>
                                      <option value="1">⚡ Avancerat</option>
                                  </select>
                              </div>

                              <input type="url" value={recipeLink} onChange={e => setRecipeLink(e.target.value)} placeholder="Receptets webblänk (frivillig)" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />

                              <textarea value={recipeIngredients} onChange={e => setRecipeIngredients(e.target.value)} placeholder="Ingredienser / Anteckningar..." className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none resize-none" rows="3"></textarea>

                              <div className="flex gap-2 pt-2">
