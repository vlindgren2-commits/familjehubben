    // --- 6. CYKELKOLLEN ---
    function HealthTracker({ logs, members, updateData, setActiveTab, localProfileId, settings }) {
      const trackedMemberId = settings.cycleTrackerMemberId;
      const trackedMember = members.find(m => m.id === trackedMemberId);
      const isTrackingMe = trackedMember && trackedMember.id === localProfileId;
      
      const [mood, setMood] = useState('Bra');
      const [bleeding, setBleeding] = useState('Nej');
      const [logDate, setLogDate] = useState(getLocalToday());
      const [editingId, setEditingId] = useState(null);

      if (!trackedMember) {
          return (
              <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto">
                <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
                <div className="bg-white p-8 rounded-3xl shadow-sm border text-center mt-10">
                    <Activity size={40} className="mx-auto text-[#1D2538]/20 mb-4" />
                    <h3 className="font-black text-xl text-[#1D2538] mb-2">Ingen spåras</h3>
                    <p className="text-sm font-bold text-[#1D2538]/60 mb-6">Gå till Familj & Inställningar och välj vem som ska spåras.</p>
                    <button onClick={() => setActiveTab('settings_family')} className="bg-[#581625] text-white px-6 py-3 rounded-2xl font-black">Gå till Inställningar</button>
                </div>
              </div>
          );
      }

      const memberLogs = logs.filter(l => l.memberId === trackedMember.id).sort((a,b) => new Date(b.date) - new Date(a.date));
      const lastPeriod = memberLogs.find(l => l.bleeding !== 'Nej');
      let currentPhase = 'Ingen data';
      let cycleDay = 1;
      let phaseTips = 'Logga din mens för att starta cykelkollen.';
      let partnerTips = 'Väntar på data från partnern.';

      if (lastPeriod) {
          const diffTime = Math.abs(new Date() - new Date(lastPeriod.date));
          const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
          cycleDay = (diffDays % 28) + 1;

          if(cycleDay <= 5) { currentPhase = 'Mens'; phaseTips = 'Vila och återhämtning.'; partnerTips = 'Erbjud extra avlastning hemma.'; }
          else if(cycleDay <= 13) { currentPhase = 'Follikulär'; phaseTips = 'Stigande energinivåer!'; partnerTips = 'Perfekt tid för roliga aktiviteter.'; }
          else if(cycleDay <= 16) { currentPhase = 'Ägglossning'; phaseTips = 'Toppenergi och socialt humör.'; partnerTips = 'Njut av en harmonisk fas.'; }
          else { currentPhase = 'Luteal (PMS)'; phaseTips = 'Sjunkande tempo. Var snäll mot dig själv.'; partnerTips = 'Ha extra tålamod och avlasta direkt.'; }
      }

      const handleSave = (e) => {
        e.preventDefault();
        if (editingId) {
            updateData('healthLogs', logs.map(l => l.id === editingId ? { ...l, mood, bleeding, date: logDate } : l));
        } else {
            const filteredLogs = logs.filter(l => !(l.date === logDate && l.memberId === trackedMember.id));
            updateData('healthLogs', [{ id: generateId(), memberId: trackedMember.id, date: logDate, mood, bleeding }, ...filteredLogs]);
        }
        setMood('Bra'); setBleeding('Nej'); setEditingId(null);
      };

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto space-y-6">
          <button onClick={() => setActiveTab('menu')} className="text-[#1D2538]/50 font-bold text-sm flex items-center gap-1"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
          
          <div className="bg-gradient-to-br from-[#F2C4C4] to-[#f4d5d5] rounded-3xl p-6 text-[#581625] shadow-lg relative overflow-hidden">
             <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-30 blur-3xl"></div>
             <h2 className="text-3xl font-black mb-1">Cykeldag {cycleDay || 1}</h2>
             <p className="text-[#581625]/80 text-sm font-bold">{currentPhase} - {trackedMember.name}</p>

             <div className="mt-6 bg-white/40 backdrop-blur-md rounded-2xl p-4 relative overflow-hidden">
                 <div className="flex justify-between text-[10px] font-black uppercase text-[#581625]/60 mb-2">
                     <span>Mens</span><span>Follikulär</span><span>Ägglossning</span><span>Luteal</span>
                 </div>
                 <svg viewBox="0 0 500 120" className="w-full h-24 overflow-visible">
                     <path d="M 0 100 Q 80 90, 150 70 T 300 30 T 450 80 T 500 100" fill="none" stroke="#E55835" strokeWidth="3" opacity="0.8"/>
                     <path d="M 0 110 Q 120 100, 250 50 T 400 90 T 500 110" fill="none" stroke="#89B4E5" strokeWidth="3" opacity="0.8"/>
                     <circle cx={Math.min(480, Math.max(20, (cycleDay || 1) * 17))} cy="65" r="7" fill="#581625" className="animate-pulse" />
                 </svg>
                 <div className="flex justify-center mt-2">
                     <span className="text-[11px] font-black bg-[#581625] text-white px-3 py-1 rounded-full shadow-sm">Nuvarande dag ({cycleDay || 1})</span>
                 </div>
             </div>
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-sm border space-y-4">
              <h3 className="font-black text-lg text-[#1D2538]">Dagens insikter</h3>
              <div className="grid grid-cols-2 gap-3">
                  <div className="bg-[#F7F4EE] p-4 rounded-2xl">
                      <span className="text-[10px] font-black uppercase text-[#E55835]">Välmående & Kropp</span>
                      <p className="text-xs font-bold text-[#1D2538] mt-1">{phaseTips}</p>
                  </div>
                  <div className="bg-[#581625]/5 p-4 rounded-2xl border border-[#581625]/10">
                      <span className="text-[10px] font-black uppercase text-[#581625]">Tips till Partner</span>
                      <p className="text-xs font-bold text-[#581625] mt-1">{partnerTips}</p>
                  </div>
              </div>
          </div>

          {isTrackingMe ? (
              <form onSubmit={handleSave} className="bg-white p-5 rounded-3xl shadow-sm border space-y-4">
                <h3 className="font-black text-lg text-[#1D2538]">{editingId ? 'Ändra logg' : 'Logga dagens mående'}</h3>
                <input type="date" value={logDate} onChange={e => setLogDate(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none" required />
                <div className="flex gap-4">
                  <div className="flex-1">
                    <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 block">Mående</label>
                    <select value={mood} onChange={e => setMood(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none">
                      <option>Toppen</option><option>Bra</option><option>Helt okej</option><option>Stressad</option><option>Låg</option><option>PMS</option>
                    </select>
                  </div>
                  <div className="flex-1">
                    <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 block">Blödning</label>
                    <select value={bleeding} onChange={e => setBleeding(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none">
                      <option>Nej</option><option>Ja, Lätt</option><option>Ja, Normal</option><option>Ja, Kraftig</option>
                    </select>
                  </div>
                </div>
                <button type="submit" className="w-full bg-[#581625] text-white py-3.5 rounded-2xl font-black shadow-md">Spara logg</button>
              </form>
          ) : (
              <div className="bg-white p-4 rounded-3xl text-center border font-bold text-xs text-[#1D2538]/50">
                  Bara {trackedMember.name} kan logga nya värden på sin enhet.
              </div>
          )}
        </div>
      );
    }

    // --- 7. FAMILJ & INSTÄLLNINGAR ---
    function SettingsFamily({ members, settings, updateData, setActiveTab, localProfileId }) {
      const [newName, setNewName] = useState('');
      const ROLES = ['Barn', 'Mamma', 'Pappa', 'Annan'];

      const addMember = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        updateData('members', [...members, { id: generateId(), name: newName.trim(), role: 'Barn', email: '', sizes: {}, birthDate: '' }]);
        setNewName('');
      };

      const updateMember = (id, updates) => updateData('members', members.map(m => m.id === id ? { ...m, ...updates } : m));
      const deleteMember = (id) => updateData('members', members.filter(m => m.id !== id));

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto space-y-6">
          <button onClick={() => setActiveTab('menu')} className="text-[#1D2538]/50 font-bold text-sm flex items-center gap-1"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>

          <div className="bg-gradient-to-r from-[#A7CEF6]/20 to-[#4B88C4]/20 rounded-3xl p-5 border border-[#4B88C4]/30">
            <h3 className="font-black text-lg text-[#1D2538] mb-2 flex items-center gap-2"><Sun size={20} className="text-[#4B88C4]" /> Väder & Ort</h3>
            <input type="text" placeholder="Ort (t.ex. Stockholm)" value={settings.weather?.city || ''} onChange={(e) => updateData('settings', { ...settings, weather: { ...settings.weather, city: e.target.value } })} className="w-full bg-white rounded-2xl px-4 py-3 font-bold text-[#1D2538] outline-none shadow-sm" />
          </div>

          <div className="bg-[#F2C4C4]/20 rounded-3xl p-5 border border-[#581625]/20">
            <h3 className="font-black text-lg text-[#581625] mb-2">🌸 Vem spåras i Cykelkollen?</h3>
            <select value={settings.cycleTrackerMemberId || ''} onChange={e => updateData('settings', { ...settings, cycleTrackerMemberId: e.target.value })} className="w-full bg-white rounded-2xl px-4 py-3 font-black text-[#581625] outline-none shadow-sm">
                <option value="">-- Välj person --</option>
                {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          </div>

          <form onSubmit={addMember} className="flex gap-3 bg-white p-2 rounded-3xl border shadow-sm">
            <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Lägg till familjemedlem..." className="flex-1 bg-transparent px-4 py-2 outline-none font-bold" />
            <button type="submit" disabled={!newName.trim()} className="bg-[#1D2538] text-white px-5 rounded-2xl font-bold">Lägg till</button>
          </form>

          <div className="space-y-4">
            {members.map(member => (
              <div key={member.id} className="bg-white rounded-3xl shadow-sm border p-5">
                <div className="flex justify-between items-center mb-3 pb-3 border-b">
                  <h4 className="font-black text-xl">{member.name}</h4>
                  <button onClick={() => deleteMember(member.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <select value={member.role || 'Barn'} onChange={e => updateMember(member.id, { role: e.target.value })} className="rounded-2xl bg-[#F7F4EE] px-3 py-2.5 outline-none font-bold text-sm">
                    {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                  <input type="date" value={member.birthDate || ''} onChange={e => updateMember(member.id, { birthDate: e.target.value })} className="rounded-2xl bg-[#F7F4EE] px-3 py-2.5 outline-none font-bold text-sm" />
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- 8. BARNENS UTVECKLING ---
    function ChildDevelopment({ members, setActiveTab }) {
      const children = members.filter(m => m.role === 'Barn' && m.birthDate);
      return (
        <div className="p-4 pb-32 h-full overflow-y-auto max-w-xl mx-auto space-y-4">
          <button onClick={() => setActiveTab('menu')} className="text-[#1D2538]/50 font-bold text-sm flex items-center gap-1"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
          <div className="bg-[#A7CEF6] rounded-3xl p-6 text-[#1D2538] shadow-lg">
             <h2 className="text-2xl font-black mb-1 flex items-center gap-3"><Baby size={24}/> Barnens Utveckling</h2>
             <p className="text-[#1D2538]/80 text-sm font-bold">Tips och råd baserat på ålder.</p>
          </div>
          {children.map(child => (
              <div key={child.id} className="bg-white p-5 rounded-3xl shadow-sm border">
                  <h3 className="font-black text-xl text-[#1D2538] mb-1">{child.name}</h3>
                  <p className="text-sm font-semibold text-[#1D2538]/70">Fas-tips och vägledning för den aktuella åldern.</p>
              </div>
          ))}
        </div>
      );
    }

    // --- 9. MENY (MER) ---
    function Menu({ setActiveTab }) {
      const items = [
        { id: 'todo', title: 'Att göra', desc: 'Uppgifter och ansvarsområden', icon: <CheckSquare size={28} />, color: 'text-[#E55835]', bg: 'bg-[#E55835]/10' },
        { id: 'health', title: 'Cykelkollen', desc: 'Följ cykel och hormonkurvor', icon: <Activity size={28} />, color: 'text-[#581625]', bg: 'bg-[#F2C4C4]' },
        { id: 'child_dev', title: 'Barnens utveckling', desc: 'Smarta tips baserat på ålder', icon: <Baby size={28} />, color: 'text-[#2B5B84]', bg: 'bg-[#A7CEF6]/20' },
        { id: 'settings_family', title: 'Familj & Inställningar', desc: 'Profiler och väder', icon: <User size={28} />, color: 'text-[#1D2538]', bg: 'bg-[#1D2538]/10' },
      ];
      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-4 max-w-xl mx-auto">
          <h2 className="text-2xl font-black text-[#1D2538] mb-4">Utforska</h2>
          {items.map(item => (
            <button key={item.id} onClick={() => setActiveTab(item.id)} className="w-full bg-white p-5 rounded-3xl shadow-sm border flex items-center gap-5 text-left hover:scale-[1.01] transition-transform">
              <div className={`${item.bg} ${item.color} p-4 rounded-2xl`}>{item.icon}</div>
              <div>
                <h3 className="font-black text-[#1D2538] text-lg">{item.title}</h3>
                <p className="text-sm font-bold text-[#1D2538]/50">{item.desc}</p>
              </div>
            </button>
          ))}
        </div>

    // --- HUVUDKOMPONENT ---
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [editItemId, setEditItemId] = useState(null);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); setAuthLoading(false); });
        return () => unsubscribe();
      }, []);

      const [data, updateData, loadingData] = useAppSync(user);

      if (authLoading || (user && loadingData)) return <div className="flex flex-col h-screen items-center justify-center bg-[#F7F4EE]"><Loader2 size={40} className="animate-spin text-[#581625] mb-4" /><p className="font-bold text-[#1D2538]/50">Laddar familjehubben...</p></div>;
      if (!user) return <LoginScreen />;
      
      const myProfile = data.members.find(m => m.email === user.email);
      const localProfileId = myProfile ? myProfile.id : null;

      if (!localProfileId && data.members.length > 0) {
          return <ProfileSelection members={data.members} currentUserEmail={user.email} updateData={updateData} />
      }

      const handleEditItemRequest = (tab, id) => {
          setActiveTab(tab);
          setEditItemId(id);
      };

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard': return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} settings={data.settings} meals={data.meals} localProfileId={localProfileId} onEditItem={handleEditItemRequest} />;
          case 'shopping': return <ShoppingList items={data.shoppingItems} groceries={data.groceries} members={data.members} settings={data.settings} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;
          case 'calendar': return <Calendar events={data.events} members={data.members} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;
          case 'todo': return <TodoList todos={data.todos} members={data.members} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;
          case 'menu': return <Menu setActiveTab={setActiveTab} />;
          case 'meals': return <MealPlanner meals={data.meals} recipes={data.recipes} dismissedRecipes={data.dismissedRecipes} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'settings_family': return <SettingsFamily members={data.members} settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} localProfileId={localProfileId} />;
          case 'health': return <HealthTracker logs={data.healthLogs} members={data.members} updateData={updateData} setActiveTab={setActiveTab} localProfileId={localProfileId} settings={data.settings} />;
          case 'child_dev': return <ChildDevelopment members={data.members} setActiveTab={setActiveTab} />;
          default: return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} settings={data.settings} meals={data.meals} localProfileId={localProfileId} onEditItem={handleEditItemRequest} />;
        }
      };

      const getHeaderTitle = () => ({ dashboard:'Familjehubb', shopping:'Inköp', calendar:'Kalender', todo:'Att göra', menu:'Mer', meals:'Mat & Recept', settings_family:'Inställningar', health:'Cykelkollen', child_dev:'Utveckling' })[activeTab] || 'Familjehubb';

      return (
        <div className="flex flex-col h-screen w-full bg-[#F7F4EE] relative overflow-hidden font-sans">
          <header className="bg-gradient-to-r from-[#581625] to-[#731E32] px-6 py-5 shadow-md z-10 flex justify-center items-end h-20 rounded-b-3xl shrink-0"><h1 className="text-xl font-black text-[#F7F4EE] tracking-widest uppercase opacity-90">{getHeaderTitle()}</h1></header>
          <main className="flex-1 overflow-hidden relative">{renderContent()}</main>
          <div className="absolute bottom-6 left-2 right-2 z-20 pointer-events-none">
            <nav className="pointer-events-auto bg-white/90 backdrop-blur-xl border border-white/40 shadow-xl rounded-3xl mx-auto max-w-md overflow-hidden">
              <div className="flex justify-between items-center px-2 py-2">
                <NavItem icon={<Home />} label="Start" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                <NavItem icon={<Utensils />} label="Mat" isActive={activeTab === 'meals'} onClick={() => setActiveTab('meals')} />
                <NavItem icon={<ShoppingCart />} label="Inköp" isActive={activeTab === 'shopping'} onClick={() => setActiveTab('shopping')} />
                <NavItem icon={<CalendarIcon />} label="Kalender" isActive={activeTab === 'calendar'} onClick={() => setActiveTab('calendar')} />
                <NavItem icon={<Grid />} label="Mer" isActive={['menu', 'settings_family', 'health', 'child_dev', 'todo'].includes(activeTab)} onClick={() => setActiveTab('menu')} />
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
