    const getTagColor = (name) => {

      if (!name) return 'bg-[#1D2538] text-white';

      const colors = ['bg-[#E55835] text-white', 'bg-[#A7CEF6] text-[#1D2538]', 'bg-[#F2C4C4] text-[#581625]', 'bg-[#581625] text-white'];

      let hash = 0; 

      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);

      return colors[Math.abs(hash) % colors.length];

    };

    

    const getLocalToday = () => { 

      const d = new Date(); 

      return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0]; 

    };

    

    const getLocalDayName = (dateString) => { 

      if (!dateString) return ''; 

      const d = new Date(dateString + 'T12:00:00'); 

      return ['Sön','Mån','Tis','Ons','Tors','Fre','Lör'][d.getDay()]; 

    };



    // Hjälpfunktion för att räkna ut aktuell fas och cykeldag

    const calculateCycleInfo = (logs = []) => {

      const today = getLocalToday();

      const sortedBleeding = [...logs]

        .filter(l => l.bleeding && l.bleeding !== 'Nej')

        .sort((a, b) => new Date(b.date) - new Date(a.date));

      

      if (sortedBleeding.length === 0) return null;



      // Hitta startdagen på den senaste sammanhängande blödningsperioden

      let periodStart = sortedBleeding[0].date;

      for (let i = 0; i < sortedBleeding.length - 1; i++) {

        const curr = new Date(sortedBleeding[i].date);

        const prev = new Date(sortedBleeding[i + 1].date);

        const diffDays = Math.round((curr - prev) / (1000 * 60 * 60 * 24));

        if (diffDays <= 2) {

          periodStart = sortedBleeding[i + 1].date;

        } else {

          break;

        }

      }



      const diffTime = new Date(today) - new Date(periodStart);

      const rawDay = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

      if (rawDay < 1 || rawDay > 45) return null;



      const cycleDay = ((rawDay - 1) % 28) + 1;

      const daysUntilNext = Math.max(1, 29 - cycleDay);



      let phase = {};

      if (cycleDay <= 5) {

        phase = {

          name: 'Mens',

          fullTitle: 'Menstruationsfas',

          color: '#E55835',

          wellbeing: 'Hormonnivåerna är låga. Behovet av vila, värme och återhämtning är extra stort.',

          physical: 'Låg energi och eventuell mensvärk. Lugna promenader eller vila passar bäst.',

          nutrition: 'Fokusera på järnrik och varm mat, mörk choklad och mycket vätska.',

          partnerTip: 'Ta extra ansvar för markservicen (middag, disk och läggning). Ge utrymme för egentid och vila utan krav.'

        };

      } else if (cycleDay <= 11) {

        phase = {

          name: 'Follikulär',

          fullTitle: 'Follikulär fas (Stigande energi)',

          color: '#F07B5D',

          wellbeing: 'Östrogenet stiger! Humöret, kreativiteten och motivationen ökar dag för dag.',

          physical: 'Kroppen svarar toppen på rörelse och träning. Energin är på väg uppåt.',

          nutrition: 'Fräsch, lättlagad mat med mycket grönt och protein passar kroppen perfekt nu.',

          partnerTip: 'Toppenläge att planera roliga familjeutflykter, projekt hemma eller boka in en dejt!'

        };

      } else if (cycleDay <= 16) {

        phase = {

          name: 'Sen follikulär / Ägglossning',

          fullTitle: 'Ägglossningsfas (Toppenergi)',

          color: '#9333EA',

          wellbeing: 'Östrogen och FSH når sin topp. Utåtriktad, social och positiv känsla!',

          physical: 'Maximal energi och styrka under cykeln, men ibland lätt svullnad kring dag 14.',

          nutrition: 'Fibrer, bär och extra vatten hjälper kroppen att balansera hormontoppen.',

          partnerTip: 'Energin och humöret är på topp – passa på att hitta på något socialt eller mysigt tillsammans!'

        };

      } else {

        phase = {

          name: 'Luteal',

          fullTitle: 'Lutealfas (Lugnare tempo / PMS)',

          color: '#3B82F6',

          wellbeing: 'Progesteronet dominerar först (lugnande), men när det sjunker mot slutet kan PMS, trötthet och känslighet uppstå.',

          physical: 'Energin dalar successivt. Kroppen behöver mer sömn och ett lägre tempo.',

          nutrition: 'Komplexa kolhydrater och magnesium hjälper mot sötsug och humörsvängningar.',

          partnerTip: 'Sänk kraven hemma, ha extra tålamod, ta kommandot över vardagslogistiken och bjud på lugna hemmakvällar.'

        };

      }



      return { cycleDay, daysUntilNext, periodStart, ...phase };

    };



    function ProfileSelection({ members, currentUserEmail, updateData }) {

    function useAppSync(user) {

      const initialData = {

        members: [

          { id: generateId(), name: 'Mamma', role: 'Mamma', sizes: { 'Skor': '38', 'Tröja': 'M' } },

          { id: generateId(), name: 'Pappa', role: 'Pappa', sizes: { 'Skor': '43', 'Skjorta': 'L' } },

          { id: generateId(), name: 'Barn', role: 'Barn', sizes: { 'Skor': '34', 'Ytterplagg': '134' }, birthDate: '2015-05-10' }

        ],

        shoppingItems: [], groceries: [], todos: [], events: [], healthLogs: [],

        recipes: [], dismissedRecipes: [],

        meals: {

          current: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} },

          next: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} }

        },

        settings: { 

          weather: { zipcode: '231 42', city: 'Trelleborg' }, 

          roleCategories: { 'Barn': ['Skor', 'Ytterplagg', 'Kläder'], 'Mamma': ['Skor', 'Tröja', 'Byxor'], 'Pappa': ['Skor', 'Skjorta'], 'Annan': ['Skor'] },

          cycleTrackerMemberId: ''

        }

      };



      const [data, setData] = useState(initialData);

      const [loadingData, setLoadingData] = useState(true);



      useEffect(() => {

        if (!user || !db) return;

        const sharedRef = doc(db, 'family', 'sharedData');

        const legacyRef = doc(db, 'users', user.uid);



        const unsubscribe = onSnapshot(sharedRef, async (docSnap) => {

          if (docSnap.exists()) {

            const fetched = docSnap.data();

            setData({

              ...initialData,

              ...fetched,

              groceries: fetched.groceries || [],

              recipes: fetched.recipes || [],

              dismissedRecipes: fetched.dismissedRecipes || [],

              meals: fetched.meals || initialData.meals,

              settings: { ...initialData.settings, ...(fetched.settings || {}) }

            });

            setLoadingData(false);

          } else {

            // Kolla om det finns data sparad under gamla sökvägen (users/uid) och rädda den automatiskt!

            try {

              const legacySnap = await getDoc(legacyRef);

              if (legacySnap.exists()) {

                const legacyData = legacySnap.data();

                await setDoc(sharedRef, legacyData);

                setData({ ...initialData, ...legacyData });

              } else {

                await setDoc(sharedRef, initialData);

                setData(initialData);

              }

            } catch (e) {

              console.error("Initieringsfel:", e);

            }

            setLoadingData(false);

          }

        }, (err) => {

          console.error("Fel vid hämtning av data:", err);

          setLoadingData(false);

        });

        return () => unsubscribe();

      }, [user]);



      const updateData = (key, newData) => {

        setData(prev => {

          const updatedVal = typeof newData === 'function' ? newData(prev[key]) : newData;

          if (user && db) {

            setDoc(doc(db, 'family', 'sharedData'), { [key]: updatedVal }, { merge: true });

          }

          return { ...prev, [key]: updatedVal };

        });

      };



      return [data, updateData, loadingData];

    }



    function LoginScreen() {

      const [email, setEmail] = useState(''); 

      const [password, setPassword] = useState(''); 

      const [isRegistering, setIsRegistering] = useState(false); 

      const [error, setError] = useState(''); 

      const [loading, setLoading] = useState(false);

      

      const handleSubmit = async (e) => {

        e.preventDefault(); 

        setError(''); 

        setLoading(true);

        try { 

          if (isRegistering) { 

            await createUserWithEmailAndPassword(auth, email.trim(), password); 

          } else { 

            await signInWithEmailAndPassword(auth, email.trim(), password); 

          } 

        } catch (err) { 

          if (err.code === 'auth/email-already-in-use') setError('E-postadressen används redan. Logga in istället!');

          else if (err.code === 'auth/weak-password') setError('Lösenordet måste vara minst 6 tecken.');

          else if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') setError('Fel e-post eller lösenord.');

          else setError('Något gick snett (' + err.code + ').');

        }

        setLoading(false);

      };



      return (

        <div className="flex flex-col items-center justify-center min-h-[100dvh] bg-[#F7F4EE] p-6">

          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] p-6 rounded-[2rem] w-full max-w-sm text-white shadow-2xl mb-8 relative overflow-hidden">

            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>

            <Home size={40} className="mb-4 relative z-10" />

            <h1 className="text-4xl font-black relative z-10 tracking-tight">Familjehubb</h1>

            <p className="font-bold text-white/80 mt-2 relative z-10">Logga in med ditt personliga konto för att synka familjens vardag.</p>

          </div>

          <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white p-6 rounded-[2rem] shadow-sm border border-[#1D2538]/5">

            <h2 className="text-xl font-black text-[#1D2538] mb-5">{isRegistering ? 'Skapa personligt konto' : 'Logga in'}</h2>

            {error && <div className="bg-[#F2C4C4] text-[#581625] p-3 rounded-xl text-sm font-bold mb-4">{error}</div>}

            

            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Din E-post</label>

            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" />

            

            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Lösenord (Minst 6 tecken)</label>

            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-6" />

            

            <button type="submit" disabled={loading} className="w-full bg-[#1D2538] text-white py-3.5 rounded-2xl font-black shadow-md flex justify-center items-center gap-2">

              {loading && <Loader2 size={16} className="animate-spin" />} 

              {isRegistering ? 'Skapa konto' : 'Logga in'}

            </button>

            <button type="button" onClick={() => {setIsRegistering(!isRegistering); setError('');}} className="w-full text-center mt-4 text-sm font-bold text-[#1D2538]/60 hover:text-[#1D2538]">

              {isRegistering ? 'Har du redan ett konto? Logga in' : 'Inget konto? Skapa ett här'}

            </button>

          </form>

        </div>

      );

    }

    // --- DASHBOARD (STARTSIDA) ---

    function Dashboard({ events = [], todos = [], shoppingItems = [], healthLogs = [], settings = {}, setActiveTab, members = [], meals = {}, localProfileId, onEditItem }) {

      const today = getLocalToday();

      const weatherConfig = settings.weather || {};

      const upcomingEvents = events.filter(e => e.fromDate >= today).sort((a, b) => { 

        if (a.fromDate !== b.fromDate) return a.fromDate.localeCompare(b.fromDate); 

        return (a.fromTime || '00:00').localeCompare(b.fromTime || '00:00'); 

      });

      const activeTodos = todos.filter(t => !t.completed); 

      const activeShopping = shoppingItems.filter(i => !i.completed);

      

      const dayIndex = new Date().getDay(); 

      const daysArr = ['Sön', 'Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör']; 

      const todaysMeal = meals?.current?.[daysArr[dayIndex]];



      const [realWeather, setRealWeather] = useState(null);

      const [tomorrowWeather, setTomorrowWeather] = useState(null);

      const [weatherTip, setWeatherTip] = useState('Hämtar dagens klädtips...');



      useEffect(() => {

        const fetchWeather = async () => {

          try {

            const city = weatherConfig?.city || 'Trelleborg';

            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=sv`);

            const geoData = await geoRes.json();

            if (!geoData.results?.length) return;

            const { latitude, longitude } = geoData.results[0];



            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=2`);

            const weatherData = await weatherRes.json();



            const getWeatherIcon = (code, size = 20) => {

              if (code === 0) return <Sun size={size} />;

              if (code > 0 && code <= 3) return <Cloud size={size} />;

              if (code === 45 || code === 48) return <CloudFog size={size} />;

              if (code >= 51 && code <= 67) return <CloudRain size={size} />;

              if (code >= 71 && code <= 77) return <CloudSnow size={size} />;

              if (code >= 95) return <CloudLightning size={size} />;

              return <Cloud size={size} />;

            };



            const times = [9, 12, 15, 19];

            const labels = ['Fm', 'Lunch', 'Em', 'Kväll'];

            

            const todayMapped = times.map((hour, idx) => {

              const temp = Math.round(weatherData.hourly.temperature_2m[hour]);

              const code = weatherData.hourly.weather_code[hour];

              return { time: labels[idx], temp: `${temp}°`, rawTemp: temp, code, icon: getWeatherIcon(code, 22) };

            });

            setRealWeather(todayMapped);



            const tomorrowMapped = times.map((hour, idx) => {

              const h = hour + 24;

              const temp = Math.round(weatherData.hourly.temperature_2m[h]);

              const code = weatherData.hourly.weather_code[h];

              return { time: labels[idx], temp: `${temp}°`, rawTemp: temp, code, icon: getWeatherIcon(code, 16) };

            });

            setTomorrowWeather(tomorrowMapped);



            const hasRain = todayMapped.some(w => w.code >= 51 && w.code <= 67);

            const hasSnow = todayMapped.some(w => w.code >= 71 && w.code <= 77);

            const minTemp = Math.min(...todayMapped.map(w => w.rawTemp));

            const maxTemp = Math.max(...todayMapped.map(w => w.rawTemp));



            if (hasRain) setWeatherTip("Regn i prognosen idag! ☔ Packa ner regnkläder och gummistövlar till barnen.");

            else if (hasSnow) setWeatherTip("Snö och kallt! ❄️ Vinteroverall, varma kängor, mössa och vantar behövs.");

            else if (minTemp <= 4) setWeatherTip("Kylig morgon! 🧣 Lager-på-lager, mössa och vantar är smart till förskola/skola.");

            else if (maxTemp >= 20) setWeatherTip("Varmt och skönt! ☀️ Solkräm, keps och vattenflaska är bra att ha med.");

            else setWeatherTip("Bra väder för utelek! ⛅ En vanlig skalklädsel eller vindjacka passar utmärkt idag.");

          } catch (e) {

            console.error("Väderfel:", e);

          }

        };

        fetchWeather();

      }, [weatherConfig?.city]);



      const weatherDisplay = realWeather || [

        { time: 'Fm', temp: '--', icon: <Cloud size={22}/> }, 

        { time: 'Lunch', temp: '--', icon: <Cloud size={22}/> }, 

        { time: 'Em', temp: '--', icon: <Cloud size={22}/> }, 

        { time: 'Kväll', temp: '--', icon: <Cloud size={22}/> }

      ];



      const localUser = members.find(m => m.id === localProfileId);

      const trackedMember = members.find(m => m.id === settings.cycleTrackerMemberId);

      const isTrackedUser = trackedMember && localProfileId === trackedMember.id;

      const cycleInfo = calculateCycleInfo(healthLogs);

      const todayLog = healthLogs.find(log => log.date === today);



      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto space-y-6 max-w-2xl mx-auto">

          {localUser && (

            <div className="flex justify-between items-center mt-1">

              <h2 className="text-2xl font-black text-[#1D2538]">Hej {localUser.name}! 👋</h2>

              <span className={`text-xs font-black px-3 py-1 rounded-xl ${getTagColor(localUser.name)}`}>{localUser.role}</span>

            </div>

          )}



          {/* VÄDER MED BARNPERSPEKTIV & MORGONDAGEN */}

          <div className="bg-gradient-to-br from-[#89B4E5] to-[#4B88C4] rounded-[2rem] p-5 text-white shadow-xl relative overflow-hidden">

            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>

            <div className="flex justify-between items-center mb-4 relative z-10">

              <div>

                <h3 className="text-3xl font-black tracking-tight">{weatherConfig?.city || 'Trelleborg'}</h3>

                <p className="text-white/90 font-bold text-xs opacity-80">Dagens väder & klädkoll</p>

              </div>

              <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-md shadow-inner"><Wind size={26} /></div>

            </div>

            

            <div className="flex justify-between bg-white/20 rounded-2xl p-3.5 backdrop-blur-md relative z-10 shadow-sm mb-3">

              {weatherDisplay.map((w, i) => (

                <div key={i} className="flex flex-col items-center gap-1.5">

                  <span className="text-[10px] font-black uppercase tracking-wider text-white/80">{w.time}</span>

                  {w.icon}

                  <span className="font-black text-base">{w.temp}</span>

                </div>

              ))}

            </div>



            <div className="bg-white/20 rounded-2xl p-3 backdrop-blur-md relative z-10 text-xs font-bold leading-relaxed mb-2.5">

              {weatherTip}

            </div>



            {tomorrowWeather && (

              <div className="bg-[#1D2538]/20 rounded-2xl px-3.5 py-2.5 backdrop-blur-md relative z-10 flex items-center justify-between text-xs font-bold">

                <span className="uppercase tracking-wider text-[10px] font-black text-white/90">Imorgon (Planering):</span>

                <div className="flex items-center gap-3">

                  {tomorrowWeather.map((tw, idx) => (

                    <span key={idx} className="flex items-center gap-1 text-[11px]">

                      <span className="opacity-75">{tw.time}:</span> {tw.temp}

                    </span>

                  ))}

                </div>

              </div>

            )}

          </div>



          {/* CYKELKOLLEN PÅ STARTSIDAN (ANPASSAD EFTER VEM SOM ÄR INLOGGAD) */}

          {trackedMember && (

            <div onClick={() => setActiveTab('health')} className="bg-gradient-to-r from-[#F2C4C4]/60 to-[#f4d5d5]/60 rounded-3xl p-5 shadow-sm border border-[#581625]/15 cursor-pointer transition-transform active:scale-98">

              <div className="flex items-start gap-4">

                <div className="bg-white text-[#581625] p-3.5 rounded-2xl shadow-sm shrink-0">

                  <HeartPulse size={24} />

                </div>

                <div className="flex-1">

                  <div className="flex justify-between items-center">

                    <h4 className="font-black text-[#581625] text-base">

                      {isTrackedUser ? 'Min Cykelkoll' : `Cykelkoll (${trackedMember.name})`}

                    </h4>

                    {cycleInfo && (

                      <span className="bg-[#581625] text-white text-[10px] font-black px-2.5 py-1 rounded-full">

                        Dag {cycleInfo.cycleDay} • {cycleInfo.name}

                      </span>

                    )}

                  </div>

                  {cycleInfo ? (

                    <p className="text-xs font-bold text-[#1D2538]/80 mt-1.5 leading-relaxed">

                      {isTrackedUser ? cycleInfo.wellbeing : `💡 Tips till dig: ${cycleInfo.partnerTip}`}

                    </p>

                  ) : (

                    <p className="text-xs font-bold text-[#1D2538]/60 mt-1">

                      {isTrackedUser ? 'Klicka här för att logga blödning & mående.' : 'Ingen cykeldata loggad ännu.'}

                    </p>

                  )}

                  {isTrackedUser && (

                    <p className="text-[11px] font-black text-[#581625] mt-2">

                      {todayLog ? `✓ Idag loggat: ${todayLog.mood}` : '+ Klicka för att logga hur du mår idag'}

                    </p>

                  )}

                </div>

              </div>

            </div>

          )}



          {/* DAGENS MIDDAG */}

          {todaysMeal?.title && (

            <div onClick={() => setActiveTab('meals')} className="bg-gradient-to-r from-[#E55835] to-[#f07b5d] rounded-3xl p-5 text-white shadow-sm cursor-pointer flex justify-between items-center transition-transform active:scale-95">

              <div>

                <h4 className="font-bold text-white/80 text-xs uppercase tracking-widest mb-1">Dagens Middag</h4>

                <p className="font-black text-xl">{todaysMeal.title}</p>

              </div>

              <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-md shadow-inner"><Utensils size={24} /></div>

            </div>

          )}



          {/* PÅ SCHEMAT (KALENDER) */}

          <div>

            <div className="flex justify-between items-end mb-3">

              <h2 className="text-xl font-black text-[#1D2538]">På schemat</h2>

              <button onClick={() => setActiveTab('calendar')} className="text-xs font-black text-[#E55835] bg-[#E55835]/10 px-3 py-1.5 rounded-xl">Öppna kalender</button>

            </div>

            <div className="space-y-3">

              {upcomingEvents.length === 0 ? (

                <div className="bg-white rounded-3xl p-5 text-center border"><p className="text-[#1D2538]/50 font-bold text-sm">Inga kommande händelser inlagda.</p></div>

              ) : (

                upcomingEvents.slice(0, 4).map(event => {

                  const isToday = event.fromDate === today; 

                  const appliesTo = members.find(m => m.id === event.appliesToId); 

                  const responsible = members.find(m => m.id === event.responsibleId);

                  const amIResponsible = localProfileId && event.responsibleId === localProfileId;



                  return (

                    <div key={event.id} onClick={() => onEditItem('calendar', event.id)} className={`bg-white rounded-3xl p-4 shadow-sm border-l-4 cursor-pointer transition-transform active:scale-98 ${isToday ? 'border-l-[#E55835]' : 'border-l-[#1D2538]/30'} ${amIResponsible ? 'border-r-4 border-r-[#581625] bg-[#581625]/5' : ''} border-y border-r flex gap-4 items-center`}>

                      <div className={`flex flex-col items-center justify-center rounded-2xl px-2.5 py-2 min-w-[76px] ${isToday ? 'bg-[#E55835]/10 text-[#E55835]' : 'bg-[#F7F4EE] text-[#1D2538]/60'}`}>

                        <span className="text-xs font-black">{isToday ? 'IDAG' : event.fromDate}</span>

                        <span className="text-[10px] font-bold mt-0.5">{event.fromTime || 'Heldag'}</span>

                      </div>

                      <div className="flex-1 py-0.5">

                        <h4 className="font-black text-[#1D2538] text-base leading-tight mb-1.5">{event.title}</h4>

                        <div className="flex flex-wrap gap-1.5">

                          {appliesTo && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${getTagColor(appliesTo.name)}`}>För: {appliesTo.name}</span>}

                          {responsible && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${amIResponsible ? 'bg-[#581625] text-white' : 'bg-[#F7F4EE]'}`}>Ansvar: {amIResponsible ? 'Du' : responsible.name}</span>}

                        </div>

                      </div>

                    </div>

                  );

                })

              )}

            </div>

          </div>



          {/* INKÖP (ÖVRIGT) - FULLBREDD SOM KALENDERN */}

          <div>

            <div className="flex justify-between items-end mb-3">

              <div className="flex items-center gap-2">

                <h2 className="text-xl font-black text-[#1D2538]">Inköp (Övrigt)</h2>

                <span className="bg-[#E55835] text-white text-xs font-black px-2.5 py-0.5 rounded-full">{activeShopping.length}</span>

              </div>

              <button onClick={() => setActiveTab('shopping')} className="text-xs font-black text-[#E55835] bg-[#E55835]/10 px-3 py-1.5 rounded-xl">Se alla</button>

            </div>

            <div className="space-y-3">

              {activeShopping.length === 0 ? (

                <div className="bg-white rounded-3xl p-5 text-center border"><p className="text-[#1D2538]/50 font-bold text-sm">Inga övriga inköp på listan.</p></div>

              ) : (

                activeShopping.slice(0, 4).map(item => {

                  const forMember = members.find(m => m.id === item.memberId);

                  const buyerMember = members.find(m => m.id === item.buyerId);

                  return (

                    <div key={item.id} onClick={() => onEditItem('shopping', item.id)} className="bg-white rounded-3xl p-4 shadow-sm border flex gap-4 items-center cursor-pointer hover:border-[#E55835]/40 transition-all">

                      <div className="bg-[#E55835]/10 text-[#E55835] p-3 rounded-2xl shrink-0">

                        <ShoppingCart size={20} />

                      </div>

                      <div className="flex-1 min-w-0">

                        <h4 className="font-black text-[#1D2538] text-base leading-tight">

                          {item.title} {forMember ? <span className="text-[#E55835]">- {forMember.name}</span> : ''}

                        </h4>

                        {item.details && <p className="text-xs font-bold text-[#1D2538]/60 mt-1">{item.details}</p>}

                        <div className="flex flex-wrap gap-1.5 mt-1.5">

                          {item.category && <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-[#F7F4EE] text-[#1D2538]">{item.category}</span>}

                          {buyerMember && <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-[#1D2538]/10 text-[#1D2538]">Köps av: {buyerMember.name}</span>}

                        </div>

                      </div>

                    </div>

                  );

                })

              )}

            </div>

          </div>



          {/* ATT GÖRA - FULLBREDD SOM KALENDERN */}

          <div>

            <div className="flex justify-between items-end mb-3">

              <div className="flex items-center gap-2">

                <h2 className="text-xl font-black text-[#1D2538]">Att göra</h2>

                <span className="bg-[#1D2538] text-white text-xs font-black px-2.5 py-0.5 rounded-full">{activeTodos.length}</span>

              </div>

              <button onClick={() => setActiveTab('todo')} className="text-xs font-black text-[#1D2538] bg-[#1D2538]/10 px-3 py-1.5 rounded-xl">Se alla</button>

            </div>

            <div className="space-y-3">

              {activeTodos.length === 0 ? (

                <div className="bg-white rounded-3xl p-5 text-center border"><p className="text-[#1D2538]/50 font-bold text-sm">Inga aktiva uppgifter.</p></div>

              ) : (

                activeTodos.slice(0, 4).map(todo => {

                  const assignedMember = members.find(m => m.id === todo.memberId);

                  const isMyTodo = localProfileId && todo.memberId === localProfileId;

                  return (

                    <div key={todo.id} onClick={() => onEditItem('todo', todo.id)} className={`bg-white rounded-3xl p-4 shadow-sm border flex gap-4 items-center cursor-pointer transition-all ${isMyTodo ? 'border-l-4 border-l-[#581625] bg-[#581625]/5' : ''}`}>

                      <div className="bg-[#1D2538]/10 text-[#1D2538] p-3 rounded-2xl shrink-0">

                        <CheckSquare size={20} />

                      </div>

                      <div className="flex-1 min-w-0">

                        <h4 className="font-black text-[#1D2538] text-base leading-tight">

                          {todo.title} {assignedMember ? <span className="text-[#581625]">- {assignedMember.name}</span> : ''}

                        </h4>

                        {todo.notes && <p className="text-xs font-bold text-[#1D2538]/60 mt-1">{todo.notes}</p>}

                        <div className="flex flex-wrap gap-1.5 mt-1.5">

                          {isMyTodo && <span className="text-[10px] font-black px-2 py-0.5 rounded-md bg-[#581625] text-white">Ditt ansvar</span>}

                          {todo.dueDate && <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-[#F7F4EE] text-[#1D2538]">Senast: {todo.dueDate}</span>}

                        </div>

                      </div>

                    </div>

                  );

                })

              )}

            </div>

          </div>



          <div className="flex justify-center pt-4 pb-8">

            <button onClick={() => signOut(auth)} className="flex items-center gap-2 text-sm font-bold text-[#1D2538]/50 hover:text-[#581625] px-5 py-2.5 bg-white rounded-2xl shadow-sm border">

              <LogOut size={16}/> Logga ut

            </button>

          </div>

        </div>

      );

    }



    // --- INKÖPSLISTA (MATVAROR + ÖVRIGT MED FRITEXT & ARKIV/ÅTERSKAPA) ---

    function ShoppingList({ items = [], groceries = [], members = [], settings = {}, updateData, editItemId, setEditItemId }) {

      const [activeTab, setActiveTab] = useState('food'); 

      const [copyStatus, setCopyStatus] = useState('');

      

      const [title, setTitle] = useState(''); 

      const [selectedMember, setSelectedMember] = useState(''); 

      const [category, setCategory] = useState(''); 

      const [details, setDetails] = useState(''); 

      const [link, setLink] = useState(''); 

      const [buyerId, setBuyerId] = useState(''); 

      const [isExpanded, setIsExpanded] = useState(false); 

      const [editingId, setEditingId] = useState(null);

      

      const activeItems = items.filter(i => !i.completed); 

      const completedItems = items.filter(i => i.completed);

      const activeGroceries = groceries.filter(i => !i.completed);

      const completedGroceries = groceries.filter(i => i.completed);



      const activeMember = members.find(m => m.id === selectedMember);

      const availableCategories = activeMember ? ((settings.roleCategories || {})[activeMember.role] || []) : [];



      useEffect(() => {

        if (editItemId) {

          const itemToEdit = items.find(i => i.id === editItemId);

          if (itemToEdit) {

            setActiveTab('general');

            editItem(itemToEdit);

            setEditItemId(null);

          }

        }

      }, [editItemId]);



      const handleCategoryChange = (e) => {

        const selectedCat = e.target.value;

        setCategory(selectedCat);

        if (activeMember && activeMember.sizes && activeMember.sizes[selectedCat]) {

          setDetails(prev => prev ? `${prev} (Strl: ${activeMember.sizes[selectedCat]})` : `Storlek: ${activeMember.sizes[selectedCat]}`);

        }

      };



      const handleSave = (e) => { 

        e.preventDefault(); 

        if (!title.trim()) return; 

        if (editingId) { 

          updateData('shoppingItems', items.map(item => item.id === editingId ? { ...item, title, memberId: selectedMember, buyerId, category, details, link } : item)); 

          setEditingId(null); 

        } else { 

          updateData('shoppingItems', [...items, { id: generateId(), title, memberId: selectedMember, buyerId, category, details, link, completed: false }]); 

        } 

        resetForm(); 

      };

      

      const editItem = (item) => { 

        setTitle(item.title); setSelectedMember(item.memberId || ''); setBuyerId(item.buyerId || ''); setCategory(item.category || ''); setDetails(item.details || ''); setLink(item.link || ''); setEditingId(item.id); setIsExpanded(true); 

      };

      

      const toggleComplete = (id) => updateData('shoppingItems', items.map(i => i.id === id ? { ...i, completed: !i.completed } : i));

      const deleteItem = (id) => updateData('shoppingItems', items.filter(i => i.id !== id));

      const resetForm = () => { setTitle(''); setSelectedMember(''); setBuyerId(''); setCategory(''); setDetails(''); setLink(''); setIsExpanded(false); setEditingId(null); };



      const [groceryItem, setGroceryItem] = useState(''); 

      const [groceryAmount, setGroceryAmount] = useState(''); 

      const [groceryEditingId, setGroceryEditingId] = useState(null);

      

      const handleGrocerySave = (e) => { 

        e.preventDefault(); 

        if (!groceryItem.trim()) return; 

        if (groceryEditingId) { 

          updateData('groceries', groceries.map(item => item.id === groceryEditingId ? { ...item, title: groceryItem, amount: groceryAmount } : item)); 

          setGroceryEditingId(null); 

        } else { 

          updateData('groceries', [...groceries, { id: generateId(), title: groceryItem, amount: groceryAmount, completed: false }]); 

        } 

        setGroceryItem(''); setGroceryAmount(''); 

      };

      

      const editGrocery = (item) => { 

        setGroceryItem(item.title); setGroceryAmount(item.amount || ''); setGroceryEditingId(item.id); 

      };

      

      const toggleGroceryComplete = (id) => updateData('groceries', groceries.map(i => i.id === id ? { ...i, completed: !i.completed } : i));

      const deleteGrocery = (id) => updateData('groceries', groceries.filter(i => i.id !== id));



      return (

        <div className="p-4 sm:p-6 pb-32 h-full overflow-y-auto max-w-2xl mx-auto">

          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 border shadow-inner">

            <button onClick={() => {setActiveTab('food'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'food' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>🍎 Matvaror ({activeGroceries.length})</button>

            <button onClick={() => {setActiveTab('general'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'general' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>🛍️ Övrigt ({activeItems.length})</button>

          </div>

          

          {activeTab === 'general' ? (

            <>

              <form onSubmit={handleSave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6">

                <div className="flex gap-2">

                  <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad ska inhandlas? (t.ex. Stövlar)" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none" />

                  <button type="submit" disabled={!title.trim()} className="bg-[#581625] text-white px-5 rounded-2xl font-bold disabled:opacity-50">{editingId ? 'Spara' : 'Lägg till'}</button>

                </div>

                <textarea value={details} onChange={e => setDetails(e.target.value)} placeholder="Fritext / Mer information / Storlek / Detaljer..." rows={2} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none mt-3 resize-none" />

                {isExpanded ? (

                  <div className="mt-3 space-y-3 pt-3 border-t">

                    <div className="flex gap-3">

                      <select value={selectedMember} onChange={e => { setSelectedMember(e.target.value); setCategory(''); }} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none">

                        <option value="">För vem?</option>

                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}

                      </select>

                      <select value={buyerId} onChange={e => setBuyerId(e.target.value)} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none">

                        <option value="">Vem köper?</option>

                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}

                      </select>

                    </div>

                    <div className="flex gap-3">

                      <select value={category} onChange={handleCategoryChange} disabled={!selectedMember} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none disabled:opacity-50">

                        <option value="">Klädkategori (hämtar storlek)...</option>

                        {availableCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}

                      </select>

                      <input value={link} onChange={e => setLink(e.target.value)} placeholder="Länk (frivillig)" className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none" />

                    </div>

                    <div className="flex justify-end">

                      <button type="button" onClick={resetForm} className="text-xs font-bold text-[#1D2538]/50 hover:text-[#1D2538]">Avbryt / Stäng</button>

                    </div>

                  </div>

                ) : (

                  <button type="button" onClick={() => setIsExpanded(true)} className="mt-2 text-xs font-bold text-[#E55835] flex items-center gap-1 ml-1">

                    <Plus size={14} /> Välj person, klädstorlek eller länk

                  </button>

                )}

              </form>



              <div className="space-y-3">

                {activeItems.map(item => (

                  <div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4">

                    <button onClick={() => toggleComplete(item.id)} className="mt-1 flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#E55835]"></button>

                    <div className="flex-1">

                      <h4 className="font-black text-lg leading-tight">

                        {item.title} {item.memberId && <span className="text-[#E55835] text-sm">- {members.find(m => m.id === item.memberId)?.name}</span>}

                      </h4>

                      {item.details && <p className="text-xs font-bold text-[#1D2538]/70 mt-1 whitespace-pre-wrap">{item.details}</p>}

                      <div className="flex flex-wrap items-center gap-2 mt-2">

                        {item.memberId && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg ${getTagColor(members.find(m => m.id === item.memberId)?.name)}`}>För: {members.find(m => m.id === item.memberId)?.name}</span>}

                        {item.buyerId && <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#1D2538]/10 text-[#1D2538]">Köps av: {members.find(m => m.id === item.buyerId)?.name}</span>}

                        {item.category && <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#F7F4EE] text-[#1D2538]">{item.category}</span>}

                        {item.link && <a href={item.link} target="_blank" rel="noopener noreferrer" className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#E55835]/10 text-[#E55835] flex items-center gap-1"><ExternalLink size={10}/> Länk</a>}

                      </div>

                    </div>

                    <div className="flex flex-col gap-2">

                      <button onClick={() => editItem(item)} className="text-[#1D2538]/30 hover:text-[#1D2538]"><Edit3 size={18} /></button>

                      <button onClick={() => deleteItem(item.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>

                    </div>

                  </div>

                ))}

              </div>



              {completedItems.length > 0 && (

                <div className="mt-8">

                  <h3 className="text-xs font-black text-[#1D2538]/40 uppercase tracking-widest mb-3 ml-2">Arkiv - Avbockade inköp (Klicka för att återskapa)</h3>

                  <div className="space-y-2.5">

                    {completedItems.map(item => (

                      <div key={item.id} className="bg-white/60 p-3.5 rounded-3xl border flex gap-3 items-center">

                        <button onClick={() => toggleComplete(item.id)} className="px-3 py-1.5 rounded-xl bg-[#E55835]/10 text-[#E55835] text-xs font-black flex items-center gap-1 hover:bg-[#E55835] hover:text-white transition-colors">

                          <RotateCcw size={13} /> Återskapa

                        </button>

                        <div className="flex-1 min-w-0">

                          <span className="font-bold text-[#1D2538]/60 line-through block truncate">{item.title}</span>

                          {item.details && <span className="text-[11px] text-[#1D2538]/40 block truncate">{item.details}</span>}

                        </div>

                        <button onClick={() => deleteItem(item.id)} className="text-[#1D2538]/30 hover:text-[#581625] p-1"><Trash2 size={18} /></button>

                      </div>

                    ))}

                  </div>

                </div>

              )}

            </>

          ) : (

            <>

              <form onSubmit={handleGrocerySave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6">

                <div className="flex gap-2">

                  <input value={groceryItem} onChange={e => setGroceryItem(e.target.value)} placeholder="Matvara (t.ex. Mjölk)" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />

                  <input value={groceryAmount} onChange={e => setGroceryAmount(e.target.value)} placeholder="Mängd (2 st)" className="w-28 sm:w-36 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />

                  <button type="submit" disabled={!groceryItem.trim()} className="bg-[#E55835] text-white px-5 rounded-2xl font-bold disabled:opacity-50">{groceryEditingId ? 'Spara' : 'Lägg till'}</button>

                </div>

              </form>



              <div className="space-y-3">

                {activeGroceries.map(item => (

                  <div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center">

                    <button onClick={() => toggleGroceryComplete(item.id)} className="flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#E55835]"></button>

                    <div className="flex-1">

                      <span className="font-black text-[#1D2538]">{item.title}</span>

                      {item.amount && <span className="ml-2 text-xs font-bold bg-[#F7F4EE] px-2.5 py-1 rounded-lg text-[#1D2538]/70">{item.amount}</span>}

                    </div>

                    <button onClick={() => editGrocery(item)} className="text-[#1D2538]/30 p-1"><Edit3 size={18} /></button>

                    <button onClick={() => deleteGrocery(item.id)} className="text-[#1D2538]/30 hover:text-[#581625] p-1"><Trash2 size={18} /></button>

                  </div>

                ))}

              </div>



              {activeGroceries.length > 0 && (

                <button onClick={() => {

                  const text = activeGroceries.map(g => `- ${g.title}${g.amount ? ' (' + g.amount + ')' : ''}`).join('\n');

                  navigator.clipboard?.writeText("Inköpslista Mat:\n" + text);

                  setCopyStatus('✅ Kopierad!');

                  setTimeout(() => setCopyStatus(''), 2500);
