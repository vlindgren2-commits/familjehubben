    // --- INSTÄLLNINGAR STORLEKSMALLAR ---
    function SettingsSizes({ settings, updateData, setActiveTab }) {
      const [newCategory, setNewCategory] = useState('');
      const [activeRoleTab, setActiveRoleTab] = useState('Barn');
      const ROLES = ['Barn', 'Mamma', 'Pappa', 'Annan'];

      const addCategory = (e) => {
        e.preventDefault();
        if (!newCategory.trim()) return;
        const cats = settings.roleCategories[activeRoleTab] || [];
        if (cats.includes(newCategory.trim())) return;
        
        updateData('settings', { ...settings, roleCategories: { ...settings.roleCategories, [activeRoleTab]: [...cats, newCategory.trim()] }});
        setNewCategory('');
      };

      const removeCategory = (cat) => {
        const cats = settings.roleCategories[activeRoleTab] || [];
        updateData('settings', { ...settings, roleCategories: { ...settings.roleCategories, [activeRoleTab]: cats.filter(c => c !== cat) }});
      };

      const activeCats = settings.roleCategories[activeRoleTab] || [];

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
           <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
           <div className="bg-[#4B88C4] rounded-3xl p-6 text-white shadow-lg mb-6">
             <h2 className="text-2xl font-black mb-2 flex items-center gap-3"><Ruler size={24}/> Storleksmallar</h2>
             <p className="text-white/80 text-sm">Bestäm vilka fält som finns tillgängliga för olika roller.</p>
           </div>
           <div className="bg-white rounded-3xl shadow-sm p-5 border">
             <div className="flex bg-[#F7F4EE] rounded-xl p-1 mb-5">
               {ROLES.map(r => <button key={r} onClick={() => setActiveRoleTab(r)} className={`flex-1 py-1.5 text-xs font-bold rounded-lg ${activeRoleTab === r ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>{r}</button>)}
             </div>
             <div className="flex flex-wrap gap-2 mb-5">
               {activeCats.map(cat => (
                 <div key={cat} className="flex items-center gap-1 bg-[#1D2538]/5 px-3 py-1.5 rounded-xl text-xs font-bold text-[#1D2538]">
                   {cat} <button onClick={() => removeCategory(cat)} className="text-[#E55835] ml-1"><X size={14}/></button>
                 </div>
               ))}
             </div>
             <form onSubmit={addCategory} className="flex gap-2">
               <input value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder={`Ny kategori till ${activeRoleTab}...`} className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl text-sm font-bold outline-none" />
               <button type="submit" disabled={!newCategory.trim()} className="bg-[#1D2538] text-white px-5 rounded-2xl font-bold">Lägg till</button>
             </form>
           </div>
        </div>
      );
    }

    // --- CYKELKOLLEN (PROFFSIG HÄLSOLOGG) ---
    function HealthTracker({ logs, members, settings, updateData, setActiveTab }) {
      const today = getLocalToday();
      const [logDate, setLogDate] = useState(today);
      const [mood, setMood] = useState('Bra');
      const [bleeding, setBleeding] = useState('Nej');
      const [editingId, setEditingId] = useState(null);

      // Kollar om personen är satt, annars defaultar till ingen
      const trackedMember = members.find(m => m.id === settings.cycleTrackerMemberId);

      const handleSave = (e) => {
        e.preventDefault();
        if (editingId) {
            updateData('healthLogs', logs.map(l => l.id === editingId ? { ...l, date: logDate, mood, bleeding } : l));
            setEditingId(null);
        } else {
            const filteredLogs = logs.filter(l => l.date !== logDate);
            updateData('healthLogs', [{ id: generateId(), date: logDate, mood, bleeding }, ...filteredLogs]);
        }
        setLogDate(today); setMood('Bra'); setBleeding('Nej');
      };

      const editLog = (log) => {
          setLogDate(log.date); setMood(log.mood); setBleeding(log.bleeding); setEditingId(log.id);
      };
      
      const deleteLog = (id) => updateData('healthLogs', logs.filter(l => l.id !== id));

      // Maffig Cykel-kalkylator
      let cycleDay = null;
      let phaseInfo = null;

      if (trackedMember) {
          // Sortera loggar
          const sortedLogs = [...logs].sort((a,b) => new Date(b.date) - new Date(a.date));
          // Hitta senaste blödningen
          const lastPeriod = sortedLogs.find(l => l.bleeding !== 'Nej');
          if (lastPeriod) {
              const diffTime = Math.abs(new Date(today) - new Date(lastPeriod.date));
              cycleDay = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1; // Dag 1 är första blödningsdagen
              
              // Försäkra att vi inte snurrar iväg om det gått månader utan logg (nollställer efter 40 dgr)
              if(cycleDay > 40) cycleDay = null; 
              
              if (cycleDay) {
                  if (cycleDay <= 5) phaseInfo = { phase: "Menstruation", title: "Återhämtning", partnerTip: "Ta extra ansvar för mat och disk. Ge utrymme för vila och återhämtning." };
                  else if (cycleDay <= 13) phaseInfo = { phase: "Follikulär", title: "Stigande Energi", partnerTip: "Perfekt tid att planera in dejter eller större familjeaktiviteter!" };
                  else if (cycleDay <= 16) phaseInfo = { phase: "Ägglossning", title: "Toppenergi", partnerTip: "Energin är på topp. Utmärkt tid för roliga utflykter och sociala tillställningar." };
                  else phaseInfo = { phase: "Luteal (PMS)", title: "Sjunkande tempo", partnerTip: "Energin dalar och PMS kan förekomma. Ha extra tålamod, mys hemma och undvik onödiga konflikter." };
              }
          }
      }

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
          
          <div className="bg-gradient-to-br from-[#F2C4C4] to-[#f4d5d5] rounded-3xl p-6 text-[#581625] shadow-lg mb-6 relative overflow-hidden">
             <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
             <h2 className="text-2xl font-black mb-1 flex items-center gap-3 relative z-10"><HeartPulse size={24}/> Cykelkollen</h2>
             <p className="text-[#581625]/80 text-sm font-bold mt-2 relative z-10">Spåra cykel och mående {trackedMember ? `för ${trackedMember.name}` : '(Gå till Inställningar -> Familj för att välja vem som spåras)'}.</p>
          </div>

          {/* Partner & Fas Information */}
          {cycleDay && phaseInfo && (
              <div className="bg-white rounded-3xl shadow-sm border p-5 mb-6 text-center">
                  <p className="text-xs font-black uppercase text-[#1D2538]/40 mb-1">Beräknad Cykeldag</p>
                  <h3 className="text-4xl font-black text-[#581625] mb-2">{cycleDay}</h3>
                  <div className="bg-[#581625]/5 rounded-2xl p-4 text-left border border-[#581625]/10 mt-4">
                      <p className="font-black text-[#581625] text-sm uppercase tracking-widest mb-1">{phaseInfo.phase} - {phaseInfo.title}</p>
                      <p className="text-sm font-bold text-[#1D2538]/70 mb-3">Kroppen går igenom hormonella förändringar.</p>
                      <div className="bg-white p-3 rounded-xl shadow-sm">
                          <p className="text-xs font-black text-[#E55835] uppercase mb-1">TIPS TILL PARTNERN</p>
                          <p className="text-sm font-bold text-[#1D2538]">{phaseInfo.partnerTip}</p>
                      </div>
                  </div>
              </div>
          )}

          <form onSubmit={handleSave} className={`bg-white p-5 rounded-3xl shadow-sm border mb-8 ${editingId ? 'ring-2 ring-[#581625]' : ''}`}>
            <h3 className="font-black text-lg text-[#1D2538] mb-4">{editingId ? 'Redigera logg' : 'Ny logg'}</h3>
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1.5 block">Datum</label>
            <input type="date" value={logDate} onChange={e => setLogDate(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none mb-4" required />

            <div className="flex gap-4 mb-5">
              <div className="flex-1">
                <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1.5 block">Mående</label>
                <select value={mood} onChange={e => setMood(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none">
                  <option>Toppen</option><option>Bra</option><option>Helt okej</option><option>Stressad</option><option>Låg</option>
                </select>
              </div>
              <div className="flex-1">
                <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1.5 block">Mens/Blödning</label>
                <select value={bleeding} onChange={e => setBleeding(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none">
                  <option>Nej</option><option>Ja, Lätt</option><option>Ja, Normal</option><option>Ja, Kraftig</option>
                </select>
              </div>
            </div>
            <div className="flex gap-2">
                <button type="submit" className="flex-1 bg-[#581625] text-white py-3.5 rounded-2xl font-black shadow-md">{editingId ? 'Spara' : 'Logga'}</button>
                {editingId && <button type="button" onClick={() => {setEditingId(null); setLogDate(today);}} className="px-4 text-xs font-bold text-[#1D2538]/50">Avbryt</button>}
            </div>
          </form>

          <div>
            <h3 className="font-black text-xl text-[#1D2538] mb-4">Historik</h3>
            {logs.length === 0 ? (
              <div className="bg-white/50 rounded-3xl p-6 text-center border">
                <p className="text-[#1D2538]/40 font-bold text-sm">Ingen historik än.</p>
              </div>
            ) : (
              <div className="space-y-3">
                {[...logs].sort((a,b) => new Date(b.date) - new Date(a.date)).map(log => (
                  <div key={log.id} className="bg-white p-4 rounded-3xl shadow-sm border flex justify-between items-center">
                    <div>
                      <h4 className="font-black text-[#1D2538] text-base">{log.date}</h4>
                      <p className="text-xs font-bold text-[#1D2538]/50 mt-1 flex gap-2">
                        <span>Blödning: <span className={log.bleeding !== 'Nej' ? 'text-[#E55835]' : ''}>{log.bleeding}</span></span>
                      </p>
                    </div>
                    <div className="flex items-center gap-3">
                        <span className="bg-[#F7F4EE] text-[#1D2538] text-xs font-black px-3 py-1.5 rounded-xl mr-2">{log.mood}</span>
                        <button onClick={() => editLog(log)} className="text-[#1D2538]/30 hover:text-[#1D2538]"><Edit3 size={18} /></button>
                        <button onClick={() => deleteLog(log.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- BARNENS UTVECKLING ---
    function ChildDevelopment({ members, setActiveTab }) {
        const children = members.filter(m => m.role === 'Barn' && m.birthDate);

        const getAgeInfo = (birthDate) => {
            const today = new Date();
            const bDate = new Date(birthDate);
            let months = (today.getFullYear() - bDate.getFullYear()) * 12 + (today.getMonth() - bDate.getMonth());
            if (today.getDate() < bDate.getDate()) months--;
            
            const years = Math.floor(months / 12);
            const extraMonths = months % 12;
            
            let tip = "";
            if (years < 1) tip = "Mycket utveckling sker första året. Fasta rutiner, närhet och tröst är avgörande. Allt är en fas!";
            else if (years < 2) tip = "Nu utforskas världen på egna ben! Ge utrymme för rörelse men var nära som en trygg hamn.";
            else if (years < 4) tip = "Viljeåldern ('trotsåldern') sätter in. Barnet testar gränser för att bygga sin egen identitet. Välj dina strider och erbjuda tydliga, avgränsade val (A eller B).";
            else if (years < 6) tip = "Mycket fantasi, lek och magiskt tänkande. Uppmuntra till självständighet som att klä sig själv. Låt leken styra inlärningen.";
            else if (years < 9) tip = "Lilla tonåren. Stort fokus flyttas till kompisar och skola. Barnet vill klara mycket själv men behöver mycket bekräftelse. Var lyhörd för hur dagen varit.";
            else if (years < 13) tip = "Förpubertet. Behöver mer integritet och tid för sig själv, men fortfarande mycket tydliga ramar och stöttning från föräldrar.";
            else tip = "Tonåren. Mycket händer i både hjärna och kropp. Det bästa du kan göra: Lyssna mer, döm mindre, och var den trygga punkten de alltid kan falla tillbaka på.";

            return { text: `${years} år, ${extraMonths} mån`, tip };
        };

        return (
            <div className="p-4 pb-32 h-full overflow-y-auto">
                <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
                <div className="bg-gradient-to-br from-[#A7CEF6] to-[#4B88C4] rounded-3xl p-6 text-white shadow-lg mb-6">
                    <h2 className="text-2xl font-black mb-1 flex items-center gap-3"><Baby size={24}/> Barnens Utveckling</h2>
                    <p className="text-white/80 text-sm font-bold mt-2">Tips och insikter baserat på barnens ålder.</p>
                </div>

                {children.length === 0 ? (
                    <div className="bg-white p-6 rounded-3xl text-center border font-bold text-[#1D2538]/50">
                        Inga barn med angivet födelsedatum finns. Gå till Inställningar -> Familj för att lägga till.
                    </div>
                ) : (
                    <div className="space-y-4">
                        {children.map(child => {
                            const info = getAgeInfo(child.birthDate);
                            return (
                                <div key={child.id} className="bg-white p-5 rounded-3xl shadow-sm border">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-black text-xl text-[#1D2538]">{child.name}</h3>
                                        <span className="bg-[#A7CEF6]/20 text-[#4B88C4] font-black text-xs px-3 py-1 rounded-xl">{info.text}</span>
                                    </div>
                                    <div className="bg-[#F7F4EE] p-4 rounded-2xl text-sm font-bold text-[#1D2538]/70 leading-relaxed border border-[#1D2538]/5">
                                        {info.tip}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                )}
            </div>
        );
    }

    // --- HUB/MENY ---
    function Menu({ setActiveTab }) {
      const items = [
        { id: 'todo', title: 'Att göra', desc: 'Uppgifter och ansvarsområden', icon: <CheckSquare size={28} />, color: 'text-[#E55835]', bg: 'bg-[#E55835]/10' },
        { id: 'health', title: 'Cykelkollen', desc: 'Spåra cykel och få anpassade tips', icon: <HeartPulse size={28} />, color: 'text-[#581625]', bg: 'bg-[#F2C4C4]' },
        { id: 'child_dev', title: 'Barnens Utveckling', desc: 'Faser och tips baserat på ålder', icon: <Baby size={28} />, color: 'text-[#4B88C4]', bg: 'bg-[#A7CEF6]/20' },
        { id: 'settings_family', title: 'Familj & Inställningar', desc: 'Profiler och väder', icon: <User size={28} />, color: 'text-[#1D2538]', bg: 'bg-[#1D2538]/10' },
        { id: 'settings_sizes', title: 'Storleksmallar', desc: 'Skräddarsy klädkategorier', icon: <Ruler size={28} />, color: 'text-[#2B5B84]', bg: 'bg-[#A7CEF6]/20' },
      ];
      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-4">
          <h2 className="text-2xl font-black text-[#1D2538] mb-4">Utforska</h2>
          {items.map(item => (
            <button key={item.id} onClick={() => setActiveTab(item.id)} className="w-full bg-white p-5 rounded-3xl shadow-sm border flex items-center gap-5 text-left">
              <div className={`${item.bg} ${item.color} p-4 rounded-2xl`}>{item.icon}</div>
              <div>
                <h3 className="font-black text-[#1D2538] text-lg">{item.title}</h3>
                <p className="text-sm font-bold text-[#1D2538]/50">{item.desc}</p>
              </div>
            </button>
          ))}
        </div>
      )
    }

    // --- HUVUDKOMPONENT ---
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      
      const [localProfileId, setLocalProfileId] = useState(localStorage.getItem('familyHubLocalProfile') || '');
      const [editItemId, setEditItemId] = useState(null);

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); setAuthLoading(false); });
        return () => unsubscribe();
      }, []);

      const [data, updateData, loadingData] = useAppSync(user);

      if (authLoading || (user && loadingData)) return <div className="flex flex-col h-screen items-center justify-center bg-[#F7F4EE]"><Loader2 size={40} className="animate-spin text-[#581625] mb-4" /><p className="font-bold text-[#1D2538]/50">Laddar familjehubben...</p></div>;
      if (!user) return <LoginScreen />;

      const handleEditItemRequest = (tab, id) => {
          setActiveTab(tab);
          setEditItemId(id);
      };

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard': return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} meals={data.meals} localProfileId={localProfileId} onEditItem={handleEditItemRequest} />;
          case 'shopping': return <ShoppingList items={data.shoppingItems} groceries={data.groceries} members={data.members} settings={data.settings} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;
          case 'calendar': return <Calendar events={data.events} members={data.members} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;
          case 'todo': return <TodoList todos={data.todos} members={data.members} updateData={updateData} editItemId={editItemId} setEditItemId={setEditItemId} />;
          case 'menu': return <Menu setActiveTab={setActiveTab} />;
          case 'meals': return <MealPlanner meals={data.meals} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'settings_family': return <SettingsFamily members={data.members} settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} localProfileId={localProfileId} setLocalProfileId={setLocalProfileId} />;
          case 'settings_sizes': return <SettingsSizes settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'health': return <HealthTracker logs={data.healthLogs} members={data.members} settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'child_dev': return <ChildDevelopment members={data.members} setActiveTab={setActiveTab} />;
          default: return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} meals={data.meals} localProfileId={localProfileId} onEditItem={handleEditItemRequest} />;
        }
      };

      const getHeaderTitle = () => ({ dashboard:'Familjehubb', shopping:'Inköp', calendar:'Kalender', todo:'Att göra', menu:'Meny', meals:'Matsedel', settings_family:'Inställningar', settings_sizes:'Kategorier', health:'Cykelkoll', child_dev:'Barn' })[activeTab] || 'Familjehubb';

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto bg-[#F7F4EE] relative overflow-hidden font-sans">
          <header className="bg-gradient-to-r from-[#581625] to-[#731E32] px-6 py-5 shadow-md z-10 flex justify-center items-end h-20 rounded-b-3xl shrink-0"><h1 className="text-xl font-black text-[#F7F4EE] tracking-widest uppercase opacity-90">{getHeaderTitle()}</h1></header>
          <main className="flex-1 overflow-hidden relative">{renderContent()}</main>
          <div className="absolute bottom-6 left-2 right-2 z-20 pointer-events-none">
            <nav className="pointer-events-auto bg-white/90 backdrop-blur-xl border border-white/40 shadow-xl rounded-3xl mx-auto overflow-hidden">
              <div className="flex justify-between items-center px-2 py-2">
                <NavItem icon={<Home />} label="Start" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                <NavItem icon={<Utensils />} label="Mat" isActive={activeTab === 'meals'} onClick={() => setActiveTab('meals')} />
                <NavItem icon={<ShoppingCart />} label="Inköp" isActive={activeTab === 'shopping'} onClick={() => setActiveTab('shopping')} />
                <NavItem icon={<CalendarIcon />} label="Kalender" isActive={activeTab === 'calendar'} onClick={() => setActiveTab('calendar')} />
                <NavItem icon={<Grid />} label="Mer" isActive={['menu', 'settings_family', 'settings_sizes', 'health', 'child_dev', 'todo'].includes(activeTab)} onClick={() => setActiveTab('menu')} />
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
