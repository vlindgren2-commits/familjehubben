<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Familjehubb</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=FH&background=E55835&color=fff&size=180">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>
  
  <style>
    body { background-color: #F7F4EE; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .animate-bounce-short { animation: bounce-short 0.3s ease-in-out 1; }
    @keyframes bounce-short { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10%); } }
  </style>

  <!-- Fångar fel för att undvika vit skärm -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett fel uppstod vid inläsning</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + msg + '</div></div>';
      return false;
    };
    window.onunhandledrejection = function(event) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett nätverksfel uppstod</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + event.reason + '</div></div>';
    };
  </script>

  <!-- Garanterar att koden inte krockar -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react",
      "firebase/app": "https://esm.sh/firebase@10.7.1/app",
      "firebase/auth": "https://esm.sh/firebase@10.7.1/auth",
      "firebase/firestore": "https://esm.sh/firebase@10.7.1/firestore"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Home, ShoppingCart, CheckSquare, Calendar as CalendarIcon, Grid, Plus, Trash2, Edit3, HeartPulse, User, Ruler, ChevronDown, Wind, Thermometer, Droplets, CloudRain, Check, X, Clock, Utensils, Sparkles, Loader2, Copy, LogOut } from 'lucide-react';
    
    import { initializeApp } from "firebase/app";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
    import { getFirestore, doc, setDoc, onSnapshot } from "firebase/firestore";

    // --- DIN FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAOt0D6sBEyatAAX4ZG2Vc26TQRIoJMCzU",
      authDomain: "familjehubben-9d06d.firebaseapp.com",
      projectId: "familjehubben-9d06d",
      storageBucket: "familjehubben-9d06d.firebasestorage.app",
      messagingSenderId: "1041803591024",
      appId: "1:1041803591024:web:47a8d91c7bb49747f4e3b5",
      measurementId: "G-W44NJKDYWR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const generateId = () => Math.random().toString(36).substr(2, 9);
    const getTagColor = (name) => {
      if (!name) return 'bg-[#1D2538] text-white';
      const colors = ['bg-[#E55835] text-white', 'bg-[#A7CEF6] text-[#1D2538]', 'bg-[#F2C4C4] text-[#581625]', 'bg-[#581625] text-white'];
      let hash = 0; for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    };
    const getLocalToday = () => { const d = new Date(); return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0]; };
    const getLocalDayName = (dateString) => { if (!dateString) return ''; const d = new Date(dateString + 'T12:00:00'); return ['Sön','Mån','Tis','Ons','Tors','Fre','Lör'][d.getDay()]; };

    function useAppSync(user) {
      const initialData = {
        members: [
          { id: generateId(), name: 'Mamma', role: 'Mamma', sizes: { 'Skor': '38', 'Tröja': 'M' } },
          { id: generateId(), name: 'Pappa', role: 'Pappa', sizes: { 'Skor': '43', 'Skjorta': 'L' } },
          { id: generateId(), name: 'Barn', role: 'Barn', sizes: { 'Skor': '34', 'Ytterplagg': '134' }, birthDate: '2015-05-10' }
        ],
        shoppingItems: [], groceries: [], todos: [], events: [], healthLogs: [],
        meals: {
            current: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} },
            next: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} }
        },
        settings: { weather: { zipcode: '111 22', city: 'Stockholm' }, roleCategories: { 'Barn': ['Skor', 'Ytterplagg', 'Kläder'], 'Mamma': ['Skor', 'Tröja', 'Byxor'], 'Pappa': ['Skor', 'Skjorta'], 'Annan': ['Skor'] } }
      };

      const [data, setData] = useState(initialData);
      const [loadingData, setLoadingData] = useState(true);

      useEffect(() => {
        if (!user || !db) return;
        const docRef = doc(db, 'users', user.uid);
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const fetched = docSnap.data();
            if(!fetched.groceries) fetched.groceries = [];
            if(!fetched.meals) fetched.meals = initialData.meals;
            setData(fetched);
          } else {
            setDoc(docRef, initialData).catch(e => console.error("Skapandefel:", e));
            setData(initialData);
          }
          setLoadingData(false);
        }, (err) => {
            console.error("Fel vid hämtning av data.", err);
            alert("Kunde inte hämta data från Firebase. Har du aktiverat Rules?");
        });
        return () => unsubscribe();
      }, [user]);

      const updateData = (key, newData) => {
        setData(prev => {
          const updatedVal = typeof newData === 'function' ? newData(prev[key]) : newData;
          if (user && db) setDoc(doc(db, 'users', user.uid), { [key]: updatedVal }, { merge: true });
          return { ...prev, [key]: updatedVal };
        });
      };

      return [data, updateData, loadingData];
    }

    function LoginScreen() {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState(''); const [isRegistering, setIsRegistering] = useState(false); const [error, setError] = useState(''); const [loading, setLoading] = useState(false);
      const handleSubmit = async (e) => {
        e.preventDefault(); setError(''); setLoading(true);
        try { if (isRegistering) { await createUserWithEmailAndPassword(auth, email, password); } else { await signInWithEmailAndPassword(auth, email, password); } } catch (err) { setError(err.message.includes('auth/') ? 'Fel inloggning eller så saknas kontot. Testa "Skapa konto".' : err.message); }
        setLoading(false);
      };
      return (
        <div className="flex flex-col items-center justify-center h-screen bg-[#F7F4EE] p-6">
          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] p-6 rounded-[2rem] w-full max-w-sm text-white shadow-2xl mb-8 relative overflow-hidden">
             <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div><Home size={40} className="mb-4 relative z-10" /><h1 className="text-4xl font-black relative z-10 tracking-tight">Familjehubb</h1><p className="font-bold text-white/80 mt-2 relative z-10">Logga in för att synka familjens vardag.</p>
          </div>
          <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white p-6 rounded-[2rem] shadow-sm border border-[#1D2538]/5">
            <h2 className="text-xl font-black text-[#1D2538] mb-5">{isRegistering ? 'Skapa Familjekonto' : 'Logga in'}</h2>
            {error && <div className="bg-[#F2C4C4] text-[#581625] p-3 rounded-xl text-sm font-bold mb-4">{error}</div>}
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Gemensam E-post</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" />
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Gemensamt Lösenord (Minst 6 tecken)</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-6" />
            <button type="submit" disabled={loading} className="w-full bg-[#1D2538] text-white py-3.5 rounded-2xl font-black shadow-md flex justify-center items-center gap-2">{loading && <Loader2 size={16} className="animate-spin" />} {isRegistering ? 'Skapa konto' : 'Logga in'}</button>
            <button type="button" onClick={() => setIsRegistering(!isRegistering)} className="w-full text-center mt-4 text-sm font-bold text-[#1D2538]/60 hover:text-[#1D2538]">{isRegistering ? 'Har ni redan ett konto? Logga in' : 'Inget konto? Skapa ett här'}</button>
          </form>
        </div>
      );
    }

    function NavItem({ icon, label, isActive, onClick }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 h-14 rounded-2xl transition-all duration-300 ${isActive ? 'bg-[#581625] text-[#F7F4EE] shadow-md scale-105' : 'text-[#1D2538]/50 hover:bg-[#1D2538]/5'}`}>
          {React.cloneElement(icon, { size: isActive ? 24 : 22, className: isActive ? 'animate-bounce-short' : '' })}
          <span className={`text-[10px] font-black mt-1 ${isActive ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{label}</span>
        </button>
      );
    }

    function Dashboard({ events, todos, shoppingItems, healthLogs, weatherConfig, setActiveTab, members, meals }) {
      const today = getLocalToday();
      const upcomingEvents = events.filter(e => e.fromDate >= today).sort((a, b) => { if (a.fromDate !== b.fromDate) return a.fromDate.localeCompare(b.fromDate); return (a.fromTime || '00:00').localeCompare(b.fromTime || '00:00'); });
      const todayLog = healthLogs.find(log => log.date === today);
      const activeTodos = todos.filter(t => !t.completed); const activeShopping = shoppingItems.filter(i => !i.completed);
      const dayIndex = new Date().getDay(); const daysArr = ['Sön', 'Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör']; const todaysMeal = meals?.current?.[daysArr[dayIndex]];

      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-6">
          <div className="bg-gradient-to-br from-[#A7CEF6] to-[#4B88C4] rounded-[2rem] p-5 text-white shadow-xl relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
            <div className="flex justify-between items-center mb-5 relative z-10"><div><h3 className="text-3xl font-black tracking-tight">{weatherConfig?.city || weatherConfig?.zipcode || 'Ställ in ort'}</h3><p className="text-white/90 font-bold text-sm opacity-80">Prognos idag</p></div><div className="bg-white/20 p-3.5 rounded-2xl backdrop-blur-md shadow-inner"><Wind size={28} /></div></div>
            <div className="flex justify-between bg-white/20 rounded-2xl p-4 backdrop-blur-md relative z-10 shadow-sm">
              {[{ time: 'Fm', temp: '14°', icon: <CloudRain size={22}/> }, { time: 'Lunch', temp: '18°', icon: <Thermometer size={22}/> }, { time: 'Em', temp: '17°', icon: <Wind size={22}/> }, { time: 'Kväll', temp: '12°', icon: <Droplets size={22}/> }].map((w, i) => (<div key={i} className="flex flex-col items-center gap-2"><span className="text-[11px] font-black uppercase tracking-wider text-white/80">{w.time}</span>{w.icon}<span className="font-black text-base">{w.temp}</span></div>))}
            </div>
          </div>

          <div onClick={() => setActiveTab('health')} className={`rounded-3xl p-5 shadow-sm border cursor-pointer relative overflow-hidden transition-transform active:scale-95 ${todayLog ? 'bg-gradient-to-r from-[#F2C4C4] to-[#f4d5d5] border-[#F2C4C4]' : 'bg-white border-[#1D2538]/10 border-dashed'}`}>
            <div className="flex items-center gap-4 relative z-10"><div className={`${todayLog ? 'bg-white text-[#581625]' : 'bg-[#1D2538]/5 text-[#1D2538]/40'} p-3.5 rounded-2xl`}><HeartPulse size={24} /></div><div><h4 className="font-black text-[#1D2538] text-base">{todayLog ? 'Hälsostatus loggad' : 'Hur mår ni idag?'}</h4><p className="text-xs font-bold text-[#1D2538]/60 mt-1">{todayLog ? `Mående: ${todayLog.mood} ${todayLog.bleeding !== 'Nej' ? ' | Blödning: Ja' : ''}` : 'Klicka här för att logga cykel & mående'}</p></div></div>
          </div>

          {todaysMeal?.title && (
            <div onClick={() => setActiveTab('meals')} className="bg-gradient-to-r from-[#E55835] to-[#f07b5d] rounded-3xl p-5 text-white shadow-sm border border-[#E55835]/20 cursor-pointer flex justify-between items-center transition-transform active:scale-95">
              <div><h4 className="font-bold text-white/80 text-xs uppercase tracking-widest mb-1">Dagens Middag</h4><p className="font-black text-xl">{todaysMeal.title}</p></div><div className="bg-white/20 p-3 rounded-2xl backdrop-blur-md shadow-inner"><Utensils size={24} /></div>
            </div>
          )}

          <div>
            <div className="flex justify-between items-end mb-4"><h2 className="text-2xl font-black text-[#1D2538]">På schemat</h2><button onClick={() => setActiveTab('calendar')} className="text-sm font-bold text-[#E55835] bg-[#E55835]/10 px-3 py-1 rounded-xl">Se alla</button></div>
            <div className="space-y-3">
              {upcomingEvents.length === 0 ? (<div className="bg-white rounded-3xl p-6 text-center border"><p className="text-[#1D2538]/50 font-bold text-sm">Inga kommande händelser.</p></div>) : (
                upcomingEvents.slice(0, 4).map(event => {
                  const isToday = event.fromDate === today; const appliesTo = members.find(m => m.id === event.appliesToId); const responsible = members.find(m => m.id === event.responsibleId);
                  return (
                    <div key={event.id} className={`bg-white rounded-3xl p-4 shadow-sm border-l-4 ${isToday ? 'border-l-[#E55835]' : 'border-l-[#1D2538]/30'} border-y border-r flex gap-4 items-center`}>
                      <div className={`flex flex-col items-center justify-center rounded-2xl px-2 py-2 min-w-[70px] ${isToday ? 'bg-[#E55835]/10 text-[#E55835]' : 'bg-[#F7F4EE] text-[#1D2538]/50'}`}><span className="text-xs font-black">{isToday ? 'IDAG' : event.fromDate}</span><span className="text-[10px] font-bold mt-0.5">{event.fromTime || 'Heldag'}</span></div>
                      <div className="flex-1 py-1"><h4 className="font-black text-[#1D2538] text-base leading-tight mb-2">{event.title}</h4><div className="flex flex-wrap gap-1.5">{appliesTo && <span className={`text-[9px] font-bold px-2 py-0.5 rounded-md ${getTagColor(appliesTo.name)}`}>För: {appliesTo.name}</span>}{responsible && <span className="text-[9px] font-bold px-2 py-0.5 rounded-md bg-[#F7F4EE]">Ansvar: {responsible.name}</span>}</div></div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
          
          <div className="grid grid-cols-2 gap-4 mt-6">
            <div onClick={() => setActiveTab('shopping')} className="bg-white rounded-3xl p-5 shadow-sm border cursor-pointer"><div className="flex justify-between items-center mb-3"><h3 className="font-black text-[#1D2538]">Inköp</h3><span className="bg-[#E55835] text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center">{activeShopping.length}</span></div><ul className="space-y-2">{activeShopping.slice(0, 3).map(i => <li key={i.id} className="text-xs font-bold text-[#1D2538]/60 truncate flex items-center gap-1.5 before:content-[''] before:w-1.5 before:h-1.5 before:bg-[#1D2538]/20 before:rounded-full">{i.title}</li>)}{activeShopping.length === 0 && <li className="text-xs font-bold text-[#1D2538]/30">Inget på listan</li>}</ul></div>
            <div onClick={() => setActiveTab('todo')} className="bg-white rounded-3xl p-5 shadow-sm border cursor-pointer"><div className="flex justify-between items-center mb-3"><h3 className="font-black text-[#1D2538]">Att göra</h3><span className="bg-[#1D2538] text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center">{activeTodos.length}</span></div><ul className="space-y-2">{activeTodos.slice(0, 3).map(t => <li key={t.id} className="text-xs font-bold text-[#1D2538]/60 truncate flex items-center gap-1.5 before:content-[''] before:w-1.5 before:h-1.5 before:bg-[#1D2538]/20 before:rounded-full">{t.title}</li>)}{activeTodos.length === 0 && <li className="text-xs font-bold text-[#1D2538]/30">Inga uppgifter</li>}</ul></div>
          </div>
          
          <div className="flex justify-center mt-6 mb-10"><button onClick={() => signOut(auth)} className="flex items-center gap-2 text-sm font-bold text-[#1D2538]/40 hover:text-[#581625] px-4 py-2 bg-white rounded-xl shadow-sm"><LogOut size={16}/> Logga ut</button></div>
        </div>
      );
    }

    function ShoppingList({ items, groceries = [], members, settings, updateData }) {
      const [activeTab, setActiveTab] = useState('food'); 
      const [title, setTitle] = useState(''); const [selectedMember, setSelectedMember] = useState(''); const [category, setCategory] = useState(''); const [details, setDetails] = useState(''); const [link, setLink] = useState(''); const [buyerId, setBuyerId] = useState(''); const [isExpanded, setIsExpanded] = useState(false); const [editingId, setEditingId] = useState(null);
      const activeItems = items.filter(i => !i.completed); const activeGroceries = groceries.filter(i => !i.completed);
      const availableCategories = selectedMember ? (settings.roleCategories[members.find(m=>m.id===selectedMember)?.role] || []) : [];

      const handleSave = (e) => { e.preventDefault(); if (!title.trim()) return; if (editingId) { updateData('shoppingItems', items.map(item => item.id === editingId ? { ...item, title, memberId: selectedMember, buyerId, category, details, link } : item)); setEditingId(null); } else { updateData('shoppingItems', [...items, { id: generateId(), title, memberId: selectedMember, buyerId, category, details, link, completed: false }]); } resetForm(); };
      const editItem = (item) => { setTitle(item.title); setSelectedMember(item.memberId || ''); setBuyerId(item.buyerId || ''); setCategory(item.category || ''); setDetails(item.details || ''); setLink(item.link || ''); setEditingId(item.id); setIsExpanded(true); };
      const toggleComplete = (id) => updateData('shoppingItems', items.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const resetForm = () => { setTitle(''); setSelectedMember(''); setBuyerId(''); setCategory(''); setDetails(''); setLink(''); setIsExpanded(false); setEditingId(null); };

      const [groceryAmount, setGroceryAmount] = useState(''); const [groceryItem, setGroceryItem] = useState(''); const [groceryEditingId, setGroceryEditingId] = useState(null);
      const handleGrocerySave = (e) => { e.preventDefault(); if (!groceryItem.trim()) return; if (groceryEditingId) { updateData('groceries', groceries.map(item => item.id === groceryEditingId ? { ...item, amount: groceryAmount, title: groceryItem } : item)); setGroceryEditingId(null); } else { updateData('groceries', [...groceries, { id: generateId(), amount: groceryAmount, title: groceryItem, completed: false }]); } setGroceryAmount(''); setGroceryItem(''); };
      const editGrocery = (item) => { setGroceryAmount(item.amount || ''); setGroceryItem(item.title); setGroceryEditingId(item.id); };

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 shadow-inner"><button onClick={() => {setActiveTab('food'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'food' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>🍎 Matvaror</button><button onClick={() => {setActiveTab('general'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'general' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>🛍️ Övrigt</button></div>
          {activeTab === 'general' ? (
              <>
                <form onSubmit={handleSave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6"><div className="flex gap-2"><input value={title} onChange={e => setTitle(e.target.value)} placeholder="Fritext..." className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none" /><button type="submit" className="bg-[#581625] text-white px-5 rounded-2xl font-bold">{editingId ? 'Spara' : 'Lägg till'}</button></div>{isExpanded ? (<div className="mt-4 space-y-3 pt-3 border-t"><div className="flex gap-3"><select value={selectedMember} onChange={e => setSelectedMember(e.target.value)} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none appearance-none"><option value="">För vem?</option>{members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select><select value={buyerId} onChange={e => setBuyerId(e.target.value)} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none appearance-none"><option value="">Vem köper?</option>{members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></div><select value={category} onChange={e => setCategory(e.target.value)} className="w-full bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none appearance-none"><option value="">Välj kategori...</option>{availableCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}</select><div className="flex gap-3"><input value={details} onChange={e => setDetails(e.target.value)} placeholder="Detaljer/Storlek" className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none" /><input value={link} onChange={e => setLink(e.target.value)} placeholder="Länk" className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none" /></div></div>) : (<button type="button" onClick={() => setIsExpanded(true)} className="mt-3 text-xs font-bold text-[#E55835] flex items-center gap-1 ml-1"><Plus size={14} /> Fler detaljer</button>)}</form>
                <div className="space-y-3">{activeItems.map(item => (<div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4"><button onClick={() => toggleComplete(item.id)} className="mt-1 flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20"></button><div className="flex-1"><h4 className="font-black text-lg leading-tight">{item.title}</h4><div className="flex flex-wrap gap-2 mt-2">{item.memberId && <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#E55835] text-white">För: {members.find(m => m.id === item.memberId)?.name}</span>}{item.buyerId && <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#1D2538]/10">Köps av: {members.find(m => m.id === item.buyerId)?.name}</span>}</div></div><div className="flex flex-col gap-2"><button onClick={() => editItem(item)} className="text-[#1D2538]/30"><Edit3 size={18} /></button><button onClick={() => updateData('shoppingItems', items.filter(i => i.id !== item.id))} className="text-[#581625]/50 hover:text-[#581625]"><Trash2 size={18} /></button></div></div>))}</div>
              </>
          ) : (
              <>
                <form onSubmit={handleGrocerySave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6"><div className="flex gap-2"><input value={groceryAmount} onChange={e => setGroceryAmount(e.target.value)} placeholder="Mängd" className="w-1/3 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" /><input value={groceryItem} onChange={e => setGroceryItem(e.target.value)} placeholder="Matvara..." className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" /><button type="submit" className="bg-[#E55835] text-white px-5 rounded-2xl font-bold">{groceryEditingId ? 'Spara' : 'Lägg till'}</button></div></form>
                <div className="space-y-3">{activeGroceries.map(item => (<div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center"><button onClick={() => updateData('groceries', groceries.map(i => i.id === item.id ? { ...i, completed: true } : i))} className="flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20"></button><div className="flex-1"><span className="font-black">{item.title}</span>{item.amount && <span className="ml-2 text-xs font-bold text-[#1D2538]/50">{item.amount}</span>}</div><button onClick={() => editGrocery(item)} className="text-[#1D2538]/30 p-1"><Edit3 size={18} /></button><button onClick={() => updateData('groceries', groceries.filter(i => i.id !== item.id))} className="text-[#581625]/50 p-1"><Trash2 size={18} /></button></div>))}</div>
              </>
          )}
        </div>
      );
    }

    function Calendar({ events, members, updateData }) {
      const [title, setTitle] = useState(''); const [fromDate, setFromDate] = useState(''); const [fromTime, setFromTime] = useState(''); const [toDate, setToDate] = useState(''); const [toTime, setToTime] = useState(''); const [appliesToId, setAppliesToId] = useState(''); const [responsibleId, setResponsibleId] = useState(''); const [editingId, setEditingId] = useState(null); const [showForm, setShowForm] = useState(false);
      const handleSave = (e) => { e.preventDefault(); if (!title.trim() || !fromDate) return; const newEvent = { id: editingId || generateId(), title, fromDate, fromTime, toDate, toTime, appliesToId, responsibleId }; updateData('events', editingId ? events.map(e => e.id === editingId ? newEvent : e) : [...events, newEvent]); setShowForm(false); setEditingId(null); setTitle(''); setFromDate(''); };
      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          {!showForm ? <button onClick={() => setShowForm(true)} className="w-full bg-[#1D2538] text-white py-4 rounded-3xl font-black text-lg mb-6 shadow-md flex justify-center gap-2"><Plus size={24} /> Ny händelse</button> : (<form onSubmit={handleSave} className="bg-white rounded-3xl shadow-md border p-5 mb-6"><input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad händer?" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" /><div className="grid grid-cols-2 gap-3 mb-4"><input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" required /><input type="time" value={fromTime} onChange={e => setFromTime(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" /></div><button type="submit" className="w-full bg-[#581625] text-white py-3 rounded-2xl font-black">{editingId ? 'Spara' : 'Lägg till'}</button></form>)}
          <div className="space-y-4">{events.filter(e => e.fromDate >= getLocalToday()).sort((a,b)=>a.fromDate.localeCompare(b.fromDate)).map(event => (<div key={event.id} className="bg-white rounded-3xl p-5 shadow-sm border flex gap-4"><div className="flex flex-col items-center justify-center bg-[#E55835]/10 text-[#E55835] rounded-2xl p-3 min-w-[70px]"><span className="text-xs font-black">{event.fromDate}</span></div><div className="flex-1"><h4 className="font-black text-lg mb-1">{event.title}</h4><p className="text-xs font-bold text-[#1D2538]/50 flex items-center gap-1 mb-2"><Clock size={12}/> {event.fromTime || 'Heldag'}</p></div><button onClick={() => updateData('events', events.filter(e => e.id !== event.id))} className="text-[#1D2538]/30 hover:text-[#581625] p-1"><Trash2 size={18} /></button></div>))}</div>
        </div>
      );
    }

    function TodoList({ todos, members, updateData }) {
        const [title, setTitle] = useState('');
        return (
            <div className="p-4 pb-32 h-full overflow-y-auto"><form onSubmit={e => { e.preventDefault(); updateData('todos', [...todos, { id: generateId(), title, completed: false }]); setTitle(''); }} className="bg-white rounded-3xl shadow-sm border p-4 mb-6"><input value={title} onChange={e => setTitle(e.target.value)} placeholder="Lägg till ny uppgift..." className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-3" /><button type="submit" className="w-full bg-[#581625] text-white py-3 rounded-2xl font-black">Lägg till</button></form><div className="space-y-3">{todos.filter(t => !t.completed).map(todo => (<div key={todo.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center"><button onClick={() => updateData('todos', todos.map(t => t.id === todo.id ? { ...t, completed: true } : t))} className="w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#E55835]"></button><h4 className="font-bold flex-1 leading-tight">{todo.title}</h4><button onClick={() => updateData('todos', todos.filter(t => t.id !== todo.id))} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button></div>))}</div></div>
        );
    }

    function MealPlanner({ meals, updateData }) {
        const days = ['Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör', 'Sön'];
        return (
            <div className="p-4 pb-32 h-full overflow-y-auto"><div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] rounded-3xl p-6 text-white shadow-lg mb-6"><h2 className="text-2xl font-black flex items-center gap-3"><Utensils size={24}/> Matsedel</h2></div><div className="space-y-4">{days.map(day => (<div key={day} className="bg-white p-4 rounded-3xl shadow-sm border flex items-center gap-4"><span className="font-black text-[#1D2538]/50 w-10 uppercase text-sm">{day}</span><input type="text" value={meals['current']?.[day]?.title || ''} onChange={(e) => updateData('meals', prev => ({...prev, current: {...prev.current, [day]: {...prev.current[day], title: e.target.value}} }))} placeholder="Vad ska vi äta?" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl text-sm font-bold outline-none" /></div>))}</div></div>
        );
    }

    function SettingsFamily({ members, settings, updateData }) {
        const [newName, setNewName] = useState('');
        return (
            <div className="p-4 pb-32 h-full overflow-y-auto"><div className="bg-white rounded-3xl p-5 mb-6"><h3 className="font-black text-lg mb-4">Väder & Ort</h3><input type="text" placeholder="Skriv in Ort..." value={settings.weather?.city || ''} onChange={(e) => updateData('settings', { ...settings, weather: { ...settings.weather, city: e.target.value } })} className="w-full bg-[#F7F4EE] rounded-2xl px-4 py-3 font-bold outline-none" /></div><form onSubmit={e => { e.preventDefault(); if (newName) updateData('members', [...members, { id: generateId(), name: newName, role: 'Barn', sizes: {} }]); setNewName(''); }} className="flex gap-3 mb-6 bg-white p-2 rounded-3xl shadow-sm"><input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Lägg till person..." className="flex-1 bg-transparent px-5 py-3 outline-none font-bold" /><button type="submit" className="bg-[#1D2538] text-white px-5 rounded-2xl font-bold">Lägg till</button></form><div className="space-y-5">{members.map(member => (<div key={member.id} className="bg-white rounded-3xl shadow-sm p-5 flex justify-between items-center"><h4 className="font-black text-xl">{member.name}</h4><button onClick={() => updateData('members', members.filter(m => m.id !== member.id))} className="text-[#581625]"><Trash2 size={18} /></button></div>))}</div></div>
        );
    }

    function HealthTracker({ logs, updateData }) {
        const [mood, setMood] = useState('Bra'); const [bleeding, setBleeding] = useState('Nej');
        return (
            <div className="p-4 pb-32 h-full overflow-y-auto"><div className="bg-[#F2C4C4] rounded-3xl p-6 text-[#581625] shadow-lg mb-6"><h2 className="text-2xl font-black mb-1 flex items-center gap-3"><HeartPulse size={24}/> Dagsform</h2></div><form onSubmit={e => { e.preventDefault(); updateData('healthLogs', [{ id: generateId(), date: getLocalToday(), mood, bleeding }, ...logs]); }} className="bg-white p-5 rounded-3xl shadow-sm mb-8"><select value={mood} onChange={e => setMood(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold mb-4 outline-none"><option>Toppen</option><option>Bra</option><option>Stressad</option><option>Låg</option></select><button type="submit" className="w-full bg-[#581625] text-white py-3.5 rounded-2xl font-black">Spara logg</button></form><div className="space-y-3">{logs.slice(0,5).map(log => (<div key={log.id} className="bg-white p-4 rounded-3xl shadow-sm flex justify-between items-center"><h4 className="font-black">{log.date}</h4><span className="bg-[#F7F4EE] px-3 py-1.5 rounded-xl text-xs font-black">{log.mood}</span></div>))}</div></div>
        );
    }

    function Menu({ setActiveTab }) {
      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-4"><h2 className="text-2xl font-black mb-4">Utforska</h2>
        {[{ id: 'todo', title: 'Att göra', icon: <CheckSquare size={28} />, color: 'text-[#E55835]', bg: 'bg-[#E55835]/10' }, { id: 'health', title: 'Hälsologg', icon: <HeartPulse size={28} />, color: 'text-[#581625]', bg: 'bg-[#F2C4C4]' }, { id: 'settings_family', title: 'Inställningar', icon: <User size={28} />, color: 'text-[#1D2538]', bg: 'bg-[#1D2538]/10' }].map(item => (<button key={item.id} onClick={() => setActiveTab(item.id)} className="w-full bg-white p-5 rounded-3xl shadow-sm border flex items-center gap-5 text-left"><div className={`${item.bg} ${item.color} p-4 rounded-2xl`}>{item.icon}</div><div><h3 className="font-black text-lg">{item.title}</h3></div></button>))}</div>
      )
    }

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); setAuthLoading(false); });
        return () => unsubscribe();
      }, []);

      const [data, updateData, loadingData] = useAppSync(user);

      if (authLoading || (user && loadingData)) return <div className="flex flex-col h-screen items-center justify-center bg-[#F7F4EE]"><Loader2 size={40} className="animate-spin text-[#581625] mb-4" /><p className="font-bold text-[#1D2538]/50">Laddar familjehubben...</p></div>;
      if (!user) return <LoginScreen />;

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard': return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} meals={data.meals} />;
          case 'shopping': return <ShoppingList items={data.shoppingItems} groceries={data.groceries} members={data.members} settings={data.settings} updateData={updateData} />;
          case 'calendar': return <Calendar events={data.events} members={data.members} updateData={updateData} />;
          case 'todo': return <TodoList todos={data.todos} members={data.members} updateData={updateData} />;
          case 'menu': return <Menu setActiveTab={setActiveTab} />;
          case 'meals': return <MealPlanner meals={data.meals} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'settings_family': return <SettingsFamily members={data.members} settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'health': return <HealthTracker logs={data.healthLogs} updateData={updateData} setActiveTab={setActiveTab} />;
          default: return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} meals={data.meals} />;
        }
      };

      const getHeaderTitle = () => ({ dashboard:'Familjehubb', shopping:'Inköp', calendar:'Kalender', todo:'Att göra', menu:'Meny', meals:'Matsedel', settings_family:'Inställningar', health:'Hälsologg' })[activeTab] || 'Familjehubb';

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto bg-[#F7F4EE] relative overflow-hidden font-sans">
          <header className="bg-gradient-to-r from-[#581625] to-[#731E32] px-6 py-5 shadow-md z-10 flex justify-center items-end h-20 rounded-b-3xl shrink-0"><h1 className="text-xl font-black text-[#F7F4EE] tracking-widest uppercase opacity-90">{getHeaderTitle()}</h1></header>
          <main className="flex-1 overflow-hidden relative">{renderContent()}</main>
          <div className="absolute bottom-6 left-2 right-2 z-20 pointer-events-none">
            <nav className="pointer-events-auto bg-white/90 backdrop-blur-xl border border-white/40 shadow-xl rounded-3xl mx-auto overflow-hidden">
              <div className="flex justify-between items-center px-2 py-2">
                <NavItem icon={<Home />} label="Start" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                <NavItem icon={<Utensils />} label="Mat" isActive={activeTab === 'meals'} onClick={() => setActiveTab('meals')} />
                <NavItem icon={<ShoppingCart />} label="Inköp" isActive={activeTab === 'shopping'} onClick={() => setActiveTab('shopping')} />
                <NavItem icon={<CalendarIcon />} label="Kalender" isActive={activeTab === 'calendar'} onClick={() => setActiveTab('calendar')} />
                <NavItem icon={<Grid />} label="Mer" isActive={['menu', 'settings_family', 'health', 'todo'].includes(activeTab)} onClick={() => setActiveTab('menu')} />
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
