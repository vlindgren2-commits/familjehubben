<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Familjehubb</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=FH&background=E55835&color=fff&size=180">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>
  
  <style>
    body { background-color: #F7F4EE; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .animate-bounce-short { animation: bounce-short 0.3s ease-in-out 1; }
    @keyframes bounce-short { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10%); } }
  </style>

  <!-- Fångar fel för att undvika vit skärm -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett fel uppstod vid inläsning</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + msg + '</div></div>';
      return false;
    };
    window.onunhandledrejection = function(event) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett nätverksfel uppstod</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + event.reason + '</div></div>';
    };
  </script>

  <!-- Garanterar att koden inte krockar -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Home, ShoppingCart, CheckSquare, Calendar as CalendarIcon, Grid, Plus, Trash2, Edit3, HeartPulse, User, Ruler, ChevronDown, Wind, Thermometer, Droplets, CloudRain, Check, X, Clock, Utensils, Sparkles, Loader2, Copy, LogOut } from 'lucide-react';
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- DIN FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAOt0D6sBEyatAAX4ZG2Vc26TQRIoJMCzU",
      authDomain: "familjehubben-9d06d.firebaseapp.com",
      projectId: "familjehubben-9d06d",
      storageBucket: "familjehubben-9d06d.firebasestorage.app",
      messagingSenderId: "1041803591024",
      appId: "1:1041803591024:web:47a8d91c7bb49747f4e3b5",
      measurementId: "G-W44NJKDYWR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    const getTagColor = (name) => {
      if (!name) return 'bg-[#1D2538] text-white';
      const colors = ['bg-[#E55835] text-white', 'bg-[#A7CEF6] text-[#1D2538]', 'bg-[#F2C4C4] text-[#581625]', 'bg-[#581625] text-white'];
      let hash = 0; 
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    };
    
    const getLocalToday = () => { 
        const d = new Date(); 
        return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0]; 
    };
    
    const getLocalDayName = (dateString) => { 
        if (!dateString) return ''; 
        const d = new Date(dateString + 'T12:00:00'); 
        return ['Sön','Mån','Tis','Ons','Tors','Fre','Lör'][d.getDay()]; 
    };

    function useAppSync(user) {
      const initialData = {
        members: [
          { id: generateId(), name: 'Mamma', role: 'Mamma', sizes: { 'Skor': '38', 'Tröja': 'M' } },
          { id: generateId(), name: 'Pappa', role: 'Pappa', sizes: { 'Skor': '43', 'Skjorta': 'L' } },
          { id: generateId(), name: 'Barn', role: 'Barn', sizes: { 'Skor': '34', 'Ytterplagg': '134' }, birthDate: '2015-05-10' }
        ],
        shoppingItems: [], groceries: [], todos: [], events: [], healthLogs: [],
        meals: {
            current: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} },
            next: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} }
        },
        settings: { 
            weather: { zipcode: '111 22', city: 'Stockholm' }, 
            roleCategories: { 'Barn': ['Skor', 'Ytterplagg', 'Kläder'], 'Mamma': ['Skor', 'Tröja', 'Byxor'], 'Pappa': ['Skor', 'Skjorta'], 'Annan': ['Skor'] } 
        }
      };

      const [data, setData] = useState(initialData);
      const [loadingData, setLoadingData] = useState(true);

      useEffect(() => {
        if (!user || !db) return;
        const docRef = doc(db, 'users', user.uid);
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const fetched = docSnap.data();
            if(!fetched.groceries) fetched.groceries = [];
            if(!fetched.meals) fetched.meals = initialData.meals;
            setData(fetched);
          } else {
            setDoc(docRef, initialData).catch(e => console.error("Skapandefel:", e));
            setData(initialData);
          }
          setLoadingData(false);
        }, (err) => {
            console.error("Fel vid hämtning av data.", err);
            alert("Kunde inte hämta data från Firebase. Har du satt databasens Rules till true?");
        });
        return () => unsubscribe();
      }, [user]);

      const updateData = (key, newData) => {
        setData(prev => {
          const updatedVal = typeof newData === 'function' ? newData(prev[key]) : newData;
          if (user && db) setDoc(doc(db, 'users', user.uid), { [key]: updatedVal }, { merge: true });
          return { ...prev, [key]: updatedVal };
        });
      };

      return [data, updateData, loadingData];
    }

    function LoginScreen() {
      const [email, setEmail] = useState(''); 
      const [password, setPassword] = useState(''); 
      const [isRegistering, setIsRegistering] = useState(false); 
      const [error, setError] = useState(''); 
      const [loading, setLoading] = useState(false);
      
      const handleSubmit = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setLoading(true);
        try { 
            if (isRegistering) { 
                await createUserWithEmailAndPassword(auth, email, password); 
            } else { 
                await signInWithEmailAndPassword(auth, email, password); 
            } 
        } catch (err) { 
            setError(err.message.includes('auth/') ? 'Fel inloggning eller så saknas kontot. Testa "Skapa konto".' : err.message); 
        }
        setLoading(false);
      };

      return (
        <div className="flex flex-col items-center justify-center h-screen bg-[#F7F4EE] p-6">
          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] p-6 rounded-[2rem] w-full max-w-sm text-white shadow-2xl mb-8 relative overflow-hidden">
             <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
             <Home size={40} className="mb-4 relative z-10" />
             <h1 className="text-4xl font-black relative z-10 tracking-tight">Familjehubb</h1>
             <p className="font-bold text-white/80 mt-2 relative z-10">Logga in för att synka familjens vardag.</p>
          </div>
          <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white p-6 rounded-[2rem] shadow-sm border border-[#1D2538]/5">
            <h2 className="text-xl font-black text-[#1D2538] mb-5">{isRegistering ? 'Skapa Familjekonto' : 'Logga in'}</h2>
            {error && <div className="bg-[#F2C4C4] text-[#581625] p-3 rounded-xl text-sm font-bold mb-4">{error}</div>}
            
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Gemensam E-post</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" />
            
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Gemensamt Lösenord (Minst 6 tecken)</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-6" />
            
            <button type="submit" disabled={loading} className="w-full bg-[#1D2538] text-white py-3.5 rounded-2xl font-black shadow-md flex justify-center items-center gap-2">
                {loading && <Loader2 size={16} className="animate-spin" />} 
                {isRegistering ? 'Skapa konto' : 'Logga in'}
            </button>
            <button type="button" onClick={() => setIsRegistering(!isRegistering)} className="w-full text-center mt-4 text-sm font-bold text-[#1D2538]/60 hover:text-[#1D2538]">
                {isRegistering ? 'Har ni redan ett konto? Logga in' : 'Inget konto? Skapa ett här'}
            </button>
          </form>
        </div>
      );
    }

    function NavItem({ icon, label, isActive, onClick }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 h-14 rounded-2xl transition-all duration-300 ${isActive ? 'bg-[#581625] text-[#F7F4EE] shadow-md scale-105' : 'text-[#1D2538]/50 hover:bg-[#1D2538]/5'}`}>
          {React.cloneElement(icon, { size: isActive ? 24 : 22, className: isActive ? 'animate-bounce-short' : '' })}
          <span className={`text-[10px] font-black mt-1 ${isActive ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{label}</span>
        </button>
      );
    }

    // --- DASHBOARD ---
    function Dashboard({ events, todos, shoppingItems, healthLogs, weatherConfig, setActiveTab, members, meals }) {
      const today = getLocalToday();
      const upcomingEvents = events.filter(e => e.fromDate >= today).sort((a, b) => { 
          if (a.fromDate !== b.fromDate) return a.fromDate.localeCompare(b.fromDate); 
          return (a.fromTime || '00:00').localeCompare(b.fromTime || '00:00'); 
      });
      const todayLog = healthLogs.find(log => log.date === today);
      const activeTodos = todos.filter(t => !t.completed); 
      const activeShopping = shoppingItems.filter(i => !i.completed);
      
      const dayIndex = new Date().getDay(); 
      const daysArr = ['Sön', 'Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör']; 
      const todaysMeal = meals?.current?.[daysArr[dayIndex]];

      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-6">
          {/* Väder */}
          <div className="bg-gradient-to-br from-[#A7CEF6] to-[#4B88C4] rounded-[2rem] p-5 text-white shadow-xl relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
            <div className="flex justify-between items-center mb-5 relative z-10">
                <div>
                    <h3 className="text-3xl font-black tracking-tight">{weatherConfig?.city || weatherConfig?.zipcode || 'Ställ in ort'}</h3>
                    <p className="text-white/90 font-bold text-sm opacity-80">Prognos idag</p>
                </div>
                <div className="bg-white/20 p-3.5 rounded-2xl backdrop-blur-md shadow-inner"><Wind size={28} /></div>
            </div>
            <div className="flex justify-between bg-white/20 rounded-2xl p-4 backdrop-blur-md relative z-10 shadow-sm">
              {[
                  { time: 'Fm', temp: '14°', icon: <CloudRain size={22}/> }, 
                  { time: 'Lunch', temp: '18°', icon: <Thermometer size={22}/> }, 
                  { time: 'Em', temp: '17°', icon: <Wind size={22}/> }, 
                  { time: 'Kväll', temp: '12°', icon: <Droplets size={22}/> }
              ].map((w, i) => (
                  <div key={i} className="flex flex-col items-center gap-2">
                      <span className="text-[11px] font-black uppercase tracking-wider text-white/80">{w.time}</span>
                      {w.icon}
                      <span className="font-black text-base">{w.temp}</span>
                  </div>
              ))}
            </div>
          </div>

          {/* Hälsologg */}
          <div onClick={() => setActiveTab('health')} className={`rounded-3xl p-5 shadow-sm border cursor-pointer relative overflow-hidden transition-transform active:scale-95 ${todayLog ? 'bg-gradient-to-r from-[#F2C4C4] to-[#f4d5d5] border-[#F2C4C4]' : 'bg-white border-[#1D2538]/10 border-dashed'}`}>
            <div className="flex items-center gap-4 relative z-10">
                <div className={`${todayLog ? 'bg-white text-[#581625]' : 'bg-[#1D2538]/5 text-[#1D2538]/40'} p-3.5 rounded-2xl`}><HeartPulse size={24} /></div>
                <div>
                    <h4 className="font-black text-[#1D2538] text-base">{todayLog ? 'Hälsostatus loggad' : 'Hur mår ni idag?'}</h4>
                    <p className="text-xs font-bold text-[#1D2538]/60 mt-1">{todayLog ? `Mående: ${todayLog.mood} ${todayLog.bleeding !== 'Nej' ? ' | Blödning: Ja' : ''}` : 'Klicka här för att logga cykel & mående'}</p>
                </div>
            </div>
          </div>

          {/* Dagens mat */}
          {todaysMeal?.title && (
            <div onClick={() => setActiveTab('meals')} className="bg-gradient-to-r from-[#E55835] to-[#f07b5d] rounded-3xl p-5 text-white shadow-sm border border-[#E55835]/20 cursor-pointer flex justify-between items-center transition-transform active:scale-95">
              <div>
                  <h4 className="font-bold text-white/80 text-xs uppercase tracking-widest mb-1">Dagens Middag</h4>
                  <p className="font-black text-xl">{todaysMeal.title}</p>
              </div>
              <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-md shadow-inner"><Utensils size={24} /></div>
            </div>
          )}

          {/* Kalender */}
          <div>
            <div className="flex justify-between items-end mb-4">
                <h2 className="text-2xl font-black text-[#1D2538]">På schemat</h2>
                <button onClick={() => setActiveTab('calendar')} className="text-sm font-bold text-[#E55835] bg-[#E55835]/10 px-3 py-1 rounded-xl">Se alla</button>
            </div>
            <div className="space-y-3">
              {upcomingEvents.length === 0 ? (
                  <div className="bg-white rounded-3xl p-6 text-center border"><p className="text-[#1D2538]/50 font-bold text-sm">Inga kommande händelser inlagda.</p></div>
              ) : (
                upcomingEvents.slice(0, 4).map(event => {
                  const isToday = event.fromDate === today; 
                  const appliesTo = members.find(m => m.id === event.appliesToId); 
                  const responsible = members.find(m => m.id === event.responsibleId);
                  return (
                    <div key={event.id} className={`bg-white rounded-3xl p-4 shadow-sm border-l-4 ${isToday ? 'border-l-[#E55835]' : 'border-l-[#1D2538]/30'} border-y border-r flex gap-4 items-center`}>
                      <div className={`flex flex-col items-center justify-center rounded-2xl px-2 py-2 min-w-[70px] ${isToday ? 'bg-[#E55835]/10 text-[#E55835]' : 'bg-[#F7F4EE] text-[#1D2538]/50'}`}>
                          <span className="text-xs font-black">{isToday ? 'IDAG' : event.fromDate}</span>
                          <span className="text-[10px] font-bold mt-0.5">{event.fromTime || 'Heldag'}</span>
                      </div>
                      <div className="flex-1 py-1">
                          <h4 className="font-black text-[#1D2538] text-base leading-tight mb-2">{event.title}</h4>
                          <div className="flex flex-wrap gap-1.5">
                              {appliesTo && <span className={`text-[9px] font-bold px-2 py-0.5 rounded-md ${getTagColor(appliesTo.name)}`}>För: {appliesTo.name}</span>}
                              {responsible && <span className="text-[9px] font-bold px-2 py-0.5 rounded-md bg-[#F7F4EE]">Ansvar: {responsible.name}</span>}
                          </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
          
          {/* Snabblänkar */}
          <div className="grid grid-cols-2 gap-4 mt-6">
            <div onClick={() => setActiveTab('shopping')} className="bg-white rounded-3xl p-5 shadow-sm border cursor-pointer">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="font-black text-[#1D2538]">Inköp</h3>
                    <span className="bg-[#E55835] text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center">{activeShopping.length}</span>
                </div>
                <ul className="space-y-2">
                    {activeShopping.slice(0, 3).map(i => <li key={i.id} className="text-xs font-bold text-[#1D2538]/60 truncate flex items-center gap-1.5 before:content-[''] before:w-1.5 before:h-1.5 before:bg-[#1D2538]/20 before:rounded-full">{i.title}</li>)}
                    {activeShopping.length === 0 && <li className="text-xs font-bold text-[#1D2538]/30">Inget på listan</li>}
                </ul>
            </div>
            
            <div onClick={() => setActiveTab('todo')} className="bg-white rounded-3xl p-5 shadow-sm border cursor-pointer">
                <div className="flex justify-between items-center mb-3">
                    <h3 className="font-black text-[#1D2538]">Att göra</h3>
                    <span className="bg-[#1D2538] text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center">{activeTodos.length}</span>
                </div>
                <ul className="space-y-2">
                    {activeTodos.slice(0, 3).map(t => <li key={t.id} className="text-xs font-bold text-[#1D2538]/60 truncate flex items-center gap-1.5 before:content-[''] before:w-1.5 before:h-1.5 before:bg-[#1D2538]/20 before:rounded-full">{t.title}</li>)}
                    {activeTodos.length === 0 && <li className="text-xs font-bold text-[#1D2538]/30">Inga uppgifter</li>}
                </ul>
            </div>
          </div>
          
          <div className="flex justify-center mt-6 mb-10">
              <button onClick={() => signOut(auth)} className="flex items-center gap-2 text-sm font-bold text-[#1D2538]/40 hover:text-[#581625] px-4 py-2 bg-white rounded-xl shadow-sm"><LogOut size={16}/> Logga ut</button>
          </div>
        </div>
      );
    }

    // --- INKÖPSLISTA ---
    function ShoppingList({ items, groceries = [], members, settings, updateData }) {
      const [activeTab, setActiveTab] = useState('food'); 
      const [copyStatus, setCopyStatus] = useState('');
      
      const [title, setTitle] = useState(''); 
      const [selectedMember, setSelectedMember] = useState(''); 
      const [category, setCategory] = useState(''); 
      const [details, setDetails] = useState(''); 
      const [link, setLink] = useState(''); 
      const [buyerId, setBuyerId] = useState(''); 
      const [isExpanded, setIsExpanded] = useState(false); 
      const [editingId, setEditingId] = useState(null);
      
      const activeItems = items.filter(i => !i.completed); 
      const completedItems = items.filter(i => i.completed);
      const activeGroceries = groceries.filter(i => !i.completed);
      const completedGroceries = groceries.filter(i => i.completed);

      const activeMember = members.find(m => m.id === selectedMember);
      const availableCategories = activeMember ? (settings.roleCategories[activeMember.role] || []) : [];

      const handleCategoryChange = (e) => {
        const selectedCat = e.target.value;
        setCategory(selectedCat);
        if (activeMember && activeMember.sizes && activeMember.sizes[selectedCat]) {
          setDetails(activeMember.sizes[selectedCat]);
        }
      };

      const handleSave = (e) => { 
          e.preventDefault(); 
          if (!title.trim()) return; 
          
          if (editingId) { 
              updateData('shoppingItems', items.map(item => item.id === editingId ? { ...item, title, memberId: selectedMember, buyerId, category, details, link } : item)); 
              setEditingId(null); 
          } else { 
              updateData('shoppingItems', [...items, { id: generateId(), title, memberId: selectedMember, buyerId, category, details, link, completed: false }]); 
          } 
          resetForm(); 
      };
      
      const editItem = (item) => { 
          setTitle(item.title); setSelectedMember(item.memberId || ''); setBuyerId(item.buyerId || ''); setCategory(item.category || ''); setDetails(item.details || ''); setLink(item.link || ''); setEditingId(item.id); setIsExpanded(true); 
      };
      
      const toggleComplete = (id) => updateData('shoppingItems', items.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const deleteItem = (id) => updateData('shoppingItems', items.filter(i => i.id !== id));
      const resetForm = () => { setTitle(''); setSelectedMember(''); setBuyerId(''); setCategory(''); setDetails(''); setLink(''); setIsExpanded(false); setEditingId(null); };

      const [groceryAmount, setGroceryAmount] = useState(''); 
      const [groceryItem, setGroceryItem] = useState(''); 
      const [groceryEditingId, setGroceryEditingId] = useState(null);
      
      const handleGrocerySave = (e) => { 
          e.preventDefault(); 
          if (!groceryItem.trim()) return; 
          if (groceryEditingId) { 
              updateData('groceries', groceries.map(item => item.id === groceryEditingId ? { ...item, amount: groceryAmount, title: groceryItem } : item)); 
              setGroceryEditingId(null); 
          } else { 
              updateData('groceries', [...groceries, { id: generateId(), amount: groceryAmount, title: groceryItem, completed: false }]); 
          } 
          setGroceryAmount(''); setGroceryItem(''); 
      };
      
      const editGrocery = (item) => { 
          setGroceryAmount(item.amount || ''); setGroceryItem(item.title); setGroceryEditingId(item.id); 
      };
      
      const toggleGroceryComplete = (id) => updateData('groceries', groceries.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const deleteGrocery = (id) => updateData('groceries', groceries.filter(i => i.id !== id));

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 shadow-inner">

    function Calendar({ events, members, updateData }) {
      const [title, setTitle] = useState(''); 
      const [fromDate, setFromDate] = useState(''); 
      const [fromTime, setFromTime] = useState(''); 
      const [toDate, setToDate] = useState(''); 
      const [toTime, setToTime] = useState(''); 
      const [appliesToId, setAppliesToId] = useState(''); 
      const [responsibleId, setResponsibleId] = useState(''); 
      const [editingId, setEditingId] = useState(null); 
      const [showForm, setShowForm] = useState(false);

      const handleSave = (e) => { 
          e.preventDefault(); 
          if (!title.trim() || !fromDate) return; 
          const newEvent = { id: editingId || generateId(), title, fromDate, fromTime, toDate, toTime, appliesToId, responsibleId }; 
          
          if (editingId) {
            updateData('events', events.map(e => e.id === editingId ? newEvent : e));
          } else {
            updateData('events', [...events, newEvent]);
          }
          
          resetForm();
      };
      
      const editEvent = (event) => {
        setTitle(event.title); setFromDate(event.fromDate); setFromTime(event.fromTime || ''); setToDate(event.toDate || ''); setToTime(event.toTime || '');
        setAppliesToId(event.appliesToId || ''); setResponsibleId(event.responsibleId || ''); setEditingId(event.id); setShowForm(true);
      };

      const deleteEvent = (id) => updateData('events', events.filter(e => e.id !== id));
      const resetForm = () => { setTitle(''); setFromDate(''); setFromTime(''); setToDate(''); setToTime(''); setAppliesToId(''); setResponsibleId(''); setEditingId(null); setShowForm(false); };

      const sortedEvents = [...events].sort((a, b) => {
        if (a.fromDate !== b.fromDate) return a.fromDate.localeCompare(b.fromDate);
        return (a.fromTime || '00:00').localeCompare(b.fromTime || '00:00');
      });

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          {!showForm ? (
              <button onClick={() => setShowForm(true)} className="w-full bg-[#1D2538] text-white py-4 rounded-3xl font-black text-lg mb-6 shadow-md flex justify-center gap-2">
                  <Plus size={24} /> Ny händelse

              <form onSubmit={handleSave} className="bg-white rounded-3xl shadow-md border p-5 mb-6">
                <h3 className="font-black text-lg text-[#1D2538] mb-4">{editingId ? 'Ändra händelse' : 'Ny händelse'}</h3>

                <div className="grid grid-cols-2 gap-3 mb-4">
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Från Datum</label>
                      <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" required />
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Från Tid</label>
                      <input type="time" value={fromTime} onChange={e => setFromTime(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" />
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Till Datum</label>

                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Till Tid</label>
                      <input type="time" value={toTime} onChange={e => setToTime(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" />

                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Ansvarig</label>

                </div>

                      <div className="flex flex-col justify-between">
                          <button onClick={() => editEvent(event)} className="text-[#1D2538]/30 hover:text-[#1D2538] p-1"><Edit3 size={18} /></button>
                          <button onClick={() => deleteEvent(event.id)} className="text-[#1D2538]/30 hover:text-[#581625] p-1"><Trash2 size={18} /></button>
                      </div>
                  </div>
              ))}
          </div>
        </div>
      );
    }

    function MealPlanner({ meals, updateData, setActiveTab }) {
      const days = ['Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör', 'Sön'];
      const [activeWeek, setActiveWeek] = useState('current'); 
      const [isFetching, setIsFetching] = useState(false);
      const [showScraperFor, setShowScraperFor] = useState(null);
      const [portions, setPortions] = useState(4);
      const [successMsg, setSuccessMsg] = useState('');

      const handleChange = (day, field, value) => {
        updateData('meals', prev => ({
            ...prev,
            [activeWeek]: {
                ...prev[activeWeek],
                [day]: { ...prev[activeWeek][day], [field]: value }
            }
        }));
      };

      const fetchIngredients = async (day) => {
        const url = meals[activeWeek][day].link;
        if(!url) return;
        setIsFetching(true);
        try {
            const payload = {
                contents: [{ role: 'user', parts: [{ text: `Jag vill laga receptet från denna länk: ${url} för ${portions} personer. Läs receptet och ge mig enbart en lista med ingredienserna. Svara i strikt JSON-format som en array av objekt med formen {"amount": "mängd", "item": "ingrediens"}.` }] }],
                tools: [{ "google_search": {} }],
                generationConfig: { responseMimeType: "application/json" }
            };
            // Skulle kräva en riktig API nyckel för full produktion.
            const apiKey = ""; 
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            
            if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                const ingredients = JSON.parse(result.candidates[0].content.parts[0].text);
                const newGroceries = ingredients.map(ing => ({ id: generateId(), amount: ing.amount || '', title: ing.item || ing.title, completed: false }));
                updateData('groceries', prev => [...(prev || []), ...newGroceries]);
                
                setSuccessMsg('✅ Ingredienser tillagda i Inköpslistan!');
                setTimeout(() => setSuccessMsg(''), 4000);
            }
        } catch (error) {
            console.error("Kunde inte hämta recept:", error);
            setSuccessMsg('❌ Kunde tyvärr inte hämta receptet.');
            setTimeout(() => setSuccessMsg(''), 4000);
        }
        setIsFetching(false);
        setShowScraperFor(null);
      };

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto relative">
          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] rounded-3xl p-6 text-white shadow-lg mb-6 relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-10 blur-2xl"></div>
            <h2 className="text-2xl font-black mb-1 flex items-center gap-3 relative z-10"><Utensils size={24}/> Matsedel</h2>
            <p className="text-white/90 text-sm font-bold mt-1 relative z-10">Planera veckan & hämta ingredienser med AI.</p>
          </div>

          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 border shadow-inner">
             <button onClick={() => setActiveWeek('current')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeWeek === 'current' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>Denna vecka</button>
             <button onClick={() => setActiveWeek('next')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeWeek === 'next' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>Nästa vecka</button>
          </div>

          {successMsg && (
            <div className="bg-[#1D2538] text-white p-4 rounded-2xl mb-5 font-bold text-center text-sm shadow-md animate-in slide-in-from-top-4">
              {successMsg}
            </div>
          )}

          <div className="space-y-4">
            {days.map(day => (
              <div key={day} className="bg-white p-4 rounded-3xl shadow-sm border border-[#1D2538]/5">
                <div className="flex items-center gap-4 mb-3">
                  <span className="font-black text-[#1D2538]/50 w-10 uppercase text-sm">{day}</span>
                  <input 
                    type="text" 
                    value={meals[activeWeek]?.[day]?.title || ''} 
                    onChange={(e) => handleChange(day, 'title', e.target.value)} 
                    placeholder="Vad ska vi äta?" 
                    className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl text-sm font-bold outline-none text-[#1D2538]"
                  />
                </div>
                
                <div className="flex items-center gap-2 pl-14">
                   <input 
                    type="url" 
                    value={meals[activeWeek]?.[day]?.link || ''} 
                    onChange={(e) => handleChange(day, 'link', e.target.value)} 
                    placeholder="Länk till recept (frivilligt)" 
                    className="flex-1 bg-transparent px-2 py-1 text-[11px] font-bold outline-none text-[#E55835] placeholder-[#E55835]/40 border-b border-transparent focus:border-[#E55835]/30"
                  />
                  {meals[activeWeek]?.[day]?.link && (
                    <button onClick={() => setShowScraperFor(showScraperFor === day ? null : day)} className="bg-[#1D2538] text-white text-[10px] font-black px-3 py-1.5 rounded-xl flex items-center gap-1 hover:bg-[#581625] transition-colors shrink-0">
                      <Sparkles size={12}/> AI Köp
                    </button>
                  )}
                </div>

                {/* AI MODAL */}
                {showScraperFor === day && (
                    <div className="mt-4 p-4 bg-[#F7F4EE] rounded-2xl border flex flex-col gap-3">
                        <label className="text-xs font-black text-[#1D2538]/70">Antal portioner:</label>
                        <div className="flex gap-2">
                            {[2,3,4,5,6,8].map(num => (
                                <button key={num} onClick={() => setPortions(num)} className={`w-10 h-10 rounded-xl font-black text-sm flex justify-center items-center ${portions === num ? 'bg-[#E55835] text-white shadow-md' : 'bg-white text-[#1D2538] border'}`}>{num}</button>
                            ))}
                        </div>
                        <div className="flex gap-2 mt-2">
                            <button onClick={() => fetchIngredients(day)} disabled={isFetching} className="flex-1 bg-[#1D2538] text-white py-2.5 rounded-xl text-xs font-black flex justify-center items-center gap-2 disabled:opacity-50">
                                {isFetching ? <Loader2 size={14} className="animate-spin" /> : <ShoppingCart size={14} />}
                                {isFetching ? 'Skapar lista...' : 'Hämta ingredienser'}
                            </button>
                            <button onClick={() => setShowScraperFor(null)} className="px-4 bg-white text-[#1D2538] py-2.5 rounded-xl text-xs font-black border">Avbryt</button>
                        </div>
                    </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- INSTÄLLNINGAR FAMILJ ---
    function SettingsFamily({ members, settings, updateData, setActiveTab }) {
      const [newName, setNewName] = useState('');
      const ROLES = ['Barn', 'Mamma', 'Pappa', 'Annan'];

      const addMember = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        const initialSizes = {};
        const startingCategories = (settings.roleCategories || {})['Barn'] || [];
        startingCategories.forEach(cat => initialSizes[cat] = '');
        
        updateData('members', [...members, { id: generateId(), name: newName.trim(), role: 'Barn', sizes: initialSizes, birthDate: '' }]);
        setNewName('');
      };

      const updateMember = (id, updates) => updateData('members', members.map(m => m.id === id ? { ...m, ...updates } : m));
      const deleteMember = (id) => updateData('members', members.filter(m => m.id !== id));
      const updateSize = (member, sizeKey, sizeValue) => updateMember(member.id, { sizes: { ...(member.sizes || {}), [sizeKey]: sizeValue } });

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>

          <div className="bg-white rounded-3xl shadow-sm border p-5 mb-6">
            <h3 className="font-black text-lg text-[#1D2538] mb-4">Väder (Postnummer & Ort)</h3>
            <div className="flex gap-3">
              <input 
                type="text" placeholder="Postnr" value={settings.weather?.zipcode || ''} 
                onChange={(e) => updateData('settings', { ...settings, weather: { ...settings.weather, zipcode: e.target.value } })}
                className="w-1/3 bg-[#F7F4EE] rounded-2xl px-4 py-3 font-bold text-[#1D2538] outline-none"
              />
              <input 
                type="text" placeholder="Ort" value={settings.weather?.city || ''}
                onChange={(e) => updateData('settings', { ...settings, weather: { ...settings.weather, city: e.target.value } })}
                className="flex-1 bg-[#F7F4EE] rounded-2xl px-4 py-3 font-bold text-[#1D2538] outline-none"
              />
            </div>
          </div>

          <div className="bg-[#1D2538] rounded-3xl p-6 text-white shadow-lg mb-6">
            <h2 className="text-2xl font-black mb-2 flex items-center gap-3"><User size={24} className="text-[#A7CEF6]"/> Familjens profiler</h2>
          </div>
          
          <form onSubmit={addMember} className="flex gap-3 mb-6 bg-white p-2 rounded-3xl border shadow-sm">
            <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Lägg till person..." className="flex-1 bg-transparent px-5 py-3 outline-none font-bold text-[#1D2538]" />
            <button type="submit" disabled={!newName.trim()} className="bg-[#1D2538] text-white px-5 rounded-2xl font-bold">Lägg till</button>
          </form>

          <div className="space-y-5">
            {members.map(member => {
              const role = member.role || 'Barn';
              const activeCategories = settings.roleCategories[role] || [];
              
              return (
                <div key={member.id} className="bg-white rounded-3xl shadow-sm border p-5">
                  <div className="flex justify-between items-center mb-4 pb-4 border-b">
                    <h4 className="font-black text-xl flex items-center gap-3"><span className={`w-10 h-10 rounded-full flex items-center justify-center ${getTagColor(member.name)}`}><User size={20} /></span> {member.name}</h4>
                    <button onClick={() => deleteMember(member.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                  </div>
                  <div className="flex gap-3 mb-4">
                    <div className="flex-1">
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 block ml-1 mb-1">Roll</label>
                      <select value={role} onChange={e => updateMember(member.id, { role: e.target.value })} className="w-full rounded-2xl bg-[#F7F4EE] px-3 py-2.5 outline-none font-bold text-sm">
                        {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                      </select>
                    </div>
                    <div className="flex-1">
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 block ml-1 mb-1">Född (ÅÅÅÅ-MM-DD)</label>
                      <input type="date" value={member.birthDate || ''} onChange={e => updateMember(member.id, { birthDate: e.target.value })} className="w-full rounded-2xl bg-[#F7F4EE] px-3 py-2.5 outline-none font-bold text-sm" />
                    </div>
                  </div>
                  <div className="space-y-2">
                    <p className="text-[10px] font-black uppercase text-[#1D2538]/40 ml-1">Storlekar ({role})</p>
                    {activeCategories.map(key => (
                      <div key={key} className="flex justify-between items-center bg-[#F7F4EE] px-4 py-2 rounded-2xl text-sm">
                        <span className="text-[#1D2538]/60 font-bold w-24">{key}</span>
                        <input type="text" placeholder="..." value={(member.sizes || {})[key] || ''} onChange={e => updateSize(member, key, e.target.value)} className="flex-1 bg-transparent text-right font-black outline-none" />
                      </div>
                    ))}
                  </div>
                </div>
              )
            })}
          </div>
        </div>
      );
    }

    // --- INSTÄLLNINGAR STORLEKSMALLAR ---
    function SettingsSizes({ settings, updateData, setActiveTab }) {
      const [newCategory, setNewCategory] = useState('');
      const [activeRoleTab, setActiveRoleTab] = useState('Barn');
      const ROLES = ['Barn', 'Mamma', 'Pappa', 'Annan'];

      const addCategory = (e) => {
        e.preventDefault();
        if (!newCategory.trim()) return;
        const cats = settings.roleCategories[activeRoleTab] || [];
        if (cats.includes(newCategory.trim())) return;
        
        updateData('settings', { ...settings, roleCategories: { ...settings.roleCategories, [activeRoleTab]: [...cats, newCategory.trim()] }});
        setNewCategory('');
      };

      const removeCategory = (cat) => {
        const cats = settings.roleCategories[activeRoleTab] || [];
        updateData('settings', { ...settings, roleCategories: { ...settings.roleCategories, [activeRoleTab]: cats.filter(c => c !== cat) }});
      };

      const activeCats = settings.roleCategories[activeRoleTab] || [];

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
           <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
           <div className="bg-[#4B88C4] rounded-3xl p-6 text-white shadow-lg mb-6">
             <h2 className="text-2xl font-black mb-2 flex items-center gap-3"><Ruler size={24}/> Storleksmallar</h2>
             <p className="text-white/80 text-sm">Bestäm vilka fält som finns tillgängliga för olika roller.</p>
           </div>
           <div className="bg-white rounded-3xl shadow-sm p-5 border">
             <div className="flex bg-[#F7F4EE] rounded-xl p-1 mb-5">
               {ROLES.map(r => <button key={r} onClick={() => setActiveRoleTab(r)} className={`flex-1 py-1.5 text-xs font-bold rounded-lg ${activeRoleTab === r ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>{r}</button>)}
             </div>
             <div className="flex flex-wrap gap-2 mb-5">
               {activeCats.map(cat => (
                 <div key={cat} className="flex items-center gap-1 bg-[#1D2538]/5 px-3 py-1.5 rounded-xl text-xs font-bold text-[#1D2538]">
                   {cat} <button onClick={() => removeCategory(cat)} className="text-[#E55835] ml-1"><X size={14}/></button>
                 </div>
               ))}
             </div>
             <form onSubmit={addCategory} className="flex gap-2">
               <input value={newCategory} onChange={e => setNewCategory(e.target.value)} placeholder={`Ny kategori till ${activeRoleTab}...`} className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl text-sm font-bold outline-none" />
               <button type="submit" disabled={!newCategory.trim()} className="bg-[#1D2538] text-white px-5 rounded-2xl font-bold">Lägg till</button>
             </form>
           </div>
        </div>
      );
    }

    // --- HÄLSOLOGG ---
    function HealthTracker({ logs, updateData, setActiveTab }) {
      const [mood, setMood] = useState('Bra');
      const [bleeding, setBleeding] = useState('Nej');

      const addLog = (e) => {
        e.preventDefault();
        const today = getLocalToday();
        const filteredLogs = logs.filter(l => l.date !== today);
        updateData('healthLogs', [{ id: generateId(), date: today, mood, bleeding }, ...filteredLogs]);
      };

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          <button onClick={() => setActiveTab('menu')} className="mb-4 text-[#1D2538]/50 font-bold text-sm flex items-center gap-1 hover:text-[#1D2538]"><ChevronDown className="rotate-90" size={16}/> Tillbaka</button>
          
          <div className="bg-[#F2C4C4] rounded-3xl p-6 text-[#581625] shadow-lg mb-6">
             <h2 className="text-2xl font-black mb-1 flex items-center gap-3"><HeartPulse size={24}/> Dagsform & Cykel</h2>
             <p className="text-[#581625]/80 text-sm font-bold mt-2">Logga hur du mår för att följa ditt mönster över tid.</p>
          </div>

          <form onSubmit={addLog} className="bg-white p-5 rounded-3xl shadow-sm border mb-8">
            <h3 className="font-black text-lg text-[#1D2538] mb-4">Logga för idag</h3>
            <div className="flex gap-4 mb-5">
              <div className="flex-1">
                <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1.5 block">Mående</label>
                <select value={mood} onChange={e => setMood(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none">
                  <option>Toppen</option><option>Bra</option><option>Helt okej</option><option>Stressad</option><option>Låg</option>
                </select>
              </div>
              <div className="flex-1">
                <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1.5 block">Mens/Blödning</label>
                <select value={bleeding} onChange={e => setBleeding(e.target.value)} className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-[#1D2538] outline-none">
                  <option>Nej</option><option>Ja, Lätt</option><option>Ja, Normal</option><option>Ja, Kraftig</option>
                </select>
              </div>
            </div>
            <button type="submit" className="w-full bg-[#581625] text-white py-3.5 rounded-2xl font-black shadow-md">Spara logg</button>
          </form>

          <div>
            <h3 className="font-black text-xl text-[#1D2538] mb-4">Historik</h3>
            {logs.length === 0 ? (
              <div className="bg-white/50 rounded-3xl p-6 text-center border">
                <p className="text-[#1D2538]/40 font-bold text-sm">Ingen historik än.</p>
              </div>
            ) : (
              <div className="space-y-3">
                {logs.map(log => (
                  <div key={log.id} className="bg-white p-4 rounded-3xl shadow-sm border flex justify-between items-center">
                    <div>
                      <h4 className="font-black text-[#1D2538] text-base">{log.date}</h4>
                      <p className="text-xs font-bold text-[#1D2538]/50 mt-1">Blödning: <span className={log.bleeding !== 'Nej' ? 'text-[#E55835]' : ''}>{log.bleeding}</span></p>
                    </div>
                    <span className="bg-[#F7F4EE] text-[#1D2538] text-xs font-black px-3 py-1.5 rounded-xl">{log.mood}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- HUB/MENY ---
    function Menu({ setActiveTab }) {
      const items = [
        { id: 'todo', title: 'Att göra', desc: 'Uppgifter och ansvarsområden', icon: <CheckSquare size={28} />, color: 'text-[#E55835]', bg: 'bg-[#E55835]/10' },
        { id: 'health', title: 'Hälsologg', desc: 'Följ cykel och mående', icon: <HeartPulse size={28} />, color: 'text-[#581625]', bg: 'bg-[#F2C4C4]' },
        { id: 'settings_family', title: 'Familj & Inställningar', desc: 'Profiler och väder', icon: <User size={28} />, color: 'text-[#1D2538]', bg: 'bg-[#1D2538]/10' },
        { id: 'settings_sizes', title: 'Storleksmallar', desc: 'Skräddarsy klädkategorier', icon: <Ruler size={28} />, color: 'text-[#2B5B84]', bg: 'bg-[#A7CEF6]/20' },
      ];
      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-4">
          <h2 className="text-2xl font-black text-[#1D2538] mb-4">Utforska</h2>
          {items.map(item => (
            <button key={item.id} onClick={() => setActiveTab(item.id)} className="w-full bg-white p-5 rounded-3xl shadow-sm border flex items-center gap-5 text-left">
              <div className={`${item.bg} ${item.color} p-4 rounded-2xl`}>{item.icon}</div>
              <div>
                <h3 className="font-black text-[#1D2538] text-lg">{item.title}</h3>
                <p className="text-sm font-bold text-[#1D2538]/50">{item.desc}</p>
              </div>
            </button>
          ))}
        </div>
      )
    }

    // --- HUVUDKOMPONENT ---
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => { setUser(currentUser); setAuthLoading(false); });
        return () => unsubscribe();
      }, []);

      const [data, updateData, loadingData] = useAppSync(user);

      if (authLoading || (user && loadingData)) return <div className="flex flex-col h-screen items-center justify-center bg-[#F7F4EE]"><Loader2 size={40} className="animate-spin text-[#581625] mb-4" /><p className="font-bold text-[#1D2538]/50">Laddar familjehubben...</p></div>;
      if (!user) return <LoginScreen />;

      const renderContent = () => {
        switch (activeTab) {
          case 'dashboard': return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} meals={data.meals} />;
          case 'shopping': return <ShoppingList items={data.shoppingItems} groceries={data.groceries} members={data.members} settings={data.settings} updateData={updateData} />;
          case 'calendar': return <Calendar events={data.events} members={data.members} updateData={updateData} />;
          case 'todo': return <TodoList todos={data.todos} members={data.members} updateData={updateData} />;
          case 'menu': return <Menu setActiveTab={setActiveTab} />;
          case 'meals': return <MealPlanner meals={data.meals} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'settings_family': return <SettingsFamily members={data.members} settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'settings_sizes': return <SettingsSizes settings={data.settings} updateData={updateData} setActiveTab={setActiveTab} />;
          case 'health': return <HealthTracker logs={data.healthLogs} updateData={updateData} setActiveTab={setActiveTab} />;
          default: return <Dashboard events={data.events} todos={data.todos} shoppingItems={data.shoppingItems} healthLogs={data.healthLogs} weatherConfig={data.settings.weather} setActiveTab={setActiveTab} members={data.members} meals={data.meals} />;
        }
      };

      const getHeaderTitle = () => ({ dashboard:'Familjehubb', shopping:'Inköp', calendar:'Kalender', todo:'Att göra', menu:'Meny', meals:'Matsedel', settings_family:'Inställningar', settings_sizes:'Kategorier', health:'Hälsologg' })[activeTab] || 'Familjehubb';

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto bg-[#F7F4EE] relative overflow-hidden font-sans">
          <header className="bg-gradient-to-r from-[#581625] to-[#731E32] px-6 py-5 shadow-md z-10 flex justify-center items-end h-20 rounded-b-3xl shrink-0"><h1 className="text-xl font-black text-[#F7F4EE] tracking-widest uppercase opacity-90">{getHeaderTitle()}</h1></header>
          <main className="flex-1 overflow-hidden relative">{renderContent()}</main>
          <div className="absolute bottom-6 left-2 right-2 z-20 pointer-events-none">
            <nav className="pointer-events-auto bg-white/90 backdrop-blur-xl border border-white/40 shadow-xl rounded-3xl mx-auto overflow-hidden">
              <div className="flex justify-between items-center px-2 py-2">
                <NavItem icon={<Home />} label="Start" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                <NavItem icon={<Utensils />} label="Mat" isActive={activeTab === 'meals'} onClick={() => setActiveTab('meals')} />
                <NavItem icon={<ShoppingCart />} label="Inköp" isActive={activeTab === 'shopping'} onClick={() => setActiveTab('shopping')} />
                <NavItem icon={<CalendarIcon />} label="Kalender" isActive={activeTab === 'calendar'} onClick={() => setActiveTab('calendar')} />
                <NavItem icon={<Grid />} label="Mer" isActive={['menu', 'settings_family', 'settings_sizes', 'health', 'todo'].includes(activeTab)} onClick={() => setActiveTab('menu')} />
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
