<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Familjehubb</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=FH&background=E55835&color=fff&size=180">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>tailwind.config = { theme: { extend: {} } }</script>
  
  <style>
    body { background-color: #F7F4EE; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .animate-bounce-short { animation: bounce-short 0.3s ease-in-out 1; }
    @keyframes bounce-short { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10%); } }
  </style>

  <!-- Fångar fel för att undvika vit skärm -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett fel uppstod vid inläsning</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + msg + '</div></div>';
      return false;
    };
    window.onunhandledrejection = function(event) {
      document.body.innerHTML = '<div style="padding:30px; font-family:sans-serif; background:#F7F4EE; height:100vh;">' +
        '<h2 style="color:#E55835; font-weight:900;">Ett nätverksfel uppstod</h2>' +
        '<p style="color:#1D2538; font-weight:bold;">Kopiera detta och skicka till AI:n:</p>' +
        '<div style="background:#fff; padding:15px; border-radius:10px; margin-top:10px; font-family:monospace; font-size:12px; border:1px solid #ddd;">' + event.reason + '</div></div>';
    };
  </script>

  <!-- Garanterar att koden inte krockar -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.294.0?external=react"
    }
  }
  </script>
</head>
<body>
  <div id="root">
      <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column;">
          <div style="border: 4px solid rgba(0,0,0,0.1); border-left-color: #581625; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
          <p style="margin-top:20px; font-family:sans-serif; font-weight:bold; color:#1D2538;">Laddar familjehubben...</p>
      </div>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Home, ShoppingCart, CheckSquare, Calendar as CalendarIcon, Grid, Plus, Trash2, Edit3, HeartPulse, User, Ruler, ChevronDown, Wind, Thermometer, Droplets, CloudRain, Check, X, Clock, Utensils, Sparkles, Loader2, Copy, LogOut, Sun, Cloud, CloudFog, CloudSnow, CloudLightning, Baby } from 'lucide-react';
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- DIN FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAOt0D6sBEyatAAX4ZG2Vc26TQRIoJMCzU",
      authDomain: "familjehubben-9d06d.firebaseapp.com",
      projectId: "familjehubben-9d06d",
      storageBucket: "familjehubben-9d06d.firebasestorage.app",
      messagingSenderId: "1041803591024",
      appId: "1:1041803591024:web:47a8d91c7bb49747f4e3b5",
      measurementId: "G-W44NJKDYWR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const generateId = () => Math.random().toString(36).substr(2, 9);
    
    const getTagColor = (name) => {
      if (!name) return 'bg-[#1D2538] text-white';
      const colors = ['bg-[#E55835] text-white', 'bg-[#A7CEF6] text-[#1D2538]', 'bg-[#F2C4C4] text-[#581625]', 'bg-[#581625] text-white'];
      let hash = 0; 
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    };
    
    const getLocalToday = () => { 
        const d = new Date(); 
        return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0]; 
    };
    
    const getLocalDayName = (dateString) => { 
        if (!dateString) return ''; 
        const d = new Date(dateString + 'T12:00:00'); 
        return ['Sön','Mån','Tis','Ons','Tors','Fre','Lör'][d.getDay()]; 
    };

    function useAppSync(user) {
      const initialData = {
        members: [
          { id: generateId(), name: 'Mamma', role: 'Mamma', sizes: { 'Skor': '38', 'Tröja': 'M' } },
          { id: generateId(), name: 'Pappa', role: 'Pappa', sizes: { 'Skor': '43', 'Skjorta': 'L' } },
          { id: generateId(), name: 'Barn', role: 'Barn', sizes: { 'Skor': '34', 'Ytterplagg': '134' }, birthDate: '2015-05-10' }
        ],
        shoppingItems: [], groceries: [], todos: [], events: [], healthLogs: [],
        meals: {
            current: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} },
            next: { 'Mån': {}, 'Tis': {}, 'Ons': {}, 'Tors': {}, 'Fre': {}, 'Lör': {}, 'Sön': {} }
        },
        settings: { 
            weather: { zipcode: '111 22', city: 'Stockholm' }, 
            roleCategories: { 'Barn': ['Skor', 'Ytterplagg', 'Kläder'], 'Mamma': ['Skor', 'Tröja', 'Byxor'], 'Pappa': ['Skor', 'Skjorta'], 'Annan': ['Skor'] },
            cycleTrackerMemberId: '' // Vem som spåras i cykelkollen
        }
      };

      const [data, setData] = useState(initialData);
      const [loadingData, setLoadingData] = useState(true);

      useEffect(() => {
        if (!user || !db) return;
        const docRef = doc(db, 'users', user.uid);
        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const fetched = docSnap.data();
            if(!fetched.groceries) fetched.groceries = [];
            if(!fetched.meals) fetched.meals = initialData.meals;
            if(!fetched.settings) fetched.settings = initialData.settings;
            if(!fetched.settings.cycleTrackerMemberId) fetched.settings.cycleTrackerMemberId = '';
            setData(fetched);
          } else {
            setDoc(docRef, initialData).catch(e => console.error("Skapandefel:", e));
            setData(initialData);
          }
          setLoadingData(false);
        }, (err) => {
            console.error("Fel vid hämtning av data.", err);
            alert("Kunde inte hämta data från Firebase. Har du satt databasens Rules till true?");
        });
        return () => unsubscribe();
      }, [user]);

      const updateData = (key, newData) => {
        setData(prev => {
          const updatedVal = typeof newData === 'function' ? newData(prev[key]) : newData;
          if (user && db) setDoc(doc(db, 'users', user.uid), { [key]: updatedVal }, { merge: true });
          return { ...prev, [key]: updatedVal };
        });
      };

      return [data, updateData, loadingData];
    }

    function LoginScreen() {
      const [email, setEmail] = useState(''); 
      const [password, setPassword] = useState(''); 
      const [isRegistering, setIsRegistering] = useState(false); 
      const [error, setError] = useState(''); 
      const [loading, setLoading] = useState(false);
      
      const handleSubmit = async (e) => {
        e.preventDefault(); 
        setError(''); 
        setLoading(true);
        try { 
            if (isRegistering) { 
                await createUserWithEmailAndPassword(auth, email, password); 
            } else { 
                await signInWithEmailAndPassword(auth, email, password); 
            } 
        } catch (err) { 
            if (err.code === 'auth/email-already-in-use') setError('E-postadressen används redan. Logga in istället!');
            else if (err.code === 'auth/weak-password') setError('Lösenordet är för kort. Det måste vara minst 6 tecken.');
            else if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') setError('Fel e-post eller lösenord.');
            else setError('Något gick snett (' + err.code + '). Kontrollera uppgifterna.');
        }
        setLoading(false);
      };

      return (
        <div className="flex flex-col items-center justify-center h-screen bg-[#F7F4EE] p-6">
          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] p-6 rounded-[2rem] w-full max-w-sm text-white shadow-2xl mb-8 relative overflow-hidden">
             <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
             <Home size={40} className="mb-4 relative z-10" />
             <h1 className="text-4xl font-black relative z-10 tracking-tight">Familjehubb</h1>
             <p className="font-bold text-white/80 mt-2 relative z-10">Logga in för att synka familjens vardag.</p>
          </div>
          <form onSubmit={handleSubmit} className="w-full max-w-sm bg-white p-6 rounded-[2rem] shadow-sm border border-[#1D2538]/5">
            <h2 className="text-xl font-black text-[#1D2538] mb-5">{isRegistering ? 'Skapa Familjekonto' : 'Logga in'}</h2>
            {error && <div className="bg-[#F2C4C4] text-[#581625] p-3 rounded-xl text-sm font-bold mb-4">{error}</div>}
            
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Gemensam E-post</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" />
            
            <label className="text-[10px] font-black uppercase text-[#1D2538]/50 mb-1 ml-1 block">Gemensamt Lösenord (Minst 6 tecken)</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} required className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-6" />
            
            <button type="submit" disabled={loading} className="w-full bg-[#1D2538] text-white py-3.5 rounded-2xl font-black shadow-md flex justify-center items-center gap-2">
                {loading && <Loader2 size={16} className="animate-spin" />} 
                {isRegistering ? 'Skapa konto' : 'Logga in'}
            </button>
            <button type="button" onClick={() => {setIsRegistering(!isRegistering); setError('');}} className="w-full text-center mt-4 text-sm font-bold text-[#1D2538]/60 hover:text-[#1D2538]">
                {isRegistering ? 'Har ni redan ett konto? Logga in' : 'Inget konto? Skapa ett här'}
            </button>
          </form>
        </div>
      );
    }

    function NavItem({ icon, label, isActive, onClick }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-16 h-14 rounded-2xl transition-all duration-300 ${isActive ? 'bg-[#581625] text-[#F7F4EE] shadow-md scale-105' : 'text-[#1D2538]/50 hover:bg-[#1D2538]/5'}`}>
          {React.cloneElement(icon, { size: isActive ? 24 : 22, className: isActive ? 'animate-bounce-short' : '' })}
          <span className={`text-[10px] font-black mt-1 ${isActive ? 'opacity-100' : 'opacity-0 h-0 overflow-hidden'}`}>{label}</span>
        </button>
      );
    }

    // --- DASHBOARD ---
    function Dashboard({ events, todos, shoppingItems, healthLogs, weatherConfig, setActiveTab, members, meals, localProfileId, onEditItem }) {
      const today = getLocalToday();
      const upcomingEvents = events.filter(e => e.fromDate >= today).sort((a, b) => { 
          if (a.fromDate !== b.fromDate) return a.fromDate.localeCompare(b.fromDate); 
          return (a.fromTime || '00:00').localeCompare(b.fromTime || '00:00'); 
      });
      const activeTodos = todos.filter(t => !t.completed); 
      const activeShopping = shoppingItems.filter(i => !i.completed);
      
      const dayIndex = new Date().getDay(); 
      const daysArr = ['Sön', 'Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör']; 
      const todaysMeal = meals?.current?.[daysArr[dayIndex]];

      // Real Weather Fetching
      const [realWeather, setRealWeather] = useState(null);
      const [weatherTip, setWeatherTip] = useState('Laddar väder...');
      const [tomorrowWeather, setTomorrowWeather] = useState(null);

      useEffect(() => {
        const fetchWeather = async () => {
          try {
            const city = weatherConfig?.city || 'Stockholm';
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=sv`);
            const geoData = await geoRes.json();
            if (!geoData.results?.length) return;
            const { latitude, longitude } = geoData.results[0];

            // Fetching 2 days (today and tomorrow)
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=2`);
            const weatherData = await weatherRes.json();

            const getWeatherIcon = (code) => {
                if (code === 0) return <Sun size={22} />;
                if (code > 0 && code <= 3) return <Cloud size={22} />;
                if (code === 45 || code === 48) return <CloudFog size={22} />;
                if (code >= 51 && code <= 67) return <CloudRain size={22} />;
                if (code >= 71 && code <= 77) return <CloudSnow size={22} />;
                if (code >= 95) return <CloudLightning size={22} />;
                return <Cloud size={22} />;
            };

            // Today's hours: 09:00 (Fm), 12:00 (Lunch), 15:00 (Em), 19:00 (Kväll)
            const times = [9, 12, 15, 19];
            const labels = ['Fm', 'Lunch', 'Em', 'Kväll'];
            
            const todayMapped = times.map((hour, idx) => {
                const temp = Math.round(weatherData.hourly.temperature_2m[hour]);
                const code = weatherData.hourly.weather_code[hour];
                return { time: labels[idx], temp: `${temp}°`, code: code, icon: getWeatherIcon(code) };
            });
            setRealWeather(todayMapped);

            // Tomorrow's hours (add 24 to index)
            const tomorrowMapped = times.map((hour, idx) => {
                const h = hour + 24;
                const temp = Math.round(weatherData.hourly.temperature_2m[h]);
                const code = weatherData.hourly.weather_code[h];
                return { time: labels[idx], temp: `${temp}°`, icon: getWeatherIcon(code) };
            });
            setTomorrowWeather(tomorrowMapped);

            // Generate child-friendly tip based on today's worst weather code
            const maxCode = Math.max(...todayMapped.map(w => w.code));
            const minTemp = Math.min(...todayMapped.map(w => parseInt(w.temp)));
            const maxTemp = Math.max(...todayMapped.map(w => parseInt(w.temp)));

            if (maxCode >= 51 && maxCode <= 67) setWeatherTip("Väderprognosen skvallrar om regn! ☔ Fram med galonisar och paraply.");
            else if (maxCode >= 71 && maxCode <= 77) setWeatherTip("Snö på ingång! ❄️ Varma termobyxor och pulka rekommenderas.");
            else if (minTemp < 5) setWeatherTip("Brrr, riktigt kyligt idag! 🧣 Glöm inte mössa och tjocka vantar på barnen.");
            else if (maxTemp > 20 && maxCode <= 3) setWeatherTip("Härligt väder! ☀️ Smörj in solkräm och ta med vattenflaskan.");
            else setWeatherTip("Bra väder för lek utomhus! ☁️ En helt vanlig jacka funkar perfekt.");

          } catch (e) {
            console.error("Väderfel:", e);
            setWeatherTip("Kunde inte hämta prognos.");
          }
        };
        fetchWeather();
      }, [weatherConfig?.city]);

      const weatherDisplay = realWeather || [
          { time: 'Fm', temp: '--', icon: <Cloud size={22}/> }, { time: 'Lunch', temp: '--', icon: <Cloud size={22}/> }, 
          { time: 'Em', temp: '--', icon: <Cloud size={22}/> }, { time: 'Kväll', temp: '--', icon: <Cloud size={22}/> }
      ];

      const localUser = members.find(m => m.id === localProfileId);

      return (
        <div className="p-5 pb-32 h-full overflow-y-auto space-y-6">
          
          {/* Personlig hälsning */}
          {localUser && (
              <h2 className="text-xl font-black text-[#1D2538] mt-2 mb-[-10px]">Hej {localUser.name}! 👋</h2>
          )}

          {/* Väder & Familjetips */}
          <div className="bg-gradient-to-br from-[#A7CEF6] to-[#4B88C4] rounded-[2rem] p-5 text-white shadow-xl relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-20 blur-3xl"></div>
            <div className="flex justify-between items-center mb-5 relative z-10">
                <div>
                    <h3 className="text-3xl font-black tracking-tight">{weatherConfig?.city || weatherConfig?.zipcode || 'Ställ in ort'}</h3>
                    <p className="text-white/90 font-bold text-sm opacity-80">Prognos idag</p>
                </div>
                <div className="bg-white/20 p-3.5 rounded-2xl backdrop-blur-md shadow-inner"><Wind size={28} /></div>
            </div>
            
            <div className="flex justify-between bg-white/20 rounded-2xl p-4 backdrop-blur-md relative z-10 shadow-sm mb-3">
              {weatherDisplay.map((w, i) => (
                  <div key={i} className="flex flex-col items-center gap-2">
                      <span className="text-[11px] font-black uppercase tracking-wider text-white/80">{w.time}</span>
                      {w.icon}
                      <span className="font-black text-base">{w.temp}</span>
                  </div>
              ))}
            </div>
            
            {/* Familjevänligt Tips */}
            <div className="bg-white/20 rounded-xl p-3 backdrop-blur-md relative z-10 shadow-sm mb-3 text-sm font-bold">
                💡 {weatherTip}
            </div>

            {/* Morgondagen */}
            {tomorrowWeather && (
                <div className="bg-white/10 rounded-xl px-3 py-2 backdrop-blur-md relative z-10 flex justify-between items-center text-xs font-bold">
                    <span className="opacity-80 uppercase tracking-widest">Imorgon:</span>
                    <div className="flex gap-4">
                        <span className="flex items-center gap-1">{tomorrowWeather[0].icon} {tomorrowWeather[0].temp}</span>
                        <span className="flex items-center gap-1 opacity-70">L: {tomorrowWeather[1].icon} {tomorrowWeather[1].temp}</span>
                    </div>
                </div>
            )}
          </div>

          {/* Dagens mat */}
          {todaysMeal?.title && (
            <div onClick={() => setActiveTab('meals')} className="bg-gradient-to-r from-[#E55835] to-[#f07b5d] rounded-3xl p-5 text-white shadow-sm border border-[#E55835]/20 cursor-pointer flex justify-between items-center transition-transform active:scale-95">
              <div>
                  <h4 className="font-bold text-white/80 text-xs uppercase tracking-widest mb-1">Dagens Middag</h4>
                  <p className="font-black text-xl">{todaysMeal.title}</p>
              </div>
              <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-md shadow-inner"><Utensils size={24} /></div>
            </div>
          )}

          {/* Kalender */}
          <div>
            <div className="flex justify-between items-end mb-4">
                <h2 className="text-2xl font-black text-[#1D2538]">På schemat</h2>
                <button onClick={() => setActiveTab('calendar')} className="text-sm font-bold text-[#E55835] bg-[#E55835]/10 px-3 py-1 rounded-xl">Se alla</button>
            </div>
            <div className="space-y-3">
              {upcomingEvents.length === 0 ? (
                  <div className="bg-white rounded-3xl p-6 text-center border"><p className="text-[#1D2538]/50 font-bold text-sm">Inga kommande händelser inlagda.</p></div>
              ) : (
                upcomingEvents.slice(0, 3).map(event => {
                  const isToday = event.fromDate === today; 
                  const appliesTo = members.find(m => m.id === event.appliesToId); 
                  const responsible = members.find(m => m.id === event.responsibleId);
                  const amIResponsible = localProfileId && event.responsibleId === localProfileId;

                  return (
                    <div key={event.id} onClick={() => onEditItem('calendar', event.id)} className={`cursor-pointer transition-transform active:scale-95 bg-white rounded-3xl p-4 shadow-sm border-l-4 ${isToday ? 'border-l-[#E55835]' : 'border-l-[#1D2538]/30'} ${amIResponsible ? 'border-r-4 border-r-[#581625] bg-[#581625]/5' : ''} border-y border-r flex gap-4 items-center`}>
                      <div className={`flex flex-col items-center justify-center rounded-2xl px-2 py-2 min-w-[70px] ${isToday ? 'bg-[#E55835]/10 text-[#E55835]' : 'bg-[#F7F4EE] text-[#1D2538]/50'}`}>
                          <span className="text-xs font-black">{isToday ? 'IDAG' : event.fromDate.substring(5)}</span>
                          <span className="text-[10px] font-bold mt-0.5">{event.fromTime || 'Heldag'}</span>
                      </div>
                      <div className="flex-1 py-1">
                          <h4 className="font-black text-[#1D2538] text-base leading-tight mb-2">{event.title}</h4>
                          <div className="flex flex-wrap gap-1.5">
                              {appliesTo && <span className={`text-[9px] font-bold px-2 py-0.5 rounded-md ${getTagColor(appliesTo.name)}`}>För: {appliesTo.name}</span>}
                              {responsible && <span className={`text-[9px] font-bold px-2 py-0.5 rounded-md ${amIResponsible ? 'bg-[#581625] text-white' : 'bg-[#F7F4EE]'}`}>Ansvar: {amIResponsible ? 'Du' : responsible.name}</span>}
                          </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
          
          {/* Snabblänkar (Inköp & Att göra som fullbreddskort) */}
          <div className="space-y-4 mt-6">
            
            <div className="bg-white rounded-3xl p-5 shadow-sm border">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="font-black text-[#1D2538] text-xl">Inköp (Övrigt)</h3>
                    <span className="bg-[#E55835] text-white text-xs font-black px-3 py-1 rounded-full">{activeShopping.length}</span>
                </div>
                <div className="space-y-3">
                    {activeShopping.slice(0, 3).map(i => {
                        const targetMember = members.find(m => m.id === i.memberId);
                        return (
                            <div key={i.id} onClick={() => onEditItem('shopping', i.id)} className="bg-[#F7F4EE] p-3 rounded-2xl cursor-pointer hover:bg-[#E55835]/10 transition-colors">
                                <div className="font-black text-[#1D2538] text-sm">
                                    {i.title} {targetMember ? <span className="text-[#E55835] font-bold">- {targetMember.name}</span> : ''}
                                </div>
                                {i.details && <div className="text-xs font-bold text-[#1D2538]/50 mt-1">{i.details}</div>}
                            </div>
                        )
                    })}
                    {activeShopping.length === 0 && <p className="text-sm font-bold text-[#1D2538]/40">Inget på listan.</p>}
                </div>
                <button onClick={() => setActiveTab('shopping')} className="w-full mt-4 text-xs font-bold text-[#E55835] bg-[#E55835]/10 py-2 rounded-xl">Hantera alla inköp</button>
            </div>
            
            <div className="bg-white rounded-3xl p-5 shadow-sm border">
                <div className="flex justify-between items-center mb-4">
                    <h3 className="font-black text-[#1D2538] text-xl">Att göra</h3>
                    <span className="bg-[#1D2538] text-white text-xs font-black px-3 py-1 rounded-full">{activeTodos.length}</span>
                </div>
                <div className="space-y-3">
                    {activeTodos.slice(0, 3).map(t => {
                        const isMyTodo = localProfileId && t.memberId === localProfileId;
                        const targetMember = members.find(m => m.id === t.memberId);
                        return (
                            <div key={t.id} onClick={() => onEditItem('todo', t.id)} className={`p-3 rounded-2xl cursor-pointer transition-colors ${isMyTodo ? 'bg-[#581625]/5 border border-[#581625]/20' : 'bg-[#F7F4EE]'}`}>
                                <div className={`font-black text-sm ${isMyTodo ? 'text-[#581625]' : 'text-[#1D2538]'}`}>
                                    {t.title} {targetMember ? <span className="text-xs opacity-60 ml-1">- {targetMember.name}</span> : ''}
                                </div>
                                {t.notes && <div className="text-xs font-bold text-[#1D2538]/50 mt-1">{t.notes}</div>}
                            </div>
                        )
                    })}
                    {activeTodos.length === 0 && <p className="text-sm font-bold text-[#1D2538]/40">Inga uppgifter.</p>}
                </div>
                <button onClick={() => setActiveTab('todo')} className="w-full mt-4 text-xs font-bold text-[#1D2538] bg-[#1D2538]/10 py-2 rounded-xl">Hantera alla uppgifter</button>
            </div>

          </div>
        </div>
      );
    }

    // --- INKÖPSLISTA ---
    function ShoppingList({ items, groceries = [], members, settings, updateData, editItemId, setEditItemId }) {
      const [activeTab, setActiveTab] = useState('food'); 
      const [copyStatus, setCopyStatus] = useState('');
      
      const [title, setTitle] = useState(''); 
      const [selectedMember, setSelectedMember] = useState(''); 
      const [category, setCategory] = useState(''); 
      const [details, setDetails] = useState(''); 
      const [link, setLink] = useState(''); 
      const [buyerId, setBuyerId] = useState(''); 
      const [isExpanded, setIsExpanded] = useState(false); 
      const [editingId, setEditingId] = useState(null);
      
      const activeItems = items.filter(i => !i.completed); 
      const completedItems = items.filter(i => i.completed);
      const activeGroceries = groceries.filter(i => !i.completed);
      const completedGroceries = groceries.filter(i => i.completed);

      const activeMember = members.find(m => m.id === selectedMember);
      const availableCategories = activeMember ? (settings.roleCategories[activeMember.role] || []) : [];

      // Auto-öppna editering om man klickat på startsidan
      useEffect(() => {
          if (editItemId) {
              const itemToEdit = items.find(i => i.id === editItemId);
              if (itemToEdit) {
                  setActiveTab('general');
                  editItem(itemToEdit);
                  setEditItemId(null); // Rensa så den inte loopar
              }
          }
      }, [editItemId]);

      const handleCategoryChange = (e) => {
        const selectedCat = e.target.value;
        setCategory(selectedCat);
        if (activeMember && activeMember.sizes && activeMember.sizes[selectedCat]) {
          setDetails(activeMember.sizes[selectedCat]);
        }
      };

      const handleSave = (e) => { 
          e.preventDefault(); 
          if (!title.trim()) return; 
          
          if (editingId) { 
              updateData('shoppingItems', items.map(item => item.id === editingId ? { ...item, title, memberId: selectedMember, buyerId, category, details, link } : item)); 
              setEditingId(null); 
          } else { 
              updateData('shoppingItems', [...items, { id: generateId(), title, memberId: selectedMember, buyerId, category, details, link, completed: false }]); 
          } 
          resetForm(); 
      };
      
      const editItem = (item) => { 
          setTitle(item.title); setSelectedMember(item.memberId || ''); setBuyerId(item.buyerId || ''); setCategory(item.category || ''); setDetails(item.details || ''); setLink(item.link || ''); setEditingId(item.id); setIsExpanded(true); 
      };
      
      const toggleComplete = (id) => updateData('shoppingItems', items.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const deleteItem = (id) => updateData('shoppingItems', items.filter(i => i.id !== id));
      const resetForm = () => { setTitle(''); setSelectedMember(''); setBuyerId(''); setCategory(''); setDetails(''); setLink(''); setIsExpanded(false); setEditingId(null); };

      const [groceryAmount, setGroceryAmount] = useState(''); 
      const [groceryItem, setGroceryItem] = useState(''); 
      const [groceryEditingId, setGroceryEditingId] = useState(null);
      
      const handleGrocerySave = (e) => { 
          e.preventDefault(); 
          if (!groceryItem.trim()) return; 
          if (groceryEditingId) { 
              updateData('groceries', groceries.map(item => item.id === groceryEditingId ? { ...item, amount: groceryAmount, title: groceryItem } : item)); 
              setGroceryEditingId(null); 
          } else { 
              updateData('groceries', [...groceries, { id: generateId(), amount: groceryAmount, title: groceryItem, completed: false }]); 
          } 
          setGroceryAmount(''); setGroceryItem(''); 
      };
      
      const editGrocery = (item) => { 
          setGroceryAmount(item.amount || ''); setGroceryItem(item.title); setGroceryEditingId(item.id); 
      };
      
      const toggleGroceryComplete = (id) => updateData('groceries', groceries.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const deleteGrocery = (id) => updateData('groceries', groceries.filter(i => i.id !== id));

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 shadow-inner">
              <button onClick={() => {setActiveTab('food'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'food' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>🍎 Matvaror</button>
              <button onClick={() => {setActiveTab('general'); resetForm();}} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeTab === 'general' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>🛍️ Övrigt</button>
          </div>
          
          {activeTab === 'general' ? (
              <>
                <form onSubmit={handleSave} className={`bg-white rounded-3xl shadow-sm border p-4 mb-6 ${editingId ? 'ring-2 ring-[#E55835] bg-[#E55835]/5' : ''}`}>
                    <h3 className="text-xs font-black uppercase text-[#1D2538]/40 mb-3">{editingId ? 'Ändrar inköp...' : 'Nytt inköp'}</h3>
                    <div className="flex gap-2 mb-2">
                        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad ska inhandlas? (t.ex. Stövlar)" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none" />
                        <button type="submit" disabled={!title.trim()} className="bg-[#581625] text-white px-5 rounded-2xl font-bold disabled:opacity-50">{editingId ? 'Spara' : 'Lägg till'}</button>
                    </div>
                    {/* Fritext-fält (Detaljer) visas alltid om man expanderat */}
                    {isExpanded ? (
                        <div className="space-y-3 mt-3 animate-in slide-in-from-top-2">
                            <input value={details} onChange={e => setDetails(e.target.value)} placeholder="Fritext: Mer information, färg, storlek..." className="w-full bg-[#F7F4EE] rounded-xl px-4 py-3 font-bold text-sm outline-none" />
                            
                            <div className="flex gap-3">
                                <select value={selectedMember} onChange={e => { setSelectedMember(e.target.value); setCategory(''); }} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none appearance-none">
                                    <option value="">För vem?</option>
                                    {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                </select>
                                <select value={buyerId} onChange={e => setBuyerId(e.target.value)} className="flex-1 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none appearance-none">
                                    <option value="">Vem köper?</option>
                                    {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                                </select>
                            </div>
                            <div className="flex gap-3">
                                <select value={category} onChange={handleCategoryChange} disabled={!selectedMember} className="w-1/2 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none appearance-none disabled:opacity-50">
                                    <option value="">Välj mall...</option>
                                    {availableCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                </select>
                                <input value={link} onChange={e => setLink(e.target.value)} placeholder="Länk (frivillig)" className="w-1/2 bg-[#F7F4EE] rounded-xl px-3 py-2.5 font-bold text-sm outline-none" />
                            </div>
                            <div className="flex justify-end pt-2">
                                <button type="button" onClick={resetForm} className="text-xs font-bold text-[#1D2538]/40 hover:text-[#1D2538]">Avbryt / Stäng</button>
                            </div>
                        </div>
                    ) : (
                        <button type="button" onClick={() => setIsExpanded(true)} className="mt-1 text-xs font-bold text-[#E55835] flex items-center gap-1 ml-1">
                            <Plus size={14} /> Fler detaljer (Fritext, Länk, Person)
                        </button>
                    )}
                </form>

                <div className="space-y-3">
                    {activeItems.map(item => (
                        <div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4">
                            <button onClick={() => toggleComplete(item.id)} className="mt-1 flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#E55835]"></button>
                            <div className="flex-1">
                                <h4 className="font-black text-lg leading-tight">{item.title}</h4>
                                {item.details && <p className="text-xs font-bold text-[#1D2538]/60 mt-1">{item.details}</p>}
                                <div className="flex flex-wrap items-center gap-2 mt-2">
                                    {item.memberId && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg ${getTagColor(members.find(m => m.id === item.memberId)?.name)}`}>För: {members.find(m => m.id === item.memberId)?.name || 'Okänd'}</span>}
                                    {item.buyerId && <span className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#1D2538]/10 text-[#1D2538]">Köps av: {members.find(m => m.id === item.buyerId)?.name}</span>}
                                    {item.link && <a href={item.link} target="_blank" rel="noopener noreferrer" className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#E55835]/10 text-[#E55835] flex items-center gap-1">Länk</a>}
                                </div>
                            </div>
                            <div className="flex flex-col gap-2">
                                <button onClick={() => editItem(item)} className="text-[#1D2538]/30 hover:text-[#1D2538]"><Edit3 size={18} /></button>
                                <button onClick={() => deleteItem(item.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                            </div>
                        </div>
                    ))}
                </div>
                {completedItems.length > 0 && (
                    <div className="mt-8">
                        <h3 className="text-sm font-black text-[#1D2538]/40 uppercase tracking-widest mb-4 ml-2">Arkiv (Övrigt)</h3>
                        <div className="space-y-3 opacity-60">
                            {completedItems.map(item => (
                                <div key={item.id} className="bg-white/50 p-4 rounded-3xl border flex gap-4 items-center">
                                    <button onClick={() => toggleComplete(item.id)} className="flex-shrink-0 w-6 h-6 rounded-full bg-[#1D2538] text-white flex items-center justify-center"><Check size={14} /></button>
                                    <span className="flex-1 font-bold text-[#1D2538]/60 line-through">{item.title}</span>
                                    <button onClick={() => deleteItem(item.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
              </>
          ) : (
              <>
                <form onSubmit={handleGrocerySave} className="bg-white rounded-3xl shadow-sm border p-4 mb-6">
                    <div className="flex gap-2">
                        {/* Matvara först, Mängd sen (Enligt önskemål) */}
                        <input value={groceryItem} onChange={e => setGroceryItem(e.target.value)} placeholder="Matvara (t.ex. Mjölk)" className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />
                        <input value={groceryAmount} onChange={e => setGroceryAmount(e.target.value)} placeholder="Mängd (2L)" className="w-1/3 bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none" />
                        <button type="submit" disabled={!groceryItem.trim()} className="bg-[#E55835] text-white px-4 rounded-2xl font-bold disabled:opacity-50">{groceryEditingId ? 'Spara' : 'Lägg till'}</button>
                    </div>
                </form>

                <div className="space-y-3">
                    {activeGroceries.map(item => (
                        <div key={item.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center">
                            <button onClick={() => toggleGroceryComplete(item.id)} className="flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#E55835]"></button>
                            <div className="flex-1 text-sm">
                                <span className="font-black text-[#1D2538]">{item.title}</span>
                                {item.amount && <span className="ml-2 font-bold text-[#1D2538]/50">{item.amount}</span>}
                            </div>
                            <button onClick={() => editGrocery(item)} className="text-[#1D2538]/30 hover:text-[#1D2538] p-1"><Edit3 size={18} /></button>
                            <button onClick={() => deleteGrocery(item.id)} className="text-[#1D2538]/30 hover:text-[#581625] p-1"><Trash2 size={18} /></button>
                        </div>
                    ))}
                </div>

                {activeGroceries.length > 0 && (
                    <button onClick={() => {
                        const text = activeGroceries.map(g => `- ${g.title}${g.amount ? ' (' + g.amount + ')' : ''}`).join('\n');
                        try {
                            const textArea = document.createElement("textarea");
                            textArea.value = "Inköpslista Mat:\n" + text;
                            document.body.appendChild(textArea);
                            textArea.select();
                            document.execCommand("copy");
                            textArea.remove();
                            setCopyStatus('✅ Kopierad!');
                        } catch (err) { setCopyStatus('❌ Kunde inte kopiera'); }
                        setTimeout(() => setCopyStatus(''), 2500);
                    }} className="mt-4 w-full bg-[#1D2538]/5 text-[#1D2538] py-3 rounded-2xl font-black flex items-center justify-center gap-2 hover:bg-[#1D2538]/10 transition-colors">
                        <Copy size={18} /> {copyStatus || 'Kopiera listan (för SMS)'}
                    </button>
                )}

                {completedGroceries.length > 0 && (
                    <div className="mt-8">
                        <h3 className="text-sm font-black text-[#1D2538]/40 uppercase tracking-widest mb-4 ml-2">Arkiv (Mat)</h3>
                        <div className="space-y-3 opacity-60">
                            {completedGroceries.map(item => (
                                <div key={item.id} className="bg-white/50 p-4 rounded-3xl border flex gap-4 items-center">
                                    <button onClick={() => toggleGroceryComplete(item.id)} className="flex-shrink-0 w-6 h-6 rounded-full bg-[#1D2538] text-white flex items-center justify-center"><Check size={14} /></button>
                                    <span className="flex-1 font-bold text-[#1D2538]/60 line-through">{item.title} {item.amount}</span>
                                    <button onClick={() => deleteGrocery(item.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
              </>
          )}
        </div>
      );
    }

    // --- KALENDER ---
    function Calendar({ events, members, updateData, editItemId, setEditItemId }) {
      const [title, setTitle] = useState(''); 
      const [fromDate, setFromDate] = useState(''); 
      const [fromTime, setFromTime] = useState(''); 
      const [toDate, setToDate] = useState(''); 
      const [toTime, setToTime] = useState(''); 
      const [appliesToId, setAppliesToId] = useState(''); 
      const [responsibleId, setResponsibleId] = useState(''); 
      const [editingId, setEditingId] = useState(null); 
      const [showForm, setShowForm] = useState(false);

      useEffect(() => {
          if (editItemId) {
              const eventToEdit = events.find(e => e.id === editItemId);
              if (eventToEdit) {
                  editEvent(eventToEdit);
                  setEditItemId(null);
              }
          }
      }, [editItemId]);

      const handleSave = (e) => { 
          e.preventDefault(); 
          if (!title.trim() || !fromDate) return; 
          const newEvent = { id: editingId || generateId(), title, fromDate, fromTime, toDate, toTime, appliesToId, responsibleId }; 
          
          if (editingId) updateData('events', events.map(e => e.id === editingId ? newEvent : e));
          else updateData('events', [...events, newEvent]);
          
          resetForm();
      };
      
      const editEvent = (event) => {
        setTitle(event.title); setFromDate(event.fromDate); setFromTime(event.fromTime || ''); setToDate(event.toDate || ''); setToTime(event.toTime || '');
        setAppliesToId(event.appliesToId || ''); setResponsibleId(event.responsibleId || ''); setEditingId(event.id); setShowForm(true);
      };

      const deleteEvent = (id) => updateData('events', events.filter(e => e.id !== id));
      const resetForm = () => { setTitle(''); setFromDate(''); setFromTime(''); setToDate(''); setToTime(''); setAppliesToId(''); setResponsibleId(''); setEditingId(null); setShowForm(false); };

      const sortedEvents = [...events].sort((a, b) => {
        if (a.fromDate !== b.fromDate) return a.fromDate.localeCompare(b.fromDate);
        return (a.fromTime || '00:00').localeCompare(b.fromTime || '00:00');
      });

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto">
          {!showForm ? (
              <button onClick={() => setShowForm(true)} className="w-full bg-[#1D2538] text-white py-4 rounded-3xl font-black text-lg mb-6 shadow-md flex justify-center gap-2">
                  <Plus size={24} /> Ny händelse
              </button>
          ) : (
              <form onSubmit={handleSave} className="bg-white rounded-3xl shadow-md border p-5 mb-6">
                <h3 className="font-black text-lg text-[#1D2538] mb-4">{editingId ? 'Ändra händelse' : 'Ny händelse'}</h3>
                <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad händer?" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-4" />
                <div className="grid grid-cols-2 gap-3 mb-4">
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Från Datum</label>
                      <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" required />
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Från Tid</label>
                      <input type="time" value={fromTime} onChange={e => setFromTime(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" />
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Till Datum</label>
                      <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" />
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Till Tid</label>
                      <input type="time" value={toTime} onChange={e => setToTime(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none" />
                    </div>
                </div>
                
                <div className="grid grid-cols-2 gap-3 mb-5">
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Vem gäller det?</label>
                      <select value={appliesToId} onChange={e => setAppliesToId(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none appearance-none">
                        <option value="">Alla/Ingen specifik</option>
                        {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-[10px] font-black uppercase text-[#1D2538]/50 ml-1 mb-1 block">Ansvarig</label>
                      <select value={responsibleId} onChange={e => setResponsibleId(e.target.value)} className="w-full bg-[#F7F4EE] px-3 py-2.5 rounded-xl font-bold text-sm outline-none appearance-none">
                        <option value="">Ingen specifik</option>
                        {members.filter(m => m.role === 'Mamma' || m.role === 'Pappa').map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                      </select>
                    </div>
                </div>
                
                <div className="flex gap-2">
                    <button type="submit" className="flex-1 bg-[#581625] text-white py-3 rounded-2xl font-black">{editingId ? 'Spara' : 'Lägg till'}</button>
                    <button type="button" onClick={resetForm} className="px-5 bg-[#1D2538]/5 text-[#1D2538] py-3 rounded-2xl font-black">Avbryt</button>
                </div>
              </form>
          )}

          <div className="space-y-4">
              {sortedEvents.map(event => (
                  <div key={event.id} className="bg-white rounded-3xl p-5 shadow-sm border flex gap-4">
                      <div className="flex flex-col items-center justify-center bg-[#E55835]/10 text-[#E55835] rounded-2xl p-3 min-w-[70px]">
                          <span className="text-xs font-black">{event.fromDate.substring(5)}</span>
                          <span className="text-[10px] font-bold uppercase mt-1">{getLocalDayName(event.fromDate)}</span>
                      </div>
                      <div className="flex-1">
                          <h4 className="font-black text-[#1D2538] text-lg mb-1">{event.title}</h4>
                          <p className="text-xs font-bold text-[#1D2538]/50 flex items-center gap-1 mb-2">
                            <Clock size={12}/> {event.fromTime || 'Heldag'} {(event.toDate && event.toDate !== event.fromDate) ? ` (till ${event.toDate} ${event.toTime || ''})` : (event.toTime ? ` - ${event.toTime}` : '')}
                          </p>
                          <div className="flex flex-wrap gap-2">

    function TodoList({ todos, members, updateData, editItemId, setEditItemId }) {
        const [title, setTitle] = useState('');
        const [memberId, setMemberId] = useState('');
        const [dueDate, setDueDate] = useState('');
        const [notes, setNotes] = useState('');
        const [editingId, setEditingId] = useState(null);

        const activeTodos = todos.filter(t => !t.completed);
        const completedTodos = todos.filter(t => t.completed);

        useEffect(() => {
            if (editItemId) {
                const todoToEdit = todos.find(t => t.id === editItemId);
                if (todoToEdit) {
                    editTodo(todoToEdit);
                    setEditItemId(null);
                }
            }
        }, [editItemId]);

        const handleSave = (e) => {
            e.preventDefault();
            if (!title.trim()) return;
            if (editingId) {
                updateData('todos', todos.map(t => t.id === editingId ? { ...t, title, memberId, dueDate, notes } : t));
                setEditingId(null);
            } else {
                updateData('todos', [...todos, { id: generateId(), title, memberId, dueDate, notes, completed: false }]);
            }
            setTitle(''); setMemberId(''); setDueDate(''); setNotes('');
        };

        const editTodo = (t) => {
            setTitle(t.title); setMemberId(t.memberId || ''); setDueDate(t.dueDate || ''); setNotes(t.notes || ''); setEditingId(t.id);
        };

        const toggleComplete = (id) => updateData('todos', todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
        const deleteTodo = (id) => updateData('todos', todos.filter(t => t.id !== id));

        return (
            <div className="p-4 pb-32 h-full overflow-y-auto">
                <form onSubmit={handleSave} className={`bg-white rounded-3xl shadow-sm border p-4 mb-6 ${editingId ? 'ring-2 ring-[#1D2538] bg-[#1D2538]/5' : ''}`}>
                    <h3 className="text-xs font-black uppercase text-[#1D2538]/40 mb-3">{editingId ? 'Ändrar uppgift...' : 'Ny uppgift'}</h3>
                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Vad behöver göras?" className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold outline-none mb-3" />
                    
                    {/* Fritext-fält (Detaljer) */}
                    <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Fritext: Mer information, kod, länk..." className="w-full bg-[#F7F4EE] px-4 py-3 rounded-2xl font-bold text-sm outline-none mb-3" />
                    
                    <div className="flex gap-2">
                        <select value={memberId} onChange={e => setMemberId(e.target.value)} className="flex-1 bg-[#F7F4EE] px-3 py-3 rounded-2xl font-bold text-sm outline-none appearance-none">
                            <option value="">Vem ska göra detta?</option>
                            {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                        <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} className="bg-[#F7F4EE] px-3 py-3 rounded-2xl font-bold text-sm outline-none w-36" />
                    </div>
                    <div className="flex gap-2 mt-3">
                        <button type="submit" disabled={!title.trim()} className="flex-1 bg-[#1D2538] text-white px-5 py-3 rounded-2xl font-bold disabled:opacity-50">{editingId ? 'Spara' : 'Lägg till'}</button>
                        {editingId && <button type="button" onClick={() => {setEditingId(null); setTitle(''); setNotes(''); setMemberId(''); setDueDate('');}} className="px-4 text-xs font-bold text-[#1D2538]/50">Avbryt</button>}
                    </div>
                </form>

                <div className="space-y-3">
                    {activeTodos.map(todo => (
                        <div key={todo.id} className="bg-white p-4 rounded-3xl shadow-sm border flex gap-4 items-center">
                            <button onClick={() => toggleComplete(todo.id)} className="flex-shrink-0 w-6 h-6 rounded-full border-2 border-[#1D2538]/20 hover:border-[#1D2538]"></button>
                            <div className="flex-1">
                                <h4 className="font-black leading-tight text-lg">{todo.title}</h4>
                                {todo.notes && <p className="text-xs font-bold text-[#1D2538]/60 mt-1">{todo.notes}</p>}
                                <div className="flex items-center flex-wrap gap-2 mt-2">
                                    {todo.memberId && <span className={`inline-block text-[10px] font-bold px-2 py-0.5 rounded-lg ${getTagColor(members.find(m => m.id === todo.memberId)?.name)}`}>{members.find(m => m.id === todo.memberId)?.name}</span>}
                                    {todo.dueDate && <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded-lg bg-[#F7F4EE] text-[#1D2538]">Senast: {todo.dueDate}</span>}
                                </div>
                            </div>
                            <div className="flex flex-col gap-2">
                                <button onClick={() => editTodo(todo)} className="text-[#1D2538]/30 hover:text-[#1D2538]"><Edit3 size={18} /></button>
                                <button onClick={() => deleteTodo(todo.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                            </div>
                        </div>
                    ))}
                </div>

                {completedTodos.length > 0 && (
                    <div className="mt-8">
                        <h3 className="text-sm font-black text-[#1D2538]/40 uppercase tracking-widest mb-4 ml-2">Arkiv</h3>
                        <div className="space-y-3 opacity-60">
                            {completedTodos.map(todo => (
                                <div key={todo.id} className="bg-white/50 p-4 rounded-3xl border flex gap-4 items-center">
                                    <button onClick={() => toggleComplete(todo.id)} className="flex-shrink-0 w-6 h-6 rounded-full bg-[#1D2538] text-white flex items-center justify-center"><Check size={14} /></button>
                                    <span className="flex-1 font-bold text-[#1D2538]/60 line-through">{todo.title}</span>
                                    <button onClick={() => deleteTodo(todo.id)} className="text-[#1D2538]/30 hover:text-[#581625]"><Trash2 size={18} /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // --- MATSEDEL MED AI ---
    function MealPlanner({ meals, updateData, setActiveTab }) {
      const days = ['Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör', 'Sön'];
      const [activeWeek, setActiveWeek] = useState('current'); 
      const [isFetching, setIsFetching] = useState(false);
      const [showScraperFor, setShowScraperFor] = useState(null);
      const [portions, setPortions] = useState(4);
      const [successMsg, setSuccessMsg] = useState('');

      const handleChange = (day, field, value) => {
        updateData('meals', prev => ({
            ...prev,
            [activeWeek]: {
                ...prev[activeWeek],
                [day]: { ...prev[activeWeek][day], [field]: value }
            }
        }));
      };

      const fetchIngredients = async (day) => {
        const url = meals[activeWeek][day].link;
        if(!url) return;
        setIsFetching(true);
        try {
            const payload = {
                contents: [{ role: 'user', parts: [{ text: `Jag vill laga receptet från denna länk: ${url} för ${portions} personer. Läs receptet och ge mig enbart en lista med ingredienserna. Svara i strikt JSON-format som en array av objekt med formen {"amount": "mängd", "item": "ingrediens"}.` }] }],
                tools: [{ "google_search": {} }],
                generationConfig: { responseMimeType: "application/json" }
            };
            const apiKey = ""; // API Nyckel här i produktion
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            
            if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                const ingredients = JSON.parse(result.candidates[0].content.parts[0].text);
                const newGroceries = ingredients.map(ing => ({ id: generateId(), amount: ing.amount || '', title: ing.item || ing.title, completed: false }));
                updateData('groceries', prev => [...(prev || []), ...newGroceries]);
                
                setSuccessMsg('✅ Ingredienser tillagda i Inköpslistan!');
                setTimeout(() => setSuccessMsg(''), 4000);
            }
        } catch (error) {
            console.error("Kunde inte hämta recept:", error);
            setSuccessMsg('❌ Kunde tyvärr inte hämta receptet.');
            setTimeout(() => setSuccessMsg(''), 4000);
        }
        setIsFetching(false);
        setShowScraperFor(null);
      };

      return (
        <div className="p-4 pb-32 h-full overflow-y-auto relative">
          <div className="bg-gradient-to-br from-[#E55835] to-[#f07b5d] rounded-3xl p-6 text-white shadow-lg mb-6 relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-40 h-40 bg-white rounded-full opacity-10 blur-2xl"></div>
            <h2 className="text-2xl font-black mb-1 flex items-center gap-3 relative z-10"><Utensils size={24}/> Matsedel</h2>
            <p className="text-white/90 text-sm font-bold mt-1 relative z-10">Planera veckan & hämta ingredienser med AI.</p>
          </div>

          <div className="flex bg-[#F7F4EE] rounded-2xl p-1 mb-6 border shadow-inner">
             <button onClick={() => setActiveWeek('current')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeWeek === 'current' ? 'bg-white shadow-sm text-[#E55835]' : 'text-[#1D2538]/50'}`}>Denna vecka</button>
             <button onClick={() => setActiveWeek('next')} className={`flex-1 py-2.5 text-sm font-black rounded-xl transition-all ${activeWeek === 'next' ? 'bg-white shadow-sm text-[#1D2538]' : 'text-[#1D2538]/50'}`}>Nästa vecka</button>
          </div>

          {successMsg && (
            <div className="bg-[#1D2538] text-white p-4 rounded-2xl mb-5 font-bold text-center text-sm shadow-md animate-in slide-in-from-top-4">
              {successMsg}
            </div>
          )}

          <div className="space-y-4">
            {days.map(day => (
              <div key={day} className="bg-white p-4 rounded-3xl shadow-sm border border-[#1D2538]/5">
                <div className="flex items-center gap-4 mb-3">
                  <span className="font-black text-[#1D2538]/50 w-10 uppercase text-sm">{day}</span>
                  <input 
                    type="text" 
                    value={meals[activeWeek]?.[day]?.title || ''} 
                    onChange={(e) => handleChange(day, 'title', e.target.value)} 
                    placeholder="Vad ska vi äta?" 
                    className="flex-1 bg-[#F7F4EE] px-4 py-3 rounded-2xl text-sm font-bold outline-none text-[#1D2538]"
                  />
                </div>
                
                <div className="flex items-center gap-2 pl-14">
                   <input 
                    type="url" 
                    value={meals[activeWeek]?.[day]?.link || ''} 
                    onChange={(e) => handleChange(day, 'link', e.target.value)} 
                    placeholder="Länk till recept (frivilligt)" 
                    className="flex-1 bg-transparent px-2 py-1 text-[11px] font-bold outline-none text-[#E55835] placeholder-[#E55835]/40 border-b border-transparent focus:border-[#E55835]/30"
                  />
                  {meals[activeWeek]?.[day]?.link && (
                    <button onClick={() => setShowScraperFor(showScraperFor === day ? null : day)} className="bg-[#1D2538] text-white text-[10px] font-black px-3 py-1.5 rounded-xl flex items-center gap-1 hover:bg-[#581625] transition-colors shrink-0">
                      <Sparkles size={12}/> AI Köp
                    </button>
                  )}
                </div>

                {showScraperFor === day && (
                    <div className="mt-4 p-4 bg-[#F7F4EE] rounded-2xl border flex flex-col gap-3">
                        <label className="text-xs font-black text-[#1D2538]/70">Antal portioner:</label>
                        <div className="flex gap-2">
                            {[2,3,4,5,6,8].map(num => (
                                <button key={num} onClick={() => setPortions(num)} className={`w-10 h-10 rounded-xl font-black text-sm flex justify-center items-center ${portions === num ? 'bg-[#E55835] text-white shadow-md' : 'bg-white text-[#1D2538] border'}`}>{num}</button>
                            ))}
                        </div>
                        <div className="flex gap-2 mt-2">
                            <button onClick={() => fetchIngredients(day)} disabled={isFetching} className="flex-1 bg-[#1D2538] text-white py-2.5 rounded-xl text-xs font-black flex justify-center items-center gap-2 disabled:opacity-50">
                                {isFetching ? <Loader2 size={14} className="animate-spin" /> : <ShoppingCart size={14} />}
                                {isFetching ? 'Skapar lista...' : 'Hämta ingredienser'}
                            </button>
                            <button onClick={() => setShowScraperFor(null)} className="px-4 bg-white text-[#1D2538] py-2.5 rounded-xl text-xs font-black border">Avbryt</button>
                        </div>
                    </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }
